# golangci-lint configuration for the SHINGO monorepo.
# Targets golangci-lint v2.x syntax (installed: v2.11.4).
#
# Primary guardrail: www handlers must not import *store.DB directly.
# Handlers that currently do are listed under `exclusions.rules` as
# ratcheted exemptions. Each entry comes off the list as its handler is
# migrated off *store.DB during Phase 3 (core) and Phase 4 (edge) of the
# architecture refactor. When the ratcheted-exemption list hits zero, the
# entire `exclusions.rules` block below (except the two permanent
# `engine_iface.go` / `*_test.go` carveouts) can be deleted, leaving the
# rule as a permanent regression guard.

version: "2"

# Report every issue, not a sample. golangci-lint defaults to
# `max-same-issues: 3` and `max-issues-per-linter: 50`, which silently
# TRUNCATE the report: on 2026-07-20 a run over 11 unformatted files
# printed only 3 gofmt entries and dropped the other 8 without a word.
# A truncated report is worse than a verbose one — the CI log reads as
# "3 problems" when there are 11, so you fix 3, push, and CI goes red
# again on the next 3. Repeat until the surprises run out, which is
# exactly the wrong time to discover them (that run was the night
# before a plant visit). 0 = unlimited on both, so the first run shows
# the whole list.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0

# gofmt is a formatter in golangci-lint v2 (not a linter); it must live here,
# not under linters.enable, or config load fails with "gofmt is a formatter".
# `golangci-lint run` reports unformatted files as issues, keeping the gofmt
# CI gate.
formatters:
  enable:
    - gofmt

linters:
  # PR 1 is scoped to the depguard guardrail only. Start from zero and
  # enable depguard explicitly, so pre-existing errcheck/staticcheck/unused
  # findings across the repo don't block the PR that lands this config.
  # A follow-up PR can enable the standard linter set and tackle the
  # code-quality backlog as its own tracked piece of work.
  default: none
  enable:
    - depguard
    - forbidigo
    - funlen
    - govet
    - staticcheck
    - unused

  settings:
    staticcheck:
      # golangci-lint v2 folds stylecheck (ST) and quickfix (QF) into the
      # staticcheck linter and enables both by default. Scope staticcheck to its
      # bug (SA) and simplification (S) checks and defer the pre-existing ST/QF
      # style backlog (~37 findings under golangci-lint's default, ~282 under a
      # raw `staticcheck` run with every check enabled), per this file's "enable
      # explicitly; don't block on pre-existing findings" philosophy. A follow-up
      # PR can enable ST/QF and clear that backlog as tracked work.
      checks:
        - all
        - -ST1*
        - -QF1*
    funlen:
      # STATEMENTS, NOT LINES — and the distinction is the whole point.
      #
      # This repo runs about 0.65 comment lines per code line, and dispatch/
      # runs far higher; compound.go is 2.4:1. A line-based ceiling would
      # therefore fire mostly on prose, and the cheapest way to clear it would
      # be to delete the incident narrative that makes these functions
      # maintainable. That is an actively harmful incentive, so lines is off.
      #
      # Statements also auto-exempt the flat registries, which is the right
      # answer for a different reason: shingo-edge/store/migrations.go's
      # migrationList is one statement across ~931 lines, and both NewRouter
      # functions and wireEventHandlers pass comfortably. A registry read
      # top-to-bottom is the point of a registry; splitting one to satisfy a
      # linter makes it worse.
      #
      # 60 was measured, not guessed: at this threshold the repo has 39
      # production offenders (29 core, 10 edge, 0 in protocol/shared/
      # integration), which is a baseline someone can actually work down.
      lines: -1
      statements: 60
      ignore-comments: true
    forbidigo:
      # State-machine bypass guard (Stage 10 follow-up). Direct calls to
      # the order-status atomic writes must go through
      # dispatch.LifecycleService typed methods. Carveouts for legitimate
      # bypass paths are listed in `exclusions.rules` below alongside the
      # depguard ratchet entries.
      #
      # Text-based matching. The receiver variable is always named `db`
      # in this codebase and only *store.DB has these methods, so
      # matching on `db\.<Method>` is sufficient. forbidigo matches the
      # selector expression (e.g. `db.UpdateOrderStatus`) — do NOT
      # append `\(` because the parenthesis is syntax, not the identifier.
      forbid:
        - pattern: 'db\.UpdateOrderStatus'
          msg: "Direct UpdateOrderStatus calls bypass the state machine. Use dispatch.LifecycleService typed methods (CancelOrder, ConfirmReceipt, Release, MarkInTransit, MarkStaged, MarkDelivered, Queue, MoveToSourcing, Dispatch, Fail, Acknowledge, BeginReshuffle, CompleteCompound, MarkPending). See docs/order-state-machine/transitions.md."
        - pattern: 'db\.FailOrderAtomic'
          msg: "Direct FailOrderAtomic calls bypass the state machine. Use dispatch.LifecycleService.Fail."
        - pattern: 'db\.CancelOrderAtomic'
          msg: "Direct CancelOrderAtomic calls bypass the state machine. Use dispatch.LifecycleService.CancelOrder."
        # Reservation-sourcing bypass guard. Bin claims must go through the
        # reserve→claim→confirm sequence (BinManifestService.ClaimForDispatch),
        # which holds a revocable reservation across the decide→do gap; a bare
        # db.ClaimBin reopens the claim race. This is the guard that would have
        # caught the five production claim sites that slipped ClaimForDispatch
        # before the seatbelt landed. Sanctioned callers (ClaimForDispatch itself
        # + the test helper) are carved out in exclusions.rules #6 below.
        - pattern: 'db\.ClaimBin'
          msg: "Direct ClaimBin calls bypass reservation-sourcing (reserve→claim→confirm, which closes the decide→do claim gap). Claim through service.BinManifestService.ClaimForDispatch; in tests use testdb.ClaimBinForTest."
        # Source-finder collapse guard. The plant-wide bin finders are
        # the LAST tier of dispatch.SourceFinder; calling them directly re-opens the
        # intake↔scanner-replay drift the collapse fixed (dropped loader-pool and
        # group-scoped-empty scoping → wrong-source-on-replay). Route source finding
        # through dispatch.SourceFinder.FindSource. The FindEmptyCompatibleBin pattern
        # also prefix-matches FindEmptyCompatibleBinInGroup. Sanctioned callers
        # (source_finder.go itself; complex_steps.go folded through the finder in C(i)) are carved
        # out in exclusions.rules #7 below.
        - pattern: 'db\.FindSourceBinFIFO'
          msg: "Direct FindSourceBinFIFO calls bypass the shared source seam. Route through dispatch.SourceFinder.FindSource (source_finder.go)."
        - pattern: 'db\.FindEmptyCompatibleBin'
          msg: "Direct FindEmptyCompatibleBin(InGroup) calls bypass the shared source seam. Route through dispatch.SourceFinder.FindSource (source_finder.go)."
        # The TYPED empty finders, added with maintained groups (MG2). Same guard,
        # same reason, and it matters more here than for the payload-matched
        # finders: a maintained group's asks are empty pulls, and an empty pulled
        # outside the seam skips the group scoping and the tier order that decide
        # WHICH empty — which is the drift that produced wrong-source-on-replay
        # for the untyped finders. `db\.FindEmptyBinOfType` prefix-matches
        # FindEmptyBinOfTypeInGroup, so one pattern covers both.
        #
        # IT MUST NOT CATCH THE COUNT. db.CountEmptyBinsOfTypeInGroup is the level
        # keeper's `resident` term — a read of how many are standing there, not a
        # selection of which one to move — and it is REQUIRED to share a WHERE
        # spelling with the finder it mirrors (bins.EmptyOfTypeInGroupWhere), which
        # is the opposite of bypassing the seam. The pattern does not match it:
        # the count's name has no "Find" in it. That is load-bearing, not luck, and
        # renaming either one has to keep it true.
        #
        # source_finder.go IS the seam and calls both directly; it is already
        # carved out by exclusions.rules #7, which keys on this message's text —
        # so the wording below must keep saying "bypass the shared source seam".
        - pattern: 'db\.FindEmptyBinOfType'
          msg: "Direct FindEmptyBinOfType(InGroup) calls bypass the shared source seam. Route through dispatch.SourceFinder.FindSource (source_finder.go). The COUNT of the same population (db.CountEmptyBinsOfTypeInGroup) is a read, not a selection, and is not covered by this guard."
        # Unclaim-inverse guard. Clearing bins.claimed_by WITHOUT releasing
        # the coupled reservation orphans a confirmed reservation and bricks the bin
        # via uq_reservations_bin_active — the exact failure the coupled release
        # helpers exist to prevent. The db.UnclaimBin / db.UnclaimOrderBins / service
        # wrappers were deleted; these guard the SURVIVING store-level primitives so
        # a new caller is steered to the coupled inverse instead of re-opening the
        # brick. `bins\.Unclaim` prefix-matches `bins.UnclaimByOrder`; the binsstore
        # alias (used in dispatch) gets its own entry. This is the release-direction
        # twin of the db.ClaimBin claim-direction guard above. Sanctioned callers:
        # the definition file (declarations don't match a `pkg.Fn` selector) and
        # tests (the blanket _test.go carveout under exclusions.rules).
        - pattern: 'bins\.Unclaim'
          msg: "Direct bins.Unclaim(ByOrder) clears claimed_by WITHOUT releasing the coupled reservation, orphaning a confirmed reservation and bricking the bin (uq_reservations_bin_active). Use the coupled inverse db.ReleaseClaimForBin / db.ReleaseClaimByOrder (store/orders.go)."
        - pattern: 'binsstore\.Unclaim'
          msg: "Direct binsstore.Unclaim(ByOrder) clears claimed_by WITHOUT releasing the coupled reservation. Use db.ReleaseClaimForBin / db.ReleaseClaimByOrder (store/orders.go)."
        # Slot-claim seatbelt guard. nodes.ClaimSlot / db.ClaimSlot — the
        # un-seatbelted slot CAS — were deleted (the hard slot loop, their only
        # production caller, was removed). The live slot claim is the
        # reservation-guarded ClaimSlotTx via db.ConfirmSlotClaim (reserve → guarded
        # claim → confirm, one tx). These patterns stop a raw slot claim from being
        # reintroduced — the slot twin of the db.ClaimBin guard above. The `\b` keeps
        # `nodes.ClaimSlot` from prefix-matching `nodes.ClaimSlotTx` (the sanctioned
        # path). Fixture setup uses testdb.ClaimSlotForTest (a raw claim, in testdb —
        # covered by the blanket _test.go carveout under exclusions.rules).
        - pattern: 'nodes\.ClaimSlot\b'
          msg: "Direct nodes.ClaimSlot is the un-seatbelted slot CAS (deleted). Claim a slot through db.ConfirmSlotClaim (reserve→guarded claim→confirm); in tests use testdb.ClaimSlotForTest."
        - pattern: 'db\.ClaimSlot\b'
          msg: "Direct db.ClaimSlot bypasses the slot reservation seatbelt (deleted). Use db.ConfirmSlotClaim; in tests use testdb.ClaimSlotForTest."
        # Order-builder Stage 5: OrderType is DATA, not a control-flow key.
        # dispatch + fulfillment must not branch on an order's .OrderType —
        # route on plan provenance (IsCoordinated), SourceIntent, or the
        # resolvedStep plan data the order-builder stages moved that logic onto.
        # This guard is SCOPED to shingo-core/dispatch + fulfillment by the
        # `path-except` exclusion below (the shared config runs on all three
        # modules, and protocol/edge read OrderType legitimately). Legitimate
        # touch-points inside the scope (wire→internal normalization + telemetry,
        # the intake handler map, the emit interface, SourceIntentForType, and the
        # AssertSimpleHasNoSteps tripwire) are carved out by path, below.
        # `\b` after OrderType keeps this from matching the OrderType* constants
        # (protocol.OrderTypeMove etc.); a bare `OrderType:` struct-literal key
        # has no leading dot and never matches.
        - pattern: '\.OrderType\b'
          msg: "OrderType is data, not a control-flow key: dispatch/fulfillment must route on plan provenance (IsCoordinated), SourceIntent, or resolvedStep data — not order.OrderType. See order-builder Stage 5."

        # Raw bin-move guard. The one-bin-per-physical-node occupancy discipline
        # fail-closes in service.BinService.Move; the arrival writers reconcile
        # stale ghosts via helpers.EvictStaleGhostBinsTx. A raw bin move bypasses
        # BOTH. Plant-verified 2026-07-08: the vendor fleet does NOT physically
        # block a double-drop's RECORD (only the physical placement), so that
        # service-layer occupancy fail-close is the only bin-on-bin backstop —
        # route bin moves through service.BinService.Move. Sanctioned store-level
        # delegates that BinService.Move composes are carved out in
        # exclusions.rules below (keyed on the "occupancy fail-close" message so
        # only THIS guard is relaxed there). The un-reconciled db.MoveBin twin was
        # deleted outright (zero production callers). The `\b` keeps bins.Move
        # from prefix-matching bins.MoveAndClearStaging (its own entry).
        - pattern: 'bins\.Move\b'
          msg: "Direct bins.Move bypasses the service-layer occupancy fail-close (BinService.Move) and the arrival ghost-reconciliation. Route bin moves through service.BinService.Move."
        - pattern: 'db\.MoveBinClearingStaging'
          msg: "Direct db.MoveBinClearingStaging bypasses the service-layer occupancy fail-close (BinService.Move). Route bin moves through service.BinService.Move."
        - pattern: 'bins\.MoveAndClearStaging'
          msg: "Direct bins.MoveAndClearStaging bypasses the service-layer occupancy fail-close (BinService.Move). Route bin moves through service.BinService.Move."

        # Note on swap-mode constants: forbidigo can only match identifier
        # expressions (selector exprs like `db.UpdateOrderStatus`), not
        # string literals. The swap-mode raw-string guard is enforced by
        # `scripts/check-swap-mode-literals.sh` instead — see that script
        # and protocol/swap_mode.go.

    depguard:
      rules:
        www-no-direct-store:
          list-mode: lax
          files:
            - "**/shingo-core/www/**"
            - "**/shingo-edge/www/**"
          deny:
            - pkg: "shingocore/store"
              desc: "www handlers must use a service interface, not *store.DB directly"
            - pkg: "shingoedge/store"
              desc: "www handlers must use a service interface, not *store.DB directly"

        # ── dispatch sub-package isolation ────────────────────────────────
        #
        # dispatch/ is being decomposed outward: binresolver, binsource and eta
        # were carved OUT of it. A sub-package importing the parent back would
        # re-close that seam and make the extraction cosmetic, so the direction
        # is enforced rather than remembered. Verified clean when this rule
        # landed (2026-08-19) — it is a regression guard, not a migration.
        #
        # THE ALLOW ENTRY IS LOAD-BEARING, not decoration. depguard matches deny
        # entries by PREFIX, so `pkg: shingocore/dispatch` on its own also
        # matches shingocore/dispatch/binsource, and binresolver's entirely
        # legitimate import of binsource fails. Confirmed by running it. The
        # longer allow prefix wins for sibling imports and leaves the bare
        # parent import denied; both halves were verified against a probe
        # back-import before this landed. Do not delete the allow entry as
        # redundant.
        dispatch-sub-pkg-isolation:
          list-mode: lax
          files:
            - "**/shingo-core/dispatch/*/**"
          allow:
            - "shingocore/dispatch/"
          deny:
            - pkg: "shingocore/dispatch"
              desc: "dispatch sub-packages must not import the parent back — the extraction direction is out of dispatch/, not into it"

        # ── Phase 6.0c: store sub-package isolation ──────────────────────
        #
        # Each store sub-package owns one aggregate. Cross-aggregate
        # orchestration lives at the outer store/ level (in files like
        # completion.go, station_views.go, station_nodes.go, etc.) which
        # are exempted via the file-pattern below.
        #
        # The allow-list block captures the one legitimate cross-aggregate
        # import: shingo-edge/store/reconciliation/ reads
        # shingo-edge/store/messaging/'s MaxRetries constant when computing
        # pending vs. dead-letter outbox counts.
        store-sub-pkg-isolation:
          list-mode: lax
          files:
            - "**/shingo-core/store/*/**"
            - "**/shingo-edge/store/*/**"
            - "!**/shingo-core/store/internal/**"
            - "!**/shingo-edge/store/internal/**"
          deny:
            - pkg: "shingocore/store/admin"
            - pkg: "shingocore/store/audit"
            - pkg: "shingocore/store/bins"
            - pkg: "shingocore/store/cms"
            - pkg: "shingocore/store/demands"
            - pkg: "shingocore/store/diagnostics"
            - pkg: "shingocore/store/downtime"
            - pkg: "shingocore/store/inventory"
            - pkg: "shingocore/store/messaging"
            - pkg: "shingocore/store/nodes"
            - pkg: "shingocore/store/orders"
            - pkg: "shingocore/store/payloads"
            - pkg: "shingocore/store/recovery"
            - pkg: "shingocore/store/registry"
            - pkg: "shingocore/store/scene"
            - pkg: "shingocore/store/schema"
            - pkg: "shingocore/store/telemetry"
            - pkg: "shingoedge/store/admin"
            - pkg: "shingoedge/store/catalog"
            - pkg: "shingoedge/store/counters"
            - pkg: "shingoedge/store/lineside"
            - pkg: "shingoedge/store/orders"
            - pkg: "shingoedge/store/processes"
            - pkg: "shingoedge/store/schema"
            - pkg: "shingoedge/store/shifts"
            - pkg: "shingoedge/store/stations"

  exclusions:
    rules:

      # ---- funlen: tests are out of scope (permanent) ----------------------
      #
      # A table-driven test IS a long list of statements; that is the shape
      # working as intended, and the same reasoning as the blanket forbidigo
      # and depguard carveouts below. The ceiling is a production guardrail.
      - path: ".*_test\\.go"
        linters:
          - funlen

      # ---- funlen baseline (2026-08-19) ------------------------------------
      #
      # 39 production functions exceeded 60 statements on the day funlen was
      # enabled (40 entries: the D6 cut split one of them in two). They are listed rather than the threshold being raised to
      # clear them, because a threshold set above the worst offender guards
      # nothing: the point of the ceiling is that the NEXT one fails CI.
      #
      # Each entry is pinned to a function NAME as well as a path, so a second
      # oversized function appearing in an excluded file is still caught.
      #
      # Two classes:
      #   permanent    — the shape is correct and a split would make it worse
      #                  (composition roots, flat registries, fixture builders).
      #   transitional — should come off this list. Remove the entry in the
      #                  same commit that shrinks the function; do not raise
      #                  the threshold and do not delete comments to fit.
      # main: permanent
      # Composition root. The wiring order IS the program; splitting it into
      # helpers moves the order somewhere you have to reassemble by hand.
      - path: "shingo-core/cmd/shingocore/main\\.go"
        text: "Function 'main' has too many statements"
        linters:
          - funlen
      # main: permanent
      # Composition root, same reason as core's.
      - path: "shingo-edge/cmd/shingoedge/main\\.go"
        text: "Function 'main' has too many statements"
        linters:
          - funlen
      # setupKafkaSubscribers: permanent
      # A flat subscriber registry. Registration order is delivery order, so this
      # reads top-to-bottom on purpose.
      - path: "shingo-edge/cmd/shingoedge/main\\.go"
        text: "Function 'setupKafkaSubscribers' has too many statements"
        linters:
          - funlen
      # migrate: permanent
      # The migration driver. Append-only by construction and it grows one step
      # per schema change; that growth is the design, not decay.
      - path: "shingo-edge/store/migrations\\.go"
        text: "Function 'migrate' has too many statements"
        linters:
          - funlen
      # seedCore: permanent
      # Dev-only fixture builder: a flat sequence of INSERTs describing one plant.
      - path: "shingo-core/cmd/seeddev/seed_core\\.go"
        text: "Function 'seedCore' has too many statements"
        linters:
          - funlen
      # seedBinLoaders: permanent
      # Dev-only fixture builder, as above.
      - path: "shingo-core/cmd/seeddev/seed_core\\.go"
        text: "Function 'seedBinLoaders' has too many statements"
        linters:
          - funlen
      # seedEdgeDB: permanent
      # Dev-only fixture builder, as above.
      - path: "shingo-core/cmd/seeddev/seed_edge\\.go"
        text: "Function 'seedEdgeDB' has too many statements"
        linters:
          - funlen
      # SetupCompound: permanent
      # Test-fixture builder that lives outside _test.go so several packages can
      # share it. Excluded for the same reason the blanket _test.go rule exists.
      - path: "shingo-core/internal/testdb/compound\\.go"
        text: "Function 'SetupCompound' has too many statements"
        linters:
          - funlen
      # Validate: permanent
      # A flat validation registry: one independent check per rule, each a couple
      # of statements. Splitting it scatters the rule set without simplifying any
      # rule.
      - path: "shingo-core/plantspec/validate\\.go"
        text: "Function 'Validate' has too many statements"
        linters:
          - funlen
      # FindSourceForNeed: transitional
      # Owner decision D7: whether tier extraction reduces or CONCENTRATES the
      # fall-through risk is a study question, and no code moves before it
      # reports. Do not clear this entry by refactoring on your own judgement.
      - path: "shingo-core/dispatch/source_finder\\.go"
        text: "Function 'FindSourceForNeed' has too many statements"
        linters:
          - funlen
      # AdvanceCompoundOrder: transitional
      # Owner decision D6 funds the chapter-close extraction only; the dispatch
      # half waits for the north-star unification. That cut landed on
      # 2026-08-19 and took this function from 136 statements to 74. The rest
      # is the dispatch half and its four recursion sites, which are deferred
      # by D6 — do not clear this entry by refactoring on your own judgement.
      - path: "shingo-core/dispatch/compound\\.go"
        text: "Function 'AdvanceCompoundOrder' has too many statements"
        linters:
          - funlen
      # RollUp: transitional
      # Explicitly out of scope for the 2026-08-19 easy-wins wave.
      - path: "shingo-core/store/robotconfidence/rollup\\.go"
        text: "Function 'RollUp' has too many statements"
        linters:
          - funlen
      # BuildView: transitional
      # Explicitly out of scope for the 2026-08-19 easy-wins wave.
      - path: "shingo-edge/service/station_service\\.go"
        text: "Function 'BuildView' has too many statements"
        linters:
          - funlen
      # apiDashboardNodeReport: transitional
      # Explicitly out of scope for the 2026-08-19 easy-wins wave.
      - path: "shingo-core/www/handlers_dashboards\\.go"
        text: "Function 'apiDashboardNodeReport' has too many statements"
        linters:
          - funlen
      # computeCarriers: transitional
      - path: "shingo-core/cmd/simcalc/carriers\\.go"
        text: "Function 'computeCarriers' has too many statements"
        linters:
          - funlen
      # checkInvariants: transitional
      - path: "shingo-core/cmd/soakstat/main\\.go"
        text: "Function 'checkInvariants' has too many statements"
        linters:
          - funlen
      # shuffleSlotsFrom: transitional
      - path: "shingo-core/dispatch/reshuffle\\.go"
        text: "Function 'shuffleSlotsFrom' has too many statements"
        linters:
          - funlen
      # SourceabilityPage: transitional
      - path: "shingo-core/engine/sourceability_page\\.go"
        text: "Function 'SourceabilityPage' has too many statements"
        linters:
          - funlen
      # handleVendorStatusChange: transitional
      - path: "shingo-core/engine/wiring_vendor_status\\.go"
        text: "Function 'handleVendorStatusChange' has too many statements"
        linters:
          - funlen
      # tryFulfill: transitional
      - path: "shingo-core/fulfillment/scanner\\.go"
        text: "Function 'tryFulfill' has too many statements"
        linters:
          - funlen
      # syncOrClearForReleased: transitional
      - path: "shingo-core/service/bin_manifest\\.go"
        text: "Function 'syncOrClearForReleased' has too many statements"
        linters:
          - funlen
      # LocalizationBoardAt: transitional
      - path: "shingo-core/service/localization_board\\.go"
        text: "Function 'LocalizationBoardAt' has too many statements"
        linters:
          - funlen
      # ApplyBinUOPDelta: transitional
      - path: "shingo-core/uop/applier\\.go"
        text: "Function 'ApplyBinUOPDelta' has too many statements"
        linters:
          - funlen
      # apiReparentNode: transitional
      - path: "shingo-core/www/handlers_nodegroup\\.go"
        text: "Function 'apiReparentNode' has too many statements"
        linters:
          - funlen
      # apiTestCommandSubmit: transitional
      - path: "shingo-core/www/handlers_test_orders_commands\\.go"
        text: "Function 'apiTestCommandSubmit' has too many statements"
        linters:
          - funlen
      # createSnapshotArchive: transitional
      - path: "shingo-edge/backup/snapshot\\.go"
        text: "Function 'createSnapshotArchive' has too many statements"
        linters:
          - funlen

      # ---- Structural exemptions (permanent) --------------------------------
      # engine_iface.go is the service-interface definition itself; it must
      # reference store types to define the contract. Test files need store
      # types to build fixtures. Neither category ever migrates off store.
      - path: "shingo-(core|edge)/www/engine_iface\\.go"
        linters:
          - depguard
      - path: "shingo-(core|edge)/www/.*_test\\.go"
        linters:
          - depguard

      # Cross-aggregate exception (Phase 6.0c): both modules' reconciliation
      # packages read the messaging.MaxOutboxRetries constant to compute
      # pending vs. dead-letter outbox counts. The single import is
      # documented at the package level in
      # shingo-(core|edge)/store/reconciliation/reconciliation.go.
      - path: "shingo-(core|edge)/store/reconciliation/.*\\.go"
        linters:
          - depguard

      # store-sub-pkg-isolation is a PRODUCTION guardrail: it stops a store
      # sub-package (e.g. store/bins) from importing a sibling aggregate
      # (e.g. store/orders), because cross-aggregate orchestration belongs at
      # the outer store/ level. Test files were never in scope until the
      # docker-tagged lint pass landed (the //go:build docker tests are the
      # only Go in these dirs that the default-config pass didn't compile) —
      # which surfaced 23 depguard hits that are ALL test fixtures:
      #   - 17 black-box self-imports (e.g. store/admin/admin_test.go,
      #     package admin_test, importing shingocore/store/admin): a package
      #     testing its own exported surface — the standard Go idiom, and a
      #     shape production code can never have (a package never imports
      #     itself). No code fix exists.
      #   - 6 cross-import fixtures (e.g. store/bins/bins_test.go importing
      #     store/nodes): a *_test binary reaching for a type to build a
      #     fixture. It never ships, so it cannot create the dependency-
      #     direction tangle the rule guards against.
      # Production code in every store sub-package is clean (verified: no
      # non-test file in store/<sub>/ imports a sibling aggregate; the only
      # cross-package import is the allow-listed shingocore/store/internal/
      # helpers). Carving the tests out costs zero production protection —
      # it scopes the rule to its documented intent, same principle as the
      # www *_test.go carveout above and the blanket *_test.go forbidigo
      # carveout below ("test files need store types to build fixtures").
      # Permanent: a *_test package importing the package(s) it exercises is
      # inherent to black-box testing.
      - path: "shingo-(core|edge)/store/[^/]+/.*_test\\.go"
        linters:
          - depguard

      # ---- State-machine bypass carveouts (forbidigo) ----------------------
      # Each entry below names a file that legitimately bypasses
      # LifecycleService.transition. Document the reason inline before
      # adding to this list. Removable once the bypass is migrated.
      #
      # 1. The driver itself.
      - path: "shingo-core/dispatch/lifecycle\\.go"
        linters:
          - forbidigo
      # 2. Initial-write Pending in the order-intake methods
      #    (CreateInboundOrder, CreateStorageWaybillOrder,
      #    CreateIngestStoreOrder). No source status to validate.
      - path: "shingo-core/dispatch/lifecycle_service\\.go"
        linters:
          - forbidigo
      # 3. Child-intake validation failures in compound order creation
      #    (missing source/dest node) — failure is the intended initial
      #    state, not a transition. SCOPED to the state-machine message
      #    (was whole-file): compound.go is one of the two files Stage 4
      #    re-homed OrderType reads OUT of, so it must stay under the Stage-5
      #    OrderType guard — a whole-file forbidigo exemption would leave a
      #    future order.OrderType dispatch read uncaught in exactly the file we
      #    refactored. It trips forbidigo only via 3 FailOrderAtomic calls, so
      #    excusing just that message keeps the OrderType/claim/slot guards live.
      - path: "shingo-core/dispatch/compound\\.go"
        text: "bypass the state machine"
        linters:
          - forbidigo
      # 4. Passthrough wrappers around db.UpdateOrderStatus and
      #    FailOrderAtomic. Slated for removal — callers should go
      #    direct to lifecycle. Carveout removable when the file is
      #    deleted.
      - path: "shingo-core/service/order_service\\.go"
        linters:
          - forbidigo
      # 5. Store-level implementations themselves.
      - path: "shingo-core/store/orders\\.go"
        linters:
          - forbidigo
      # 6. Sanctioned bin-claim callers (db.ClaimBin guard). ClaimForDispatch
      #    is the reserve→claim→confirm path the guard points everyone else to,
      #    so its own db.ClaimBin call is the one that must be allowed; the
      #    testdb helper builds fixtures and isn't named *_test.go, so the
      #    blanket _test.go carveout below misses it.
      - path: "shingo-core/service/bin_manifest\\.go"
        linters:
          - forbidigo
      - path: "shingo-core/internal/testdb/.*\\.go"
        linters:
          - forbidigo
      # 6b. testharness re-exports internal/testdb fixtures across the module
      #     boundary (the integration module can't import internal/). Its
      #     ClaimBinForTest wrapper trips the db.ClaimBin pattern by substring
      #     (`testdb.ClaimBinForTest` contains `db.ClaimBin`) — same sanctioned
      #     test-fixture category as #6.
      - path: "shingo-core/testharness/.*\\.go"
        linters:
          - forbidigo
      # 7. Sanctioned source-finder callers (db.FindSourceBinFIFO /
      #    db.FindEmptyCompatibleBin guard). source_finder.go IS the
      #    shared seam — its own plant-wide-fallback calls are the ones everyone
      #    else routes through. SCOPED to the source-seam message (was whole-file):
      #    source_finder.go is the other file Stage 4 re-homed OrderType reads out
      #    of (the moveShaped read → SourceIntent), so it must stay under the
      #    Stage-5 OrderType guard. It trips forbidigo only via its 3 plant-wide
      #    fallback calls, so excusing just that message keeps the OrderType/claim/
      #    slot guards live on the rest of the file.
      #    complex_steps.go formerly held the last inline copy (resolveStepNode);
      #    C(i) folded it through the finder and DELETED its whole-file arm --
      #    verified by dry run: zero forbidigo findings on the file with the arm
      #    removed. Only the message-scoped source_finder.go arm remains.
      - path: "shingo-core/dispatch/source_finder\\.go"
        text: "bypass the shared source seam"
        linters:
          - forbidigo
      # 8. Edge lifecycle driver — equivalent to #1 for the edge module.
      - path: "shingo-edge/orders/lifecycle_service\\.go"
        linters:
          - forbidigo
      # 9. Edge store-level implementation.
      - path: "shingo-edge/store/orders\\.go"
        linters:
          - forbidigo

      # ---- Order-builder Stage 5: OrderType control-flow guard ----------------
      # The forbidigo pattern '\.OrderType\b' (in settings above) forbids
      # branching on an order's type. Two exclusions shape it; both key on the
      # guard's message so ONLY this rule is relaxed — the state-machine / claim /
      # slot forbidigo guards still apply to every file below.
      #
      # 10a. Scope to the shingo-core/dispatch + fulfillment packages proper. The
      #      pattern lives in the shared config CI runs against all three modules,
      #      and protocol + edge read OrderType legitimately; path-except turns the
      #      rule OFF wherever the path does NOT match. The `[^/]+\.go$` tail keeps
      #      it to the top-level files of those two packages — the dispatch DECISION
      #      layer — and off the type-aware resolver primitives beneath them
      #      (dispatch/binresolver, dispatch/binsource), whose Resolve/Source
      #      signatures legitimately take an orderType argument.
      - linters:
          - forbidigo
        text: "OrderType is data, not a control-flow key"
        path-except: "shingo-core/(dispatch|fulfillment)/[^/]+\\.go$"
      # 10b. Legitimate OrderType touch-points INSIDE the scope:
      #        dispatcher.go        — wire p.OrderType telemetry + the
      #                               RegisterPlanner(protocol.OrderType) type param
      #        emitter.go           — EmitOrderReceived(protocol.OrderType) type param
      #        order_provenance.go  — SourceIntentForType label→data conversion +
      #                               the AssertSimpleHasNoSteps tripwire switch
      #        planning_service.go  — the intake handler map key
      #                               s.handlers[order.OrderType] (data-driven
      #                               dispatch, the pattern we WANT) + its
      #                               unknown-type error string
      #      (lifecycle_service.go, compound.go, source_finder.go, complex_steps.go
      #      are already fully forbidigo-exempt via #2/#3/#7 above.)
      - linters:
          - forbidigo
        text: "OrderType is data, not a control-flow key"
        path: "shingo-core/dispatch/(dispatcher|emitter|order_provenance|planning_service)\\.go"

      # ---- Raw bin-move carveouts (forbidigo) -------------------------------
      # The sanctioned store-level delegates that service.BinService.Move
      # composes ARE the route every other caller is steered to:
      #   store/bins.go        — db.MoveBinClearingStaging wrapper +
      #                          its bins.MoveAndClearStaging primitive call
      #   service/bin_service.go — BinService.Move, the occupancy fail-close
      #                          itself, calls db.MoveBinClearingStaging
      # Scoped to the guard's message so only the raw-bin-move rule is relaxed in
      # these two files — the state-machine / claim / slot / OrderType guards stay
      # live. Removable if the move helpers are ever folded into BinService.
      - path: "shingo-core/store/bins\\.go"
        text: "occupancy fail-close"
        linters:
          - forbidigo
      - path: "shingo-core/service/bin_service\\.go"
        text: "occupancy fail-close"
        linters:
          - forbidigo

      # Test files build fixtures by direct DB writes. Permanent.
      - path: ".*_test\\.go"
        linters:
          - forbidigo

      # No ratcheted www-no-direct-store exemptions remain.
      #
      # Stage 2A.2 (2026-04) drained the original 17-file ratchet by
      # extending shingo-core/domain and creating shingo-edge/domain
      # to hold the data types referenced by www handlers. Handlers
      # now import the domain package(s) for type names; the store
      # sub-packages keep `type X = domain.X` aliases so internal
      # store callers compile unchanged. With no remaining
      # exemptions, the www-no-direct-store rule is a permanent
      # architectural guardrail: any new direct
      # shingocore/store or shingoedge/store import inside www/ fails
      # CI and the offending PR has to route through a service
      # interface or domain types.
      #
      # If a future change legitimately needs to bypass the rule —
      # e.g. a temporary migration step — add a new entry here with
      # an inline comment that explains the reason and a removal
      # plan. Do not leave undocumented exemptions.
