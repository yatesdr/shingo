# plants/kanban-press.yaml — the Kanban certification rig.
#
# A permanent sim fixture, not a model of a plant. Its shape comes from a two-off press
# at Springfield (Press 6: one press, left and right, four positions, an unloader that
# re-types carts); every name, part and number here is synthetic. It runs on Edge 1
# (station edge1.line1) alone: SHINGO_PLANT=/plants/kanban-press.yaml, no edge2.
# The runs, what each catches and how to drive them: docs/fleet-simulator/kanban.md and
# scripts/kanban-rig.sh. Pinned by plantspec TestKanbanPressPlant_* and cmd/seeddev
# TestKanbanPressFixture_* / TestSeedKanbanPress_*. Its loop runs in the docker shards:
# cmd/seeddev TestKanbanRig_*.
#
# ── THE LOOP. Produce and consume are one circular problem ─────────────────────────────
#
#   PRESS-KANBAN ──(empties)──→ KP-PRESS (4 positions) ──(fulls)──→ PRESS-UNLOAD (4 windows)
#        ↑                                                               │
#        └──────── the unloader's CLEAR: PUSH AS the lit type ───────────┘
#
#   WELD-KANBAN  ──(empties)──→ KW-WELD (two-robot)    ──(fulls)──→ WELD-UNLOAD (2 windows)
#        ↑                                                               │
#        └──────────────────────── CLEAR ────────────────────────────────┘
#
#   ONE LINESIDE KANBAN FOR THE PRESS, no sources, no overflow: every carrier the press
#   ever runs stands in it.
#   KP-SM  a plain supermarket, no level, SEEDED EMPTY. A keeper with no sources searches
#          plant-wide (bins.EmptyFence), so any empty standing here is pulled into a short
#          kanban at once: R5 puts a cart here by hand to show it (R17a).
#
# The unloaders ARE the consumers: a press's full goes straight to a window (no market,
# no weld drawing it), a person takes the parts off, and the empty goes back. So nothing
# here is a payload balance to tune: a part's fills and drains are one rate by
# construction, and the ticks only set how often a cart goes round.
#
# ── K'S SIXTEEN SLOTS ──────────────────────────────────────────────────────────────────
#
#   PKB_001..010  admit SMALL-45, BIG-45, TOTES-45
#   PKB_011..016  admit CART-32
#
# THE FILE CANNOT SAY THAT. plantspec.Slot has a name and a depth and the seeder writes no
# node_bin_types, so the allowed types are set after the seed through what the Nodes page's
# modal posts: scripts/kanban-rig.sh apply_slot_types, the docker tests' rigSlotTypes. A
# plant seeded from this file alone has all sixteen slots open to every type, and the
# arithmetic below does not hold on it.
#
# ── THE CLOCK ──────────────────────────────────────────────────────────────────────────
#
# Rates (shingo-edge/shingoedge.dev.yaml, sim.processes; simcalc reads them):
#
#   KP-PRESS  tick 20s, 3 parts/min per position, pack 30 -> a pair of carts every 10 sim-min
#             = 0.20 carts/min drawn from PRESS-KANBAN and 0.20/min coming back
#   KW-WELD   tick 15s, 4 parts/min, pack 30               -> one cart every 7.5 sim-min
#             = 0.13 carts/min drawn from WELD-KANBAN and 0.13/min coming back
#
# Both loops balance, so in steady state nothing drains: 40 press carts and 27 weld carts
# in a 200 sim-minute run (20 wall-minutes at the rig's 10x), and the stock at the end is
# the stock at the start. With a return stopped there is no lender behind either kanban:
# PRESS-KANBAN's 2 small last 10 sim-min and WELD-KANBAN's 2 last 15. `simcalc -carriers`
# prints these as THE CLOCK.
#
# ── THE POOL ───────────────────────────────────────────────────────────────────────────
#
# Levels small 2, big 2, totes 2, 32x30 2, cover 4. Want is base + cover x processes running
# the type (store.KanbanPictureSQL). One process is one, however many positions it holds, so
# under KP-SMALL K wants small 6, big 2, totes 2, 32x30 2.
#
#   45x48 carts, 10                              small  big  totes
#     the press's 4 positions                        4               4
#     PRESS-KANBAN, PKB_001..006                     2    2    2     6
#   32x30 carts, 6: all in PRESS-KANBAN, PKB_011..016
#   The weld's own, 3: WELD-KANBAN 2 small, its position 1 small
#   KP-SM: none
#
# SO K'S CARD READS SMALL WANT 6, RESIDENT 2, on the running type, whatever the run: its 4 of
# cover are the 4 carts standing on the positions. K is 4 short for as long as the press runs,
# nothing outside it can source one, and the card says "no empty SMALL-45 outside the group".
# `simcalc -carriers` reads that seat as BELOW WANT by 4 and ends WILL JAM, exit 1. That is true
# of the seat and is left true; `simcalc` with no flag reads SUSTAINS.
#
# NOTHING IS SEEDED FOR THE WINDOWS OR FOR CARTS IN FLIGHT. `simcalc -carriers` asks for no
# allowance for either: its in-flight line is plant-wide context, 7 required against 19 seeded,
# and it judges K's pool on its want. A pair leaving the press is drawn from K's 2 small and the
# pair at the windows is lit small and comes straight back: a round trip is about 3 sim-min
# against a 10 sim-min cycle, so one pair is out at a time.
#
# ── LEAVING THE FLOOR ──────────────────────────────────────────────────────────────────
#
# A changeover within 45x48 conserves: K's cover moves from one type to another of the same
# floor and the unloader re-types the carts. Leaving the floor does not. Under KP-32:
#
#   45x48: K wants 2/2/2 = 6 of the 10 carts, and stands at that. The 4 off the positions
#          are lit nothing, PUSH EMPTY, and refused at K's level with no source and no overflow
#          (plan.Planner.ChoosePush): they park named at K, one on each of the 4 windows.
#   32x30: K wants 6 and the positions 4, from 6 carts: K is 4 short.
#
# The same on the way back: under KP-SMALL, K's 32x30 want is 2, so 4 of the 6 have no level
# to land on once they have left K. As seeded they stand above their want in their own slots.
# `simcalc -carriers` prints both under CHANGEOVER ROOM. Neither is tuned away here: what the
# press does with no window left is what the rig's R3 and W runs are for.

namespace: edge1
line_id: line1

# THREE TYPES ON ONE FLOOR AND ONE ON ANOTHER, floor sizes entered on all four, which is
# what bounds a cart's PUSH AS to its own family (domain.BinType.FloorSize). Every bin
# below names its type: bin_types[0] is only a seeder's fallback.
bin_types: [SMALL-45, BIG-45, TOTES-45, CART-32]

carrier_sizes:
  SMALL-45: {width_in: 48, length_in: 45, height_in: 25}
  BIG-45:   {width_in: 48, length_in: 45, height_in: 34}
  TOTES-45: {width_in: 48, length_in: 45, height_in: 6}   # a pallet
  CART-32:  {width_in: 32, length_in: 30, height_in: 25}

payloads:
  # KP-SMALL runs two parts, left and right, on one type: the running-type rule counts
  # the process once for the type, not once per part.
  - {code: KP-SM-L, uop_capacity: 30, bin_type: SMALL-45}
  - {code: KP-SM-R, uop_capacity: 30, bin_type: SMALL-45}
  - {code: KP-BIG,  uop_capacity: 30, bin_type: BIG-45}
  - {code: KP-TOTE, uop_capacity: 30, bin_type: TOTES-45}
  - {code: KP-32,   uop_capacity: 30, bin_type: CART-32}
  # DELIBERATELY NO CARRIER: the part a plant has not typed yet. It contributes nothing
  # to a running type and the process is named on the kanban's card. No run changes over
  # to it; it is here so the card's sentence has something real to say.
  - {code: KP-UNTYPED, uop_capacity: 30, no_bin_type: true}
  - {code: KW-PART, uop_capacity: 30, bin_type: SMALL-45}

zones:
  # K. Sixteen flat children, ten of the 45x48 floor and six of 32x30: the head says how
  # they get their types.
  - name: PRESS-KANBAN
    retrieve_algorithm: FIFO
    store_algorithm: LKND
    positions:
      - {name: PKB_001, depth: 1}
      - {name: PKB_002, depth: 1}
      - {name: PKB_003, depth: 1}
      - {name: PKB_004, depth: 1}
      - {name: PKB_005, depth: 1}
      - {name: PKB_006, depth: 1}
      - {name: PKB_007, depth: 1}
      - {name: PKB_008, depth: 1}
      - {name: PKB_009, depth: 1}
      - {name: PKB_010, depth: 1}
      - {name: PKB_011, depth: 1}
      - {name: PKB_012, depth: 1}
      - {name: PKB_013, depth: 1}
      - {name: PKB_014, depth: 1}
      - {name: PKB_015, depth: 1}
      - {name: PKB_016, depth: 1}
  # K2. The weld's own, so R6 can show that one lineside kanban does not raid another.
  - name: WELD-KANBAN
    retrieve_algorithm: FIFO
    store_algorithm: LKND
    positions:
      - {name: WKB_001, depth: 1}
      - {name: WKB_002, depth: 1}
      - {name: WKB_003, depth: 1}
      - {name: WKB_004, depth: 1}
  # SM. A plain supermarket: lanes, no level, nobody counts it, seeded empty. Its slots are
  # the room for the one cart R5 carries here by hand.
  - name: KP-SM
    retrieve_algorithm: FIFO
    store_algorithm: LKND
    wait_points: [KP-SM-WAIT]
    lanes:
      - {name: KP_SM_L1, slots: [{name: KSM_001, depth: 1}, {name: KSM_002, depth: 2}]}
      - {name: KP_SM_L2, slots: [{name: KSM_003, depth: 1}, {name: KSM_004, depth: 2}]}
      - {name: KP_SM_L3, slots: [{name: KSM_005, depth: 1}, {name: KSM_006, depth: 2}]}
      - {name: KP_SM_L4, slots: [{name: KSM_007, depth: 1}, {name: KSM_008, depth: 2}]}
  # The press's unloader, as a group of windows: the press's outbound names the group and
  # Core takes a free window (Springfield's Press Unloader is this shape).
  - name: PRESS-UNLOAD
    retrieve_algorithm: FIFO
    store_algorithm: LKND
    positions:
      - {name: ULN_021, depth: 1}
      - {name: ULN_022, depth: 1}
      - {name: ULN_023, depth: 1}
      - {name: ULN_024, depth: 1}
  - name: WELD-UNLOAD
    retrieve_algorithm: FIFO
    store_algorithm: LKND
    positions:
      - {name: ULN_031, depth: 1}
      - {name: ULN_032, depth: 1}

stations:
  # Two-off, left and right. Each claim is a front and a back; the back indexes to the
  # front. Four positions, two per side, and the kanban supports all four.
  - {name: PLN_021, kind: press}     # left front
  - {name: PLN_022, kind: press}     # left back
  - {name: PLN_023, kind: press}     # right front
  - {name: PLN_024, kind: press}     # right back
  - {name: ALN_021, kind: weld}      # the weld's position
  - {name: SLN_021, kind: staging}   # the weld's inbound stage

processes:
  - {name: KP-PRESS, active_style: KP-SMALL}
  - {name: KW-WELD, active_style: KW-RUN}
  - {name: KP-UNLOAD, active_style: KP-UNLOAD-RUN}
  - {name: KW-UNLOAD, active_style: KW-UNLOAD-RUN}

styles:
  - {name: KP-SMALL, process: KP-PRESS, payload: KP-SM-L}
  - {name: KP-BIG, process: KP-PRESS, payload: KP-BIG}
  - {name: KP-TOTES, process: KP-PRESS, payload: KP-TOTE}
  - {name: KP-32, process: KP-PRESS, payload: KP-32}
  - {name: KP-UNTYPED, process: KP-PRESS, payload: KP-UNTYPED}
  - {name: KW-RUN, process: KW-WELD, payload: KW-PART}
  - {name: KP-UNLOAD-RUN, process: KP-UNLOAD, payload: KP-SM-L}
  - {name: KW-UNLOAD-RUN, process: KW-UNLOAD, payload: KW-PART}

# An unloader station holding only its windows draws kind `grid` (operator-board-model.js
# boardLayout), so a tap on an empty is the PUSH EMPTY / PUSH AS panel. Keep the windows
# off any other station: a press tile beside them would still read grid, a loader's would
# not.
operator_stations: [KP-PRESS-OPS, KW-WELD-OPS, KP-UNLOAD-OPS, KW-UNLOAD-OPS]

claims:
  # ── KP-PRESS. Same four positions under every style, so a changeover is a swap on each.
  # No evac marks and no staging: a part change here is the per-position changeover, whose
  # old carts leave through outbound_destination. That is the path the kanban's cover and
  # the unloader's re-type have to carry.
  - {core_node: PLN_021, style: KP-SMALL, role: produce, swap_mode: two_robot_press_index, payload: KP-SM-L, uop_capacity: 30, auto_reorder: true, paired_core_node: PLN_022, inbound_source: PRESS-KANBAN, outbound_destination: PRESS-UNLOAD, operator_station: KP-PRESS-OPS}
  - {core_node: PLN_023, style: KP-SMALL, role: produce, swap_mode: two_robot_press_index, payload: KP-SM-R, uop_capacity: 30, auto_reorder: true, paired_core_node: PLN_024, inbound_source: PRESS-KANBAN, outbound_destination: PRESS-UNLOAD, operator_station: KP-PRESS-OPS}
  - {core_node: PLN_021, style: KP-BIG, role: produce, swap_mode: two_robot_press_index, payload: KP-BIG, uop_capacity: 30, auto_reorder: true, paired_core_node: PLN_022, inbound_source: PRESS-KANBAN, outbound_destination: PRESS-UNLOAD, operator_station: KP-PRESS-OPS}
  - {core_node: PLN_023, style: KP-BIG, role: produce, swap_mode: two_robot_press_index, payload: KP-BIG, uop_capacity: 30, auto_reorder: true, paired_core_node: PLN_024, inbound_source: PRESS-KANBAN, outbound_destination: PRESS-UNLOAD, operator_station: KP-PRESS-OPS}
  - {core_node: PLN_021, style: KP-TOTES, role: produce, swap_mode: two_robot_press_index, payload: KP-TOTE, uop_capacity: 30, auto_reorder: true, paired_core_node: PLN_022, inbound_source: PRESS-KANBAN, outbound_destination: PRESS-UNLOAD, operator_station: KP-PRESS-OPS}
  - {core_node: PLN_023, style: KP-TOTES, role: produce, swap_mode: two_robot_press_index, payload: KP-TOTE, uop_capacity: 30, auto_reorder: true, paired_core_node: PLN_024, inbound_source: PRESS-KANBAN, outbound_destination: PRESS-UNLOAD, operator_station: KP-PRESS-OPS}
  - {core_node: PLN_021, style: KP-32, role: produce, swap_mode: two_robot_press_index, payload: KP-32, uop_capacity: 30, auto_reorder: true, paired_core_node: PLN_022, inbound_source: PRESS-KANBAN, outbound_destination: PRESS-UNLOAD, operator_station: KP-PRESS-OPS}
  - {core_node: PLN_023, style: KP-32, role: produce, swap_mode: two_robot_press_index, payload: KP-32, uop_capacity: 30, auto_reorder: true, paired_core_node: PLN_024, inbound_source: PRESS-KANBAN, outbound_destination: PRESS-UNLOAD, operator_station: KP-PRESS-OPS}
  - {core_node: PLN_021, style: KP-UNTYPED, role: produce, swap_mode: two_robot_press_index, payload: KP-UNTYPED, uop_capacity: 30, auto_reorder: true, paired_core_node: PLN_022, inbound_source: PRESS-KANBAN, outbound_destination: PRESS-UNLOAD, operator_station: KP-PRESS-OPS}
  - {core_node: PLN_023, style: KP-UNTYPED, role: produce, swap_mode: two_robot_press_index, payload: KP-UNTYPED, uop_capacity: 30, auto_reorder: true, paired_core_node: PLN_024, inbound_source: PRESS-KANBAN, outbound_destination: PRESS-UNLOAD, operator_station: KP-PRESS-OPS}

  # ── KW-WELD. A produce cell that asks ahead: 10 ticks x 15 s gives the empty 2.5 sim-min
  # to reach the stage, the round trip on this stack. Fills on the same floor as the press.
  - {core_node: ALN_021, style: KW-RUN, role: produce, swap_mode: two_robot, payload: KW-PART, uop_capacity: 30, reorder_point: 20, auto_reorder: true, inbound_source: WELD-KANBAN, inbound_staging: SLN_021, outbound_destination: WELD-UNLOAD, operator_station: KW-WELD-OPS}

  # ── THE UNLOADERS. Single stage, one shared loader over its windows. No inbound source:
  # each is fed directly by the cell it serves, so it asks for no full and Core's auto_push
  # has nothing to pull, which is why this file sets no loader_settings. KP-UNTYPED is on
  # the list because the validator's parity holds for every part a style names.
  - {core_node: ULN_021, style: KP-UNLOAD-RUN, role: consume, swap_mode: manual_swap, allowed_payloads: [KP-SM-L, KP-SM-R, KP-BIG, KP-TOTE, KP-32, KP-UNTYPED], outbound_destination: PRESS-KANBAN, window_of: KP-UNLOADER, operator_station: KP-UNLOAD-OPS}
  - {core_node: ULN_022, style: KP-UNLOAD-RUN, role: consume, swap_mode: manual_swap, allowed_payloads: [KP-SM-L, KP-SM-R, KP-BIG, KP-TOTE, KP-32, KP-UNTYPED], outbound_destination: PRESS-KANBAN, window_of: KP-UNLOADER, operator_station: KP-UNLOAD-OPS}
  - {core_node: ULN_023, style: KP-UNLOAD-RUN, role: consume, swap_mode: manual_swap, allowed_payloads: [KP-SM-L, KP-SM-R, KP-BIG, KP-TOTE, KP-32, KP-UNTYPED], outbound_destination: PRESS-KANBAN, window_of: KP-UNLOADER, operator_station: KP-UNLOAD-OPS}
  - {core_node: ULN_024, style: KP-UNLOAD-RUN, role: consume, swap_mode: manual_swap, allowed_payloads: [KP-SM-L, KP-SM-R, KP-BIG, KP-TOTE, KP-32, KP-UNTYPED], outbound_destination: PRESS-KANBAN, window_of: KP-UNLOADER, operator_station: KP-UNLOAD-OPS}
  - {core_node: ULN_031, style: KW-UNLOAD-RUN, role: consume, swap_mode: manual_swap, allowed_payloads: [KW-PART], outbound_destination: WELD-KANBAN, window_of: KW-UNLOADER, operator_station: KW-UNLOAD-OPS}
  - {core_node: ULN_032, style: KW-UNLOAD-RUN, role: consume, swap_mode: manual_swap, allowed_payloads: [KW-PART], outbound_destination: WELD-KANBAN, window_of: KW-UNLOADER, operator_station: KW-UNLOAD-OPS}

bins:
  # K, seated for steady on KP-SMALL: the head's table.
  - {name: KB-K-S1, slot: PKB_001, bin_type: SMALL-45}
  - {name: KB-K-S2, slot: PKB_002, bin_type: SMALL-45}
  - {name: KB-K-B1, slot: PKB_003, bin_type: BIG-45}
  - {name: KB-K-B2, slot: PKB_004, bin_type: BIG-45}
  - {name: KB-K-T1, slot: PKB_005, bin_type: TOTES-45}
  - {name: KB-K-T2, slot: PKB_006, bin_type: TOTES-45}
  - {name: KB-K-C1, slot: PKB_011, bin_type: CART-32}
  - {name: KB-K-C2, slot: PKB_012, bin_type: CART-32}
  - {name: KB-K-C3, slot: PKB_013, bin_type: CART-32}
  - {name: KB-K-C4, slot: PKB_014, bin_type: CART-32}
  - {name: KB-K-C5, slot: PKB_015, bin_type: CART-32}
  - {name: KB-K-C6, slot: PKB_016, bin_type: CART-32}
  # The press's positions: a cart filling at each front, a staged empty at each back.
  # Without one at the front seeddev binds no runtime and the cell never counts.
  - {name: KB-P-LF, slot: PLN_021, bin_type: SMALL-45}
  - {name: KB-P-LB, slot: PLN_022, bin_type: SMALL-45}
  - {name: KB-P-RF, slot: PLN_023, bin_type: SMALL-45}
  - {name: KB-P-RB, slot: PLN_024, bin_type: SMALL-45}
  # K2 at its want, and the weld's cart.
  - {name: KB-K2-S1, slot: WKB_001, bin_type: SMALL-45}
  - {name: KB-K2-S2, slot: WKB_002, bin_type: SMALL-45}
  - {name: KB-W-F, slot: ALN_021, bin_type: SMALL-45}

# One counter per process. A reporting point moves with the style at cutover
# (Engine.SyncProcessCounter; TestCounterSeed_StyleRepointOnTheSameTagKeepsCounting), so
# one row on the seed's style counts under all of them. plc_name is the process's name
# because simcalc keys rates on it, and both match sim.processes in shingoedge.dev.yaml.
reporting_points:
  - {plc_name: KP-PRESS, tag_name: KP-PRESS_COUNTER, node: PLN_021, style: KP-SMALL}
  - {plc_name: KW-WELD, tag_name: KW-WELD_COUNTER, node: ALN_021, style: KW-RUN}

cell_configs:
  - {process: KP-PRESS, station: KP-PRESS-OPS}
  - {process: KW-WELD, station: KW-WELD-OPS}
  - {process: KP-UNLOAD, station: KP-UNLOAD-OPS}
  - {process: KW-UNLOAD, station: KW-UNLOAD-OPS}

kanbans:
  # K: 2/2/2/2, cover 4. No sources and no overflow: its keeper searches plant-wide and finds
  # what stands in the plain supermarket, and a push it is whole of parks named at it.
  - group: PRESS-KANBAN
    station: edge1.line1
    strict: false
    running_cover: 4
    levels:
      - {bin_type: SMALL-45, want: 2}
      - {bin_type: BIG-45, want: 2}
      - {bin_type: TOTES-45, want: 2}
      - {bin_type: CART-32, want: 2}
    supports: [KP-PRESS]
  # K2: wants 2 while the weld runs small. No sources and no overflow, its own 3 carts: the
  # weld's one style never leaves the family (simcalc's CHANGEOVER ROOM says it fits).
  - group: WELD-KANBAN
    station: edge1.line1
    strict: false
    running_cover: 1
    levels:
      - {bin_type: SMALL-45, want: 1}
    supports: [KW-WELD]
