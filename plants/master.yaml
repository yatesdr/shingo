  - {name: P5-L-33, slot: PLN_533, bin_type: SMALL-45}
  - {name: P5-L-34, slot: PLN_534, bin_type: SMALL-45}
  - {name: P5-L-41, slot: PLN_541, bin_type: SMALL-45}
  - {name: P5-L-42, slot: PLN_542, bin_type: SMALL-45}
  - {name: P5-L-43, slot: PLN_543, bin_type: SMALL-45}
  - {name: P5-L-44, slot: PLN_544, bin_type: SMALL-45}
  - {name: P5-L-51, slot: PLN_551, bin_type: SMALL-45}
  - {name: P5-L-52, slot: PLN_552, bin_type: SMALL-45}
  - {name: P5-L-53, slot: PLN_553, bin_type: SMALL-45}
  - {name: P5-L-54, slot: PLN_554, bin_type: SMALL-45}

  # ══ [window] line 2, on EDGE 2 ═══════════════════════════════════════════════════════════════
  # PACKED FROM THE BACK — each seeded carrier sits at its lane's DEEPEST slot and
  # the mouth stays open. See the zone comment for why the other way round is
  # refused at birth.
  - {name: L2-BW-01, slot: SMN_L2_002, payload: PART-W, uop: 20, bin_type: STANDARD-L2}
  - {name: L2-BW-02, slot: SMN_L2_004, payload: PART-W, uop: 20, bin_type: STANDARD-L2}
  # PART-X seeded FULL and waiting: the A to B changeover pulls from here, and the
  # whole scenario depends on that material being ready to land inside the gap.
  # ONE PER CELL THAT CLAIMS IT, and the count is not decoration: L2-B claims
  # PART-X at PRS_010, PRS_010B and PRS_011, so an A to B changeover needs three
  # PART-X carriers AT ONCE. Seeded with two, the third cell sat in
  # awaiting_material forever and the changeover could not complete — which
  # reads exactly like a code defect and is a fixture that cannot count.
  - {name: L2-BX-01, slot: SMN_L2_006, payload: PART-X, uop: 20, bin_type: STANDARD-L2}
  - {name: L2-BX-02, slot: SMN_L2_008, payload: PART-X, uop: 20, bin_type: STANDARD-L2}
  - {name: L2-BX-03, slot: SMN_L2_017, payload: PART-X, uop: 20, bin_type: STANDARD-L2}
  # AND ONE MORE, so the three-cell style can swap (see the arithmetic at the top).
  - {name: L2-BX-04, slot: SMN_L2_021, payload: PART-X, uop: 20, bin_type: STANDARD-L2}
  # Somewhere for finished PART-Y to go.
  - {name: L2-BY-01, slot: SMN_L2_010, payload: PART-Y, uop: 20, bin_type: STANDARD-L2}
  # Empty carriers — the spares the arithmetic above insists on.
  - {name: L2-MT-01, slot: SMN_L2_012, payload: "", uop: 0, bin_type: STANDARD-L2}
  - {name: L2-MT-02, slot: SMN_L2_014, payload: "", uop: 0, bin_type: STANDARD-L2}
  - {name: L2-MT-03, slot: SMN_L2_019, payload: "", uop: 0, bin_type: STANDARD-L2}
  - {name: L2-MT-04, slot: SMN_L2_022, payload: "", uop: 0, bin_type: STANDARD-L2}
  - {name: L2-MT-05, slot: SMN_L2_023, payload: "", uop: 0, bin_type: STANDARD-L2}
  - {name: L2-MT-06, slot: SMN_L2_024, payload: "", uop: 0, bin_type: STANDARD-L2}
  - {name: L2-MT-07, slot: SMN_L2_025, payload: "", uop: 0, bin_type: STANDARD-L2}

  # ── CARRIERS AT THE CELLS. Without one, seeddev binds no runtime state for the
  # node (it needs a bin AT the claim's node), the PLC tick has nothing to
  # attribute to, and the cell never counts — the loop looks configured and does
  # nothing. Seeded ABOVE the reorder point so the first tick is not an instant
  # replenishment against a cell that has just been handed a full carrier.
  - {name: L2-AT-P10, slot: PRS_010, payload: PART-W, uop: 20, bin_type: STANDARD-L2}
  - {name: L2-AT-P11, slot: PRS_011, payload: PART-W, uop: 20, bin_type: STANDARD-L2}
  # The produce cell starts with an EMPTY carrier to fill.
  - {name: L2-AT-W10, slot: WLD_010, payload: "", uop: 0, bin_type: STANDARD-L2}
  - {name: L2-AT-P10B, slot: PRS_010B, payload: PART-W, uop: 20, bin_type: STANDARD-L2}

processes:

  # ══ [demo] the demo loop ═════════════════════════════════════════════════════════════════════
  - {name: PRESS-1, active_style: PRESS-1-RUN,        # two_robot_press_index → PANEL-A
     parts: [PANEL-D]}                                  # a part with no style yet (pick-a-part)
  - {name: PRESS-2, active_style: PRESS-2-RUN}        # A/B sequential → PANEL-B
  - {name: WELD-1,  active_style: WELD-1-RUN}         # two_robot: PANEL-A → ASSY
  - {name: WELD-2,  active_style: WELD-2-RUN}         # single_robot: PANEL-B + BRKT → ASSY
  - {name: WELD-3,  active_style: WELD-3-RUN}         # two_robot consume CLIP (single-window loader leg)
  - {name: WELD-4,  active_style: WELD-4-RUN}         # two_robot consume STUD (second single-window loader leg)
  - {name: WELD-5,  active_style: WELD-5-RUN}          # two_robot consume SHIM, swapping against a dedicated loader home
  - {name: LOADER-SHIM, active_style: LOADER-SHIM-RUN}   # manual_swap DEDICATED-POSITIONS SHIM (home PLK_H1 + 3 buffers)
  - {name: LOADER-COMP, active_style: LOADER-COMP-RUN}   # manual_swap multi-window BRKT (no PLC; sim-operator-driven)
  - {name: LOADER-CLIP, active_style: LOADER-CLIP-RUN}   # manual_swap single-window CLIP
  - {name: LOADER-STUD, active_style: LOADER-STUD-RUN}   # manual_swap single-window STUD
  - {name: UNLOADER-A, active_style: UNLOADER-A-RUN}  # drains ASSY (main circle)
  # Loaders have no single station — their windows/positions are per-node operator stations
  # (PLK_W1/2-OPS, PLK_X1-OPS, PLK_X2-OPS), declared via operator_station on the claims below.

  # ══ [4x2] WELD-6 and its loaders ═════════════════════════════════════════════════════════════
  - {name: WELD-6, active_style: WELD-6-RUN}                # two_robot, five consume positions, two styles
  - {name: LOADER-COMMON-1, active_style: LOADER-COMMON-1-RUN}  # manual_swap single-window COMMON-1
  - {name: LOADER-COMMON-2, active_style: LOADER-COMMON-2-RUN}  # manual_swap single-window COMMON-2
  - {name: LOADER-COMMON-3, active_style: LOADER-COMMON-3-RUN}  # manual_swap single-window COMMON-3
