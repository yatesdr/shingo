  - name: SYN_COMP
    retrieve_algorithm: FIFO
    store_algorithm: LKND
    wait_points: [LSC-C1-WAIT, LSC-C5-WAIT, LSC-C8-WAIT]
    lanes:
      - name: LS_C1
        slots: [{name: LSC_001, depth: 1}, {name: LSC_002, depth: 2}, {name: LSC_003, depth: 3}, {name: LSC_004, depth: 4}]
      - name: LS_C2
        slots: [{name: LSC_005, depth: 1}, {name: LSC_006, depth: 2}, {name: LSC_007, depth: 3}, {name: LSC_008, depth: 4}]
      - name: LS_C3
        slots: [{name: LSC_009, depth: 1}, {name: LSC_010, depth: 2}, {name: LSC_011, depth: 3}, {name: LSC_012, depth: 4}]
