  # ══ [kanban] the kanban press and weld ═══════════════════════════════════════════════════════
  # THE KANBAN CERTIFICATION CELLS (kanban-press.yaml until the master).
  #
  # A permanent sim fixture, not a model of a plant: a two-off press (one press, left and
  # right, four positions, an unloader that re-types carts) and a weld, every name, part and
  # number synthetic. The runs, what each catches and how to drive them:
  # docs/dev-env/kanban-rig.md and scripts/kanban-rig.sh. Pinned by plantspec
  # TestKanbanPressPlant_* and cmd/seeddev TestKanbanPressFixture_* / TestSeedKanbanPress_*;
  # its loop runs in the docker shards as cmd/seeddev TestKanbanRig_*.
  #
  # ── THE LOOP. Produce and consume are one circular problem ─────────────────────────────
  #
  #   PRESS-KANBAN ──(empties)──→ KP-PRESS (4 positions) ──(fulls)──→ PRESS-UNLOAD (4 windows)
  #        ↑                                                               │
  #        └──────── the unloader's CLEAR: PUSH AS the lit type ───────────┘
  #
  #   WELD-KANBAN  ──(empties)──→ KW-WELD (two-robot)    ──(fulls)──→ WELD-UNLOAD (2 windows)
  #        ↑                                                               │
  #        └──────────────────────── CLEAR ────────────────────────────────┘
  #
  #   ONE LINESIDE KANBAN FOR THE PRESS, no sources: every carrier the press ever runs stands in
  #   it, and a family's carts are on the line or in the buffer.
  #   KP-SM  a plain supermarket, no level, STOCKED WITH 45x48 EMPTIES. A keeper with no sources
  #          searches plant-wide (bins.EmptyFence), so this is what a keeper asking per type would
  #          raid. It must never lose a cart while K's family is whole.
  #
  # The unloaders ARE the consumers: a press's full goes straight to a window (no market,
  # no weld drawing it), a person takes the parts off, and the empty goes back. So nothing
  # here is a payload balance to tune: a part's fills and drains are one rate by
  # construction, and the ticks only set how often a cart goes round.
  #
  # ── K'S SIXTEEN SLOTS ──────────────────────────────────────────────────────────────────
  #
  #   PKB_001..010  admit the 45x48 family
  #   PKB_011..016  admit CART-32
  #
  # ── THE CLOCK ──────────────────────────────────────────────────────────────────────────
  #
  # Rates (shingo-edge/shingoedge.dev.yaml, sim.processes; simcalc reads them):
  #
  #   KP-PRESS  tick 20s, 3 parts/min per position, pack 30 -> a pair of carts every 10 sim-min
  #             = 0.20 carts/min drawn from PRESS-KANBAN and 0.20/min coming back
  #   KW-WELD   tick 15s, 4 parts/min, pack 30               -> one cart every 7.5 sim-min
  #             = 0.13 carts/min drawn from WELD-KANBAN and 0.13/min coming back
  #
  # Both loops balance, so in steady state nothing drains: 40 press carts and 27 weld carts
  # in a 200 sim-minute run (20 wall-minutes at the rig's 10x), and the stock at the end is
  # the stock at the start. With a return stopped there is no lender behind either kanban:
  # PRESS-KANBAN's 2 small last 10 sim-min and WELD-KANBAN's 2 last 15. `simcalc -carriers`
  # prints these as THE CLOCK.
  #
  # ── THE POOL ───────────────────────────────────────────────────────────────────────────
  #
  # Mix small 2, big 2, totes 2, 32x30 2. Want is level + cover, the positions the running style's
  # claims put on the line (store.KanbanPictureSQL), so under KP-SMALL K wants small 6, big 2,
  # totes 2, 32x30 2. Pool is what the loop owns; minimum is the mix plus the press's most
  # positions: 6 + 4 = 10 and 2 + 4 = 6.
  #
  #   45x48 carts, 10                              small  big  totes
  #     the press's 4 positions                        4               4
  #     PRESS-KANBAN, PKB_001..006                     2    2    2     6
  #   32x30 carts, 6: all in PRESS-KANBAN, PKB_011..016
  #   The weld's own, 3: WELD-KANBAN 2 small, its position 1 small
  #   KP-SM: 4 of 45x48, standing as what the raid would want
  #
  # AT POOL = MINIMUM the running type's level dips in K by the carts at the windows during every
  # unload, and the types a changeover draws on never dip. K's card says so. Want the running type
  # whole too, and the pool is the minimum plus the carts you expect at the windows.
  #
  # ── LEAVING THE FAMILY ─────────────────────────────────────────────────────────────────
  # K. Sixteen flat children, ten of the 45x48 family and six of 32x30.
  - name: PRESS-KANBAN
    retrieve_algorithm: FIFO
    store_algorithm: LKND
    positions:
      - {name: PKB_001, depth: 1, admits: [45x48]}
      - {name: PKB_002, depth: 1, admits: [45x48]}
      - {name: PKB_003, depth: 1, admits: [45x48]}
      - {name: PKB_004, depth: 1, admits: [45x48]}
      - {name: PKB_005, depth: 1, admits: [45x48]}
      - {name: PKB_006, depth: 1, admits: [45x48]}
      - {name: PKB_007, depth: 1, admits: [45x48]}
      - {name: PKB_008, depth: 1, admits: [45x48]}
      - {name: PKB_009, depth: 1, admits: [45x48]}
      - {name: PKB_010, depth: 1, admits: [45x48]}
      - {name: PKB_011, depth: 1, admits: [CART-32]}
      - {name: PKB_012, depth: 1, admits: [CART-32]}
      - {name: PKB_013, depth: 1, admits: [CART-32]}
      - {name: PKB_014, depth: 1, admits: [CART-32]}
      - {name: PKB_015, depth: 1, admits: [CART-32]}
      - {name: PKB_016, depth: 1, admits: [CART-32]}
  # K2. The weld's own, so R6 can show that one lineside kanban does not raid another.
  - name: WELD-KANBAN
    retrieve_algorithm: FIFO
    store_algorithm: LKND
    positions:
      - {name: WKB_001, depth: 1}
      - {name: WKB_002, depth: 1}
      - {name: WKB_003, depth: 1}
      - {name: WKB_004, depth: 1}
  # SM. A plain supermarket: lanes, no level, nobody counts it, stocked with 45x48 empties: the
  # raid pin needs something to raid. Its free slots are the room for the cart R5 hand-carries.
  - name: KP-SM
    retrieve_algorithm: FIFO
    store_algorithm: LKND
    wait_points: [KP-SM-WAIT]
    lanes:
      - {name: KP_SM_L1, slots: [{name: KSM_001, depth: 1}, {name: KSM_002, depth: 2}]}
      - {name: KP_SM_L2, slots: [{name: KSM_003, depth: 1}, {name: KSM_004, depth: 2}]}
      - {name: KP_SM_L3, slots: [{name: KSM_005, depth: 1}, {name: KSM_006, depth: 2}]}
      - {name: KP_SM_L4, slots: [{name: KSM_007, depth: 1}, {name: KSM_008, depth: 2}]}
  # The press's unloader, as a group of windows: the press's outbound names the group and
  # Core takes a free window (a live plant's press unloader is this shape).
  - name: PRESS-UNLOAD
    retrieve_algorithm: FIFO
    store_algorithm: LKND
    positions:
      - {name: ULN_021, depth: 1}
      - {name: ULN_022, depth: 1}
      - {name: ULN_023, depth: 1}
      - {name: ULN_024, depth: 1}
  - name: WELD-UNLOAD
    retrieve_algorithm: FIFO
    store_algorithm: LKND
    positions:
      - {name: ULN_031, depth: 1}
      - {name: ULN_032, depth: 1}

  # ══ [kanban5] five presses on one kanban ═════════════════════════════════════════════════════
  # THE KANBAN AT FIVE PRESSES (kanban-press5.yaml until the master), one shared unloader, one kanban.
  #
  # A permanent sim fixture, not a model of a plant. Five two-off presses of the shape of
  # [kanban]'s KP-PRESS, every name, part and number synthetic. Pinned by plantspec
  # TestKanbanPress5Plant_*; its runs: docs/dev-env/kanban-rig.md and scripts/kanban-rig.sh P1..P6.
  #
  # ONE KANBAN, BECAUSE ONE UNLOADER. bin_loaders.outbound_dest holds one name, so five presses
  # sharing an unloader can only be one kanban: supports are all 20 positions, mix 2/2/2/2 once.
  #
  #   P5-KANBAN ==empties==> P5-PRESS-1..5 (20 positions) ==fulls==> P5-UNLOAD (10 windows)
  #      ^                                                                  |
  #      +---------------- the unloader's CLEAR: PUSH AS the lit type ------+
  #
  #   KP-SM  [kanban]'s plain supermarket, stocked with 45x48 empties, is this kanban's too: it
  #          must never lose a cart while either kanban's family is whole.
  #
  # THE POOL. Minimum is the mix plus, summed over the supported processes, each one's most
  # positions in the family: 6 + 5x4 = 26 of 45x48, and 2 + 5x4 = 22 of 32x30. A family must fit
  # every press running it at once, so the pool is the sum, and slots are at least the pool.
  #
  #   45x48 carts, 26                               small  big  totes
  #     the five presses' 20 positions                 20               20
  #     P5-KANBAN, P5B_001..006                         2    2    2      6
  #   32x30 carts, 22: all in P5-KANBAN, P5B_027..048
  #
  # 26 + 22 = 48 slots, and 48 carts. A second press changing onto a type in the same cycle waits
  # on the re-types through one unloader, which is what sharing it means.
  #
  - name: P5-KANBAN
