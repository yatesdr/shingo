    operator_station: LINE-2-OPS
  # L2-C deliberately has NO claim on PRS_010 (or its B position) — that absence IS scenario S2.

  # ── PRS_011 — the contrast. STAGED on every style. ──
  - core_node: PRS_011
    style: L2-A
    role: consume
    swap_mode: two_robot
    payload: PART-W
    uop_capacity: 20
    reorder_point: 8
    auto_reorder: true
    inbound_source: SMN_L2
    inbound_staging: SLN_L2_01
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS
  # PART-X under L2-B, so the A->B changeover moves BOTH consume nodes and each
  # takes a different road there: PRS_010 direct, PRS_011 through its staging
  # slot. One changeover then exercises the seam and its control at once, which
  # is the only way to claim the fix left the staged path alone — the two have to
  # be observed under the same conditions, not in separate runs.
  - core_node: PRS_011
    style: L2-B
    role: consume
    swap_mode: two_robot
    payload: PART-X
    uop_capacity: 20
    reorder_point: 8
    auto_reorder: true
    inbound_source: SMN_L2
    inbound_staging: SLN_L2_01
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS
  - core_node: PRS_011
    style: L2-C
    role: consume
    swap_mode: two_robot
    payload: PART-W
    uop_capacity: 20
    reorder_point: 8
    auto_reorder: true
    inbound_source: SMN_L2
    inbound_staging: SLN_L2_01
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS

  # ── WLD_010 — produce PART-Y under all three styles (continuity). ──
  # IT ASKS AHEAD: reorder point 14 of 20. A produce bin is exchanged when it is
  # full (the owner's rule), and a claim with no reorder point asks only then, so
  # the line stood still for the whole delivery leg every bin. At 1 part per tick
  # 14 gives the empty about six ticks to arrive, the round trip on this stack.
  # TestEdge2Fixture_ProduceClaimsAskAhead holds it.
  - core_node: WLD_010
    style: L2-A
    role: produce
    swap_mode: two_robot
    payload: PART-Y
    uop_capacity: 20
    reorder_point: 14
    auto_reorder: true
    inbound_source: SMN_L2
    inbound_staging: SLN_L2_02
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS
  - core_node: WLD_010
    style: L2-B
    role: produce
    swap_mode: two_robot
    payload: PART-Y
    uop_capacity: 20
    reorder_point: 14
    auto_reorder: true
    inbound_source: SMN_L2
    inbound_staging: SLN_L2_02
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS
  - core_node: WLD_010
    style: L2-C
    role: produce
    swap_mode: two_robot
    payload: PART-Y
    uop_capacity: 20
    reorder_point: 14
    auto_reorder: true
    inbound_source: SMN_L2
    inbound_staging: SLN_L2_02
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS

  # ── THE ENDS OF THE LOOP. Every payload needs BOTH, or the validator refuses
  # the plant and it deserves to: a payload with consumers and no producer starves,
  # one with producers and no consumer fills the market and jams. A LOADER IS A
  # PRODUCER — it puts material into the market — which reads backwards until you
  # notice the role is about the material flow, not about the person.
  - core_node: SMN_L2_01
    style: SMN-10-W-RUN
    role: produce
    swap_mode: manual_swap
    payload: PART-W
    uop_capacity: 20
    reorder_point: 2
    auto_reorder: true
    inbound_source: SMN_L2
    outbound_destination: SMN_L2
    operator_station: SMN-10-OPS
  - core_node: SMN_L2_02
    style: SMN-10-X-RUN
    role: produce
    swap_mode: manual_swap
    payload: PART-X
    uop_capacity: 20
    reorder_point: 2
    auto_reorder: true
    inbound_source: SMN_L2
    outbound_destination: SMN_L2
    operator_station: SMN-10X-OPS
  # The drain closes the produce side: WLD_010 fills PART-Y carriers, this empties
  # them back into the pool. Without it the market fills with finished goods and
  # the loop stops being a loop.
  - core_node: FGN_L2_01
    style: DRAIN-10-RUN
    role: consume
    swap_mode: manual_swap
    payload: PART-Y
    uop_capacity: 20
    reorder_point: 2
    auto_reorder: true
    inbound_source: SMN_L2
    outbound_destination: SMN_L2
    operator_station: DRAIN-10-OPS

# [demo] the note below is the demo loop's.
#
# Core's loader switches (plantspec LoaderSettings). A loader claim seeds no Edge
# claim row, so its own `auto_push` reaches nothing; the unloader's re-pull when its window
# frees reads Core's bin_loaders.auto_push, which only this section sets. Without it FGN_001
# re-pulled only on a weld's capture release, and sat idle with its window free (Stage A
# soak, 2026-09-26: 22 pulls in 90 minutes, gaps up to 9.5 wall-minutes, 23 full ASSY
# waiting).
loader_settings:
  FGN_001: {auto_push: true}
  # [window] line 2's drain re-pulls when its window frees, as FGN_001 does.
  FGN_L2_01: {auto_push: true}

demands:

  # ══ [demo] the demo loop ═════════════════════════════════════════════════════════════════════
  # Loader demands key on the loader identity (synthetic PLK_LOADER, or the single-window
  # anchor node). The seed derives demand_registry from the loader aggregate; these
  # thresholds stamp onto each loader's payload/home UOPThreshold. ~2 bins worth each.
  - {payload: BRKT, node: PLK_LOADER, replenish_uop_threshold: 40}
  - {payload: CLIP, node: PLK_X1, replenish_uop_threshold: 40}
  - {payload: STUD, node: PLK_X2, replenish_uop_threshold: 40}
  # The rig's threshold. Keyed on the dedicated loader identity, not a position:
  # the seed stamps it onto every home's UOPThreshold. This is what makes the
  # replenishment loop contend for the same home the return leg wants.
  - {payload: SHIM, node: PLK_HOMES, replenish_uop_threshold: 40}
  # Unloader is event/auto-push driven (informational threshold 0).
  - {payload: ASSY, node: FGN_001, replenish_uop_threshold: 0}

  # ══ [4x2] WELD-6's loaders ═══════════════════════════════════════════════════════════════════
  # Above what the part's positions hold under the style claiming most of it (40 a
  # common part, 80 a mirror part on two positions), or the positions alone meet the
  # threshold and the loader never refires; at or below the seeded total, so nothing
  # fires at birth.
  - {payload: COMMON-1, node: PLK_61, replenish_uop_threshold: 120}
  - {payload: COMMON-2, node: PLK_62, replenish_uop_threshold: 120}
  - {payload: COMMON-3, node: PLK_63, replenish_uop_threshold: 80}
  - {payload: MIRROR-L, node: PLK_64, replenish_uop_threshold: 160}
  - {payload: MIRROR-R, node: PLK_65, replenish_uop_threshold: 100}

  # ══ [window] line 2, on EDGE 2 ═══════════════════════════════════════════════════════════════
  # PART-W's threshold is ABOVE WHAT ITS CELLS HOLD (C2c D24). Core's monitor
  # counts the plant-wide total, cells included, and PRS_010 + PRS_010B + PRS_011
  # hold up to 60 between them: at 20 the cells alone met it, the total froze at
  # 34 once PRS_011 drained, and the loader never refired (a stranded swap).
  # TestEdge2Fixture_ThresholdCoversSeatStock keeps every threshold above it.
  # PART-X's likewise, for the same three cells under L2-B: at 20 its loader was
  # asked once, at a total of 19, with the cells nearly dry, and the swaps it
  # should have fed waited for material until the changeover back cancelled them.
  - {payload: PART-W, node: SMN_L2_01, replenish_uop_threshold: 80}
  - {payload: PART-X, node: SMN_L2_02, replenish_uop_threshold: 80}
  - {payload: PART-Y, node: FGN_L2_01, replenish_uop_threshold: 0}

# [demo] the note below is the demo loop's.
#
# Reporting points: one PLC counter per counting process (manual_swap excluded).
# plc_name/tag_name MUST match sim.processes in shingoedge.dev.yaml. The tick fans
# to all nodes of the active (process, style); for A/B it follows active_pull.
reporting_points:

  # ══ [demo] the demo loop ═════════════════════════════════════════════════════════════════════
  - {plc_name: PRESS-1, tag_name: PRESS-1_COUNTER, node: PLN_001, style: PRESS-1-RUN}
  # THE ALTERNATE STYLES NEED THEIR OWN POINTS. The tick fans to the nodes of the
  # ACTIVE (process, style) pair, so a reporting point pinned only to the -RUN
  # style stops counting the instant a changeover makes -ALT active — and a press
  # that produces without counting is a group that drains with nothing recording
  # why. Same PLC, same tag: it is the same physical counter on the same machine.
  - {plc_name: PRESS-1, tag_name: PRESS-1_COUNTER, node: PLN_001, style: PRESS-1-ALT}
  - {plc_name: PRESS-1, tag_name: PRESS-1_COUNTER, node: PLN_001, style: PRESS-1-R3}
  - {plc_name: PRESS-2, tag_name: PRESS-2_COUNTER, node: PLN_003, style: PRESS-2-RUN}
  - {plc_name: WELD-1,  tag_name: WELD-1_COUNTER,  node: ALN_001, style: WELD-1-RUN}
  - {plc_name: WELD-1,  tag_name: WELD-1_COUNTER,  node: ALN_001, style: WELD-1-ALT}
  - {plc_name: WELD-2,  tag_name: WELD-2_COUNTER,  node: ALN_003, style: WELD-2-RUN}
  - {plc_name: WELD-3,  tag_name: WELD-3_COUNTER,  node: ALN_006, style: WELD-3-RUN}
  - {plc_name: WELD-4,  tag_name: WELD-4_COUNTER,  node: ALN_007, style: WELD-4-RUN}
  - {plc_name: WELD-5,  tag_name: WELD-5_COUNTER,  node: ALN_008, style: WELD-5-RUN}

  # ══ [4x2] WELD-6 ═════════════════════════════════════════════════════════════════════════════
  # The MES-style struct: the production counter is its Prod_Counter_01, and the part
  # identity is derived beside it (MES_WELD_6.CATID_01; engine deriveIdentityTag). One
  # point on the seed's style: reporting_points is unique on (plc_name, tag_name), and the
  # point moves with the style at cutover.
  - {plc_name: WELD-6, tag_name: MES_WELD_6.Prod_Counter_01, node: ALN_061, style: WELD-6-RUN}

  # ══ [kanban] the kanban press and weld ═══════════════════════════════════════════════════════
  - {plc_name: KP-PRESS, tag_name: KP-PRESS_COUNTER, node: PLN_021, style: KP-SMALL}
  - {plc_name: KW-WELD, tag_name: KW-WELD_COUNTER, node: ALN_021, style: KW-RUN}

  # ══ [kanban5] five presses on one kanban ═════════════════════════════════════════════════════
  - {plc_name: P5-PRESS-1, tag_name: P5-PRESS-1_COUNTER, node: PLN_511, style: P5-1-SMALL}
  - {plc_name: P5-PRESS-2, tag_name: P5-PRESS-2_COUNTER, node: PLN_521, style: P5-2-SMALL}
  - {plc_name: P5-PRESS-3, tag_name: P5-PRESS-3_COUNTER, node: PLN_531, style: P5-3-SMALL}
  - {plc_name: P5-PRESS-4, tag_name: P5-PRESS-4_COUNTER, node: PLN_541, style: P5-4-SMALL}
  - {plc_name: P5-PRESS-5, tag_name: P5-PRESS-5_COUNTER, node: PLN_551, style: P5-5-SMALL}

  # ══ [window] line 2, on EDGE 2: PRESS-10 ticks in shingoedge.edge2.yaml ══════════════════════
  # ── THIS PLANT COUNTS ONLY UNDER L2-A, AND IT CANNOT BE FIXED HERE ────────
  #
  # The tick fans to the nodes of the ACTIVE (process, style) pair, so under
  # L2-B this point fans to nothing: the presses run, consume nothing,
  # drain nothing, ask for nothing, and the loop stands still with every cell
  # holding a full carrier and last_poll_at frozen at the second before cutover.
  # Measured on this stack 2026-09-06.
  #
  # THE OBVIOUS FIX DOES NOT WORK, AND [demo] ALREADY TRIED IT. Its points carry
  # PRESS-1 and WELD-1 twice, once per style, with a comment saying exactly why
  # ("a reporting point pinned only to the -RUN style stops counting the instant
  # a changeover makes -ALT active"). Those two extra rows do not exist:
  # reporting_points is UNIQUE(plc_name, tag_name), so a physical counter
  # belongs to ONE style and `INSERT OR IGNORE` drops the second silently.
  # Measured in EDGE 1's own database — the plant file lists nine points and the
  # table holds seven, missing exactly the two -ALT rows.
  #
  # Widening the key to (style_id, plc_name, tag_name) is not a config change
  # and is not obviously safe: each row carries its own last_count, so a style
  # re-entered after a spell away would compute its first delta against a count
  # from the last time it ran. That is the duplicate-fanout shape, and it is an
  # owner decision rather than a fixture edit. Written up for the owner; until
  # it is answered, a scenario that needs counting runs under L2-A.
  - {plc_name: PRESS-10, tag_name: PRESS-10_COUNTER, node: PRS_010, style: L2-A}

station_counters:

  # ══ [4x2] WELD-6 ═════════════════════════════════════════════════════════════════════════════
  # The load station's counter, on WELD-6's own PLC, outside its MES struct. It clicks
  # once per assembly loaded; the production counter ticks line_depth clicks later
  # (shingoedge.dev.yaml, WELD-6's sim.processes entry). All five positions are counted
  # here, the 4x2's shape; a scenario re-binds a position to the cell counter.
  - {process: WELD-6, label: load station, tag_name: STA_W6_LOAD.Load_Count, nodes: [ALN_061, ALN_062, ALN_063, ALN_064, ALN_065]}

cell_configs:

  # ══ [demo] the demo loop ═════════════════════════════════════════════════════════════════════
  - {process: PRESS-1, station: PRESS-1-OPS}
  - {process: PRESS-2, station: PRESS-2-OPS}
  - {process: WELD-1,  station: WELD-1-OPS}
  - {process: WELD-2,  station: WELD-2-OPS}
  - {process: WELD-3,  station: WELD-3-OPS}
  - {process: WELD-4,  station: WELD-4-OPS}
  - {process: WELD-5,  station: WELD-5-OPS}
  - {process: UNLOADER-A, station: UNLOADER-A-OPS}
  # A STATION DECLARED IN operator_stations MUST ALSO BE BOUND HERE. seed_edge
  # creates operator_stations from cell_configs, so a name listed above with no
  # binding in this block leaves its process node's operator_station_id NULL and
  # the station simply does not exist. That bit UNLOADER-B: nothing bound to it
  # rendered and no run noticed (N3, sim 2026-08-24). UNLOADER-B is gone now, but
  # the binding rule is the part worth keeping.
  #
  # Loaders have no single cell station — their windows are per-node operator stations
  # (PLK_W1/2-OPS, PLK_X1-OPS, PLK_X2-OPS), declared via operator_station above.

  # ══ [4x2] WELD-6 ═════════════════════════════════════════════════════════════════════════════
  - {process: WELD-6, station: WELD-6-OPS}

  # ══ [kanban] the kanban press and weld ═══════════════════════════════════════════════════════
  - {process: KP-PRESS, station: KP-PRESS-OPS}
  - {process: KW-WELD, station: KW-WELD-OPS}
  - {process: KP-UNLOAD, station: KP-UNLOAD-OPS}
  - {process: KW-UNLOAD, station: KW-UNLOAD-OPS}

  # ══ [kanban5] five presses on one kanban ═════════════════════════════════════════════════════
  - {process: P5-PRESS-1, station: P5-PRESS-1-OPS}
  - {process: P5-PRESS-2, station: P5-PRESS-2-OPS}
  - {process: P5-PRESS-3, station: P5-PRESS-3-OPS}
  - {process: P5-PRESS-4, station: P5-PRESS-4-OPS}
  - {process: P5-PRESS-5, station: P5-PRESS-5-OPS}
  - {process: P5-UNLOAD-CELL, station: P5-UNLOAD-OPS}

  # ══ [window] line 2, on EDGE 2 ═══════════════════════════════════════════════════════════════
  - {process: LINE-2, station: LINE-2-OPS}
  - {process: SMN-10-W, station: SMN-10-OPS}
  - {process: SMN-10-X, station: SMN-10X-OPS}
  - {process: DRAIN-10, station: DRAIN-10-OPS}

# [demo] the note below is the demo loop's.
#
# ── Kanbans ───────────────────────────────────────────────────────
#
# The empty-carrier level Core holds, and for whom. LIVE as of MG2-0: both
# supported presses source their empties here, so the level is drawn down by real
# production rather than staged and left alone.
#
# The level sums to six across twelve positions, and the pools (8 STANDARD, 6
# STANDARD-SM: no pools key, so each family stands at its minimum) are seeded
# ten here and four on the presses, which leaves two positions free: a kanban
# with no spare position has nowhere to put a carrier coming back in, and the
# pre-resolve loop is bounded by free positions — a full group opens an episode
# and creates nothing until one frees up.
#
# 4 + 2 IS THE MIXED SHAPE, and both halves are now real. PANEL-A rides STANDARD;
# PANEL-B and PANEL-C ride STANDARD-SM. A PRESS-1 changeover to PANEL-C moves the
# demand from one half to the other without touching this declaration, which is
# the wrong-type / mix-churn measurement the campaign runs.
kanbans:

  # ══ [demo] the press empties, first: the demo tests read kanbans[0] ══════════════════════════
  # STRICT: an empty asked for a press this kanban supports is served from it, and any other
  # asker is fenced ("group fenced"). Every Edge order names its press (process_node), so the
  # two presses it supports are admitted; a Core that does not read the field fences them too.
  - group: SYN_PRESS_EMPTIES
    station: edge1.line1
    strict: true
    levels:
      - {bin_type: STANDARD, want: 4}
      - {bin_type: STANDARD-SM, want: 2}
    supports: [PRESS-1, PRESS-2]

  # ══ [kanban] K and K2 ════════════════════════════════════════════════════════════════════════
  # K: mix 2/2/2/2, pool 10 and 6, cover from the claims. No sources: its keeper searches
  # plant-wide only for a family's deficit, and every cart of its loop lands.
  - group: PRESS-KANBAN
    station: edge1.line1
    strict: false
    pools: {45x48: 10, CART-32: 6}
    levels:
      - {bin_type: SMALL-45, want: 2}
      - {bin_type: BIG-45, want: 2}
      - {bin_type: TOTES-45, want: 2}
      - {bin_type: CART-32, want: 2}
    supports: [KP-PRESS]
  # K2: wants 2 while the weld runs small. No sources, its own 3 carts. It shares the family with
  # K and no support with it.
  - group: WELD-KANBAN
    station: edge1.line1
    strict: false
    pools: {45x48: 3}
    levels:
      - {bin_type: SMALL-45, want: 2}
    supports: [KW-WELD]

  # ══ [kanban5] one kanban over five presses ═══════════════════════════════════════════════════
  # One kanban over all five presses: mix once, pool the summed minimum, cover from the claims.
  - group: P5-KANBAN
    station: edge1.line1
    strict: false
    pools: {45x48: 26, CART-32: 22}
    levels:
      - {bin_type: SMALL-45, want: 2}
      - {bin_type: BIG-45, want: 2}
      - {bin_type: TOTES-45, want: 2}
      - {bin_type: CART-32, want: 2}
    supports: [P5-PRESS-1, P5-PRESS-2, P5-PRESS-3, P5-PRESS-4, P5-PRESS-5]
