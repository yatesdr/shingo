  # ══ [window] line 2, on EDGE 2 ═══════════════════════════════════════════════════════════════
  # LINE 2 ON EDGE 2 (edge2.yaml until the master): the observable-window rig.
  #
  # WHY THIS EXISTS AND WHY IT IS NOT EDGE 1. EDGE 1 (station edge1.line1, every
  # other section of this plant) is rapid-fire by design and stays that way — it is the regression
  # gate. The scenarios this plant serves need observable WINDOWS: a changeover whose
  # material lands minutes before the changeover completes, and a decision taken inside
  # that gap. At EDGE 1's pace the gap is not a window, it is an instant, and a test
  # that cannot see the gap cannot prove anything about what happens inside it.
  #
  # THE SEAM UNDER TEST. Two facts spell themselves as a payload code — what a cell was
  # ASKED FOR (the claim, which follows the active style) and what is physically STANDING
  # on the node (the carrier). A changeover moves the first while the second stays put.
  # Reading one where the other was meant is a defect a live plant has had.
  #
  # ── STYLES ARE LOAD-BEARING HERE, NOT DECORATION ──────────────────────────────
  #
  #   L2-A  claims PRS_010 (PART-W), PRS_011, WLD_010
  #   L2-B  claims PRS_010 (PART-X), PRS_011, WLD_010
  #   L2-C  claims PRS_011 and WLD_010 ONLY — deliberately NOT PRS_010
  #
  # A to B is the mis-binding scenario: the OUTGOING style must still claim the node at
  # delivery time, or the defect cannot fire at all. A to C is the dropped-node case: the
  # incoming style claims PRS_010 not at all, so its runtime pointer must go nil and the
  # node must stop reporting rather than report something invented.
  #
  # PRS_010 is DIRECT (no inbound_staging on any of its claims) because direct delivery
  # is the path that mis-bound. It runs SEQUENTIAL for that reason and no other:
  # single_robot requires both staging nodes and two_robot requires inbound staging,
  # so sequential (A/B, needs neither) is the only mode that can express a direct
  # consume cell at all.
  #
  # THE PAIR IS NOT OPTIONAL, AND THAT IS A FINDING ABOUT THE ASK. A direct-delivery
  # consume cell that COUNTS and can SWAP a drained carrier cannot be expressed
  # without a second position: single_robot requires both staging nodes, two_robot
  # requires inbound staging, and the two modes that need no staging
  # (two_robot_press_index, sequential) are both two-position choreographies. Run
  # once without the pair, the node counted to -1 and stalled there — sequential's
  # rotation IS its swap, so with nowhere to rotate the drained carrier could not
  # leave. Assertions therefore name the ACTIVE PULL position of the pair rather
  # than PRS_010 unconditionally. PRS_011 is STAGED as the contrast: it always advanced
  # correctly, and proving it still does is how we know the fix did not disturb it.
  #
  # WLD_010 produces PART-Y under all three styles: produce continuity across a
  # changeover, and the produce side of the CMS postings.
  #
  # ── CIRCULARITY — THE ARITHMETIC, SO THE NEXT PERSON DOES NOT REDERIVE IT ─────
  #
  # The loop must run indefinitely with no reseeding. For each consume node the
  # depletion time must exceed the replenishment lead time, with a spare in the pool.
  #
  #   Bin capacity        C = 20 parts
  #   Consumption         t = 30 s/part   (30s tick, 1 uop/tick — see shingoedge.edge2.yaml)
  #   Depletion           C*t = 20 * 30 s = 600 s = 10 min
  #   AMR round trip      R  ~ 2-3 min observed on this stack (request to delivery)
  #   Constraint          C*t > R  ->  10 min > 3 min, satisfied with 3.3x margin
  #
  #   CARRIERS ARE CONSERVED AND SHARED, so the pool is counted once for the whole
  #   loop rather than per part. A PART-W carrier drains, returns empty, and the
  #   loader refills it as PART-X if that is what is called for — the identity is on
  #   the carrier, not designed into it.
  #
  #     seats to cover      PRS_010 + PRS_010B + PRS_011 + WLD_010         = 4
  #     in flight           1-2 legs at a time on this small a market      = 2
  #     spare               the one that absorbs a carrier somewhere odd   = 1
  #     total needed                                                      = 7
  #     seeded              2 PART-W + 4 PART-X + 1 PART-Y + 7 empty       = 14
  #                         (+ the 4 at the cells: 18 carriers in all)
  #
  #   THAT COUNT IS THE FLOOR, NOT THE POOL, BECAUSE A LOADER HOLDS ITS PART'S
  #   TOTAL AT THE THRESHOLD WHETHER OR NOT ITS STYLE RUNS. PART-W and PART-X
  #   each ask at 80 (the demands block), so each keeps four carriers' worth in
  #   the loop even while idle, and more while the part-drained carriers a
  #   changeover sent back sit in the market (they count at what they hold):
  #
  #     the running part    3 at its cells + up to 4 full in the market    = 7
  #     the idle part       80 in fulls and part-drained carriers          = 4-7
  #     PART-Y              one filling at WLD_010 + one for the drain     = 2
  #     empties             the one WLD_010 waits on + one at a loader     = 2
  #     total               typical 7 + 5 + 2 + 2, worst 7 + 7 + 2 + 2      = 16-18
  #
  #   The plant held 14 while PART-X asked at 20 and so never held its total;
  #   asking at 80 adds the idle part's hoard, so four empties were added
  #   (2026-10-26).
  #
  #   THE A/B PAIR IS TWO SEATS, NOT ONE, and this count said three because it
  #   read the pair as its cell. Both halves hold a carrier at once — that is what
  #   a sequential pair IS — so the total was one short before the payload-specific
  #   count below made it two short during a changeover.
  #
  #   AND A CHANGEOVER IS COUNTED PER PAYLOAD, not against the shared pool. The
  #   pool is conserved and fungible in steady state, but on the way from L2-A to
  #   L2-B every cell that claims PART-X needs a PART-X carrier AT ONCE — three of
  #   them — and an empty in the market is not one of them until a loader has
  #   filled it. Seeded with two, the third cell waited in awaiting_material for
  #   as long as the plant ran, and the changeover could never complete.
  #
  #   AND ONE MORE THAN THE CELLS, so the three-cell style can SWAP (2026-10-26).
  #   With three PART-X carriers all three stood at the cells under L2-B, and the
  #   first cell to drain asked for a fourth that only SMN_L2_02 could fill. The
  #   loader was asked once, too late: Core's in-loop total counts the carriers at
  #   the cells as stocked (the inclusion policy of 2026-05-11), 60 against a
  #   threshold of 20, so it fired only at a total of 19 with the cells nearly
  #   dry. So the swaps (supply and evac) waited 52-74 sim-min, every run of the
  #   plant main's included, until the B -> A changeover cancelled them. The fourth
  #   carrier serves the first swap; PART-X's threshold at 80, above its cells as
  #   PART-W's is, keeps the loader filling for the rest (the demands block).
  #
  #   Produce side mirrors it: evac lead time (~R) < fill time C*t = 20 * 30 s = 10 min.
  #
  # POOL SIZE IS NOT OPTIONAL SLACK. A live plant stalled on a pool of 8 with 3
  # permanently in flight — the spare is what absorbs a carrier that is somewhere
  # unexpected, and a loop sized to its own happy path deadlocks the first time one is.
  # One market, self-segregating by payload under LKND.
  #
  # LANES SEED PACKED — bins at the BACK, empties at the mouth, no holes. A bin at
  # depth 1 with an empty depth 2 behind it is an air bubble at birth: nothing can
  # reach the empty slot and no dig will ever be raised to open it, because the bin
  # in front is not in anybody's way. The validator refuses it, correctly.
  #
  # AND THE GROUP KEEPS ROOM TO DIG. Free slots are not the number that matters —
  # REACHABLE free slots are, and a slot behind a bin is not room. Ten mouths sit
  # empty here plus a dedicated buffer position, well over the two-slot minimum, so
  # an excavation always has somewhere to stand its blockers.
  - name: SMN_L2
    retrieve_algorithm: FIFO
    store_algorithm: LKND
    wait_points: [L2-WAIT-1, L2-WAIT-2]
    lanes:
      - {name: L2_Lane_W1, slots: [{name: SMN_L2_001, depth: 1}, {name: SMN_L2_002, depth: 2}]}
      - {name: L2_Lane_W2, slots: [{name: SMN_L2_003, depth: 1}, {name: SMN_L2_004, depth: 2}]}
      - {name: L2_Lane_X1, slots: [{name: SMN_L2_005, depth: 1}, {name: SMN_L2_006, depth: 2}]}
      - {name: L2_Lane_X2, slots: [{name: SMN_L2_007, depth: 1}, {name: SMN_L2_008, depth: 2}]}
      # A THIRD X LANE, because L2-B claims PART-X at three cells. See the bins
      # block: two X carriers cannot cover a three-cell changeover, and the cell
      # left out waits in awaiting_material forever.
      - {name: L2_Lane_X3, slots: [{name: SMN_L2_016, depth: 1}, {name: SMN_L2_017, depth: 2}]}
      # A FOURTH X LANE, for the fourth PART-X carrier: one more than L2-B's three
      # cells, so a drained cell's swap has a full to fetch (the arithmetic above).
      - {name: L2_Lane_X4, slots: [{name: SMN_L2_020, depth: 1}, {name: SMN_L2_021, depth: 2}]}
      - {name: L2_Lane_Y1, slots: [{name: SMN_L2_009, depth: 1}, {name: SMN_L2_010, depth: 2}]}
      - {name: L2_Lane_MT1, slots: [{name: SMN_L2_011, depth: 1}, {name: SMN_L2_012, depth: 2}]}
      - {name: L2_Lane_MT2, slots: [{name: SMN_L2_013, depth: 1}, {name: SMN_L2_014, depth: 2}]}
      # A third empty lane. simcalc -carriers counts the empty floor PER POOL —
      # a produce station draws its empty from ONE named pool — and SMN_L2 has
      # three produce stations against two seeded empties. The third plant-wide
      # empty sits at WLD_010, which is a cell, not this market.
      - {name: L2_Lane_MT3, slots: [{name: SMN_L2_018, depth: 1}, {name: SMN_L2_019, depth: 2}]}
      # Two more empty lanes, packed: the pool the thresholds hold (the
      # arithmetic at the top). Full lanes, so the free slots stay as they were.
      - {name: L2_Lane_MT4, slots: [{name: SMN_L2_022, depth: 1}, {name: SMN_L2_023, depth: 2}]}
      - {name: L2_Lane_MT5, slots: [{name: SMN_L2_024, depth: 1}, {name: SMN_L2_025, depth: 2}]}
      # The buffer position: in-flight slack, and a guaranteed place to park a dig.
      - {name: L2_Lane_BUF, slots: [{name: SMN_L2_015, depth: 1}]}

stations:

  # ══ [demo] the demo loop ═════════════════════════════════════════════════════════════════════
  # ── PRESS-1: two_robot_press_index (front + paired back, no staging) ──
  - {name: PLN_001, kind: press}     # PRESS-1 front (produce PANEL-A)
  - {name: PLN_002, kind: press}     # PRESS-1 back / paired index position (no own claim)
  # ── PRESS-2: A/B sequential (two bins rotate, no staging) ──
  # PRESS-1's RELOCATED placement — the DISJOINT-NODE tooling changeover. The
  # incoming style runs the same press on different nodes, so no node appears in
  # both styles: the marked positions become Drops and the new positions become Adds.
  # Round 3's staged fan-out required both claims on one diff and so contributed
  # nothing to this shape at all; the tooling decorator is what makes it work.
  - {name: PLN_005, kind: press}     # PRESS-1-MOVED front
  - {name: PLN_006, kind: press}     # PRESS-1-MOVED back / paired index position
  - {name: PLN_003, kind: press}     # PRESS-2 A (active)  produce PANEL-B
  - {name: PLN_004, kind: press}     # PRESS-2 B (parked)  produce PANEL-B
  # ── WELD-1: two_robot (inbound + outbound staging) ──
  - {name: ALN_001, kind: weld}      # WELD-1 consume PANEL-A
  - {name: ALN_002, kind: weld}      # WELD-1 produce ASSY
  - {name: SLN_001, kind: staging}   # WELD-1 ALN_001 inbound stage
  - {name: SLN_002, kind: staging}   # WELD-1 ALN_002 inbound stage
  - {name: SLN_011, kind: staging}   # WELD-1 ALN_001 OUTBOUND stage (two_robot removal leg)
  # ── WELD-2: single_robot (consume PANEL-B + BRKT, produce ASSY) ──
  - {name: ALN_003, kind: weld}      # WELD-2 consume PANEL-B
  - {name: ALN_004, kind: weld}      # WELD-2 consume BRKT
  - {name: ALN_005, kind: weld}      # WELD-2 produce ASSY
  - {name: SLN_003, kind: staging}   # WELD-2 ALN_003 inbound
  - {name: SLN_004, kind: staging}   # WELD-2 ALN_003 outbound
  - {name: SLN_005, kind: staging}   # WELD-2 ALN_004 inbound
  - {name: SLN_006, kind: staging}   # WELD-2 ALN_004 outbound
  - {name: SLN_007, kind: staging}   # WELD-2 ALN_005 inbound
  - {name: SLN_008, kind: staging}   # WELD-2 ALN_005 outbound
  # ── WELD-3: two_robot consume CLIP (single-window loader leg's drain) ──
  - {name: ALN_006, kind: weld}      # WELD-3 consume CLIP
  - {name: SLN_009, kind: staging}   # WELD-3 ALN_006 inbound stage
  - {name: SLN_012, kind: staging}   # WELD-3 ALN_006 OUTBOUND stage (two_robot removal leg)
  # ── WELD-4: two_robot consume STUD (second single-window loader leg's drain) ──
  - {name: ALN_007, kind: weld}      # WELD-4 consume STUD
  - {name: SLN_010, kind: staging}   # WELD-4 ALN_007 inbound stage
  - {name: SLN_013, kind: staging}   # WELD-4 ALN_007 OUTBOUND stage (two_robot removal leg)
  # ── WELD-5 / PLK_HOMES: the HOME-RETURN rig ───────────────────────────
  #
  # THE ONLY DEDICATED_POSITIONS LOADER IN THIS PLANT, and the only leg that
  # reaches loader_place.go at all: placeForDedicatedLoader returns at its layout
  # check for every order on every other leg here, so nothing else in the demo loop
  # exercises the park side.
  #
  # It reproduces a live plant's shape rather than the other component legs':
  # the line swaps DIRECTLY against the loader home, with no supermarket in
  # between (ALN_008.inbound_source = PLK_H1 = outbound_destination). That is the
  # tier-2 dedicated-loader-pool source path. The supply leg lifts the carrier off
  # the home, the return brings the spent one back to it, and the replenishment
  # loop wants the same position the moment it reads empty. Whether the return
  # HOLDS that home or yields it is the whole question the rig exists to answer.
  #
  # ONE HOME PER PART. THIS RIG USED TO HAVE TWO HOMES ON THE SAME PART, and
  # that single fact manufactured a plant-wide deadlock. Read this before adding
  # a second home for any payload here.
  #
  # A LIVE PLANT'S dedicated-locations loader, read live
  # 2026-08-31 (same layout=dedicated_positions, replenishment=threshold):
  #
  #   homes    22 positions, 22 DISTINCT part numbers, one
  #            part each, per-part thresholds (350, 800,
  #            1201, 4500, 217, 5000, ...)
  #   buffers  11 positions, payload '', threshold 0
  #
  # Zero duplicate-payload homes, and roughly two homes per buffer. The real
  # "home loader" IS a supermarket: dedicated locations for named parts plus
  # free buffer space, feeding weld cells that pull from ~30 spots.
  #
  # WHAT THE DUPLICATE DID. With H1 and H2 both pinned to SHIM the two are
  # interchangeable to the SUPPLY side, which widens across the pool — measured:
  # "widen: order 16 supply pickup PLK_H1 -> PLK_H2 (pool hit, anchor PLK_H1)".
  # So pickups drained BOTH homes while returns, which scan HomeKindBuffer only
  # (loader_place.go), could land in just two places. At that plant it is impossible:
  # a pickup for part X has exactly ONE home to widen from, so the pool cannot
  # eat its own return capacity.
  #
  # Order 111 hit the moment the return set was empty — H1 held stock, B1 held
  # stock, B2 was busy for the one second order 110 took to lift from it. It
  # took loader_place.go's WARN branch, was dispatched onto the occupied home
  # anyway, and stood at PLK_H1 for 42 sim-hours holding AMR-10. ALN_008 drained
  # to -3 UOP, the PLC readiness gate took WELD-5 dark, and because that gate is
  # all-or-nothing per process and a dark line raises no drawdown, five of seven
  # payloads raised ZERO orders for the rest of the run. One misconfigured home
  # stopped the plant.
  #
  # H2 is therefore a BUFFER: one SHIM home, three buffers, which is that plant's
  # shape at this plant's scale. The home-return question the rig exists to answer
  # is unchanged — a return still finds its home occupied and must yield or hold.
  - {name: PLK_H1, kind: loader}     # PLK_HOMES home — the ONE dedicated SHIM position
  - {name: PLK_H2, kind: loader}     # PLK_HOMES buffer 3 (was a second SHIM home — see above)
  - {name: PLK_B1, kind: loader}     # PLK_HOMES buffer 1 (no payload — takes whatever returns)
  - {name: PLK_B2, kind: loader}     # PLK_HOMES buffer 2
  - {name: ALN_008, kind: weld}      # WELD-5 consume SHIM, swaps against PLK_H1
  - {name: SLN_016, kind: staging}   # WELD-5 ALN_008 inbound stage
  - {name: SLN_017, kind: staging}   # WELD-5 ALN_008 OUTBOUND stage (two_robot removal leg)
  # ── Loaders (manual_swap): one multi-window + two single-window ──
  # PLK_LOADER is a SHARED MULTI-WINDOW BRKT loader (synthetic identity — not a node; its
  # two windows below are its only physical nodes, each a delivery target + its own HMI).
  - {name: PLK_W1, kind: loader}     # PLK_LOADER window 1
  - {name: PLK_W2, kind: loader}     # PLK_LOADER window 2
  # PLK_X1 / PLK_X2 = SINGLE-WINDOW loaders (each its own real-node anchor, the classic
  # single-node shape). CLIP and STUD each flow through one.
  - {name: PLK_X1, kind: loader}     # single-window CLIP loader
  - {name: PLK_X2, kind: loader}     # single-window STUD loader
  # ── Unloaders ──
  #
  # ONE, AND ONLY ON THE FINISHED GOOD. An unloader takes product OUT of the
  # system; the only thing this plant finishes is ASSY, which the weld cells
  # produce. Anything else here is work-in-progress that a cell consumes, and an
  # unloader on it competes with the line for its own feedstock rather than
  # shipping anything. Both of the ones that used to be here did exactly that —
  # see the removal notes below and in node_claims.
  - {name: FGN_001, kind: unloader}  # drains ASSY finished goods
  # THERE IS NO FGN_002. It drained PANEL-A purely so the U1 side-cycle trigger had
  # an unloader to resolve — a test scaffold that moved real material: 16 PANEL-A
  # carriers against WELD-1's 4 over 81 sim-minutes. To exercise that trigger again,
  # give a press a payload that genuinely ships and put the unloader on THAT; see
  # node_claims for why.
  # THERE IS NO FGN_003, AND THE SM FAMINE IT WAS ADDED FOR HAD A DIFFERENT CAUSE.
  #
  # The note here read: "A carrier's label is cleared on capture-reduction, on a
  # release with 0, or by an operator/unloader CLEAR — never by being consumed to
  # zero (applier.go, and that is deliberate and SME-locked). PANEL-B rides
  # STANDARD-SM and had no unloader, so every SM carrier PRESS-2 filled was drained
  # by WELD-2 and then sat labelled PANEL-B at 0 UOP forever." Eleven SM carriers,
  # all labelled, zero manifest-clears in a whole run, PRESS-2 dead at 05:56
  # waiting for an empty that could not exist. That famine was real, and it reached
  # WELD-4 four hops away through a held lane.
  #
  # But "release with 0" IS one of the three clear paths, and it was never firing.
  # ALN_003 (WELD-2, PANEL-B) is this plant's only single_robot CONSUME node, and
  # the sim operator computed a disposition only inside releaseAsPair — reachable
  # only when SwapMode.IsTwoRobot(). Every PANEL-B release therefore sent a blank
  # form, Core never settled the count, and the label stayed on. An unloader was
  # added to wipe labels instead, and because a drain window must be handed a FULL
  # carrier (11b935ab), each wipe destroyed a full load: 15 carriers, 450 UOP of
  # PANEL-B in 81 sim-minutes, while WELD-2 got none.
  #
  # The release now declares what is physically in the bin on every swap mode, so
  # carriers clear themselves and the SM pool is a circle without an unloader in it.
  # If SM empties ever stop regenerating again, look at the RELEASE PATH first —
  # this fixture already paid once for treating the symptom.
  # ── PRESS-1 changeover clearance ──
  # SHINGO DOES NOT TOUCH TOOLING. The tool change is human work at the press;
  # what the changeover owes it is floor space and timing. So a marked position is
  # CLEARED BY NORMAL ROUTING — its bin goes to SYN_MARKET like any other press
  # bin — and the only station the feature needs is somewhere for the INCOMING
  # style's bins to wait while the humans work (SLN_014).
  #
  # There used to be a `TBN_001` "tooling bay" here, a single staging station
  # every marked position was routed to. It was built on the wrong premise, and the
  # sim showed what that costs: a two-position press sends TWO bins, the bay holds
  # one, nothing ever empties it, and robots dwell on it holding bins
  # ("HOLDING at TBN_001 — a robot cannot place onto an occupied position").
  # A tool change has no destination of its own: it clears to the cell's.
  - {name: SLN_014, kind: staging}   # PRESS-1 inbound stage (incoming style waits here)
  # Where a CARRIED-OVER bin waits out the setup. A part common to both styles
  # does not have to make a round trip through the supermarket to get out of the
  # way — the same bin hops here, holds, and comes back on the tooling-done
  # release. See changeover_carryover_disposition on PRESS-1-RUN.
  - {name: SLN_015, kind: staging}   # PRESS-1 outbound stage (carried-over bins wait here)

  # ══ [4x2] WELD-6 and its loaders ═════════════════════════════════════════════════════════════
  # THE 4x2-SHAPED CELL. WELD-6 is a two-robot weld with five consume positions:
  #
  #   position   node     RUN (CATID 1001)   ALT (CATID 1002)   market
  #   1          ALN_061  COMMON-1           COMMON-1           SYN_STAMP
  #   2          ALN_062  COMMON-2           COMMON-2           SYN_STAMP
  #   3          ALN_063  COMMON-3           COMMON-3           SYN_COMP
  #   4          ALN_064  MIRROR-L           MIRROR-R           SYN_COMP
  #   5          ALN_065  MIRROR-L           MIRROR-R           SYN_COMP
  #
  # The two styles share three parts and differ at the two mirror positions, which run
  # the RUN mirror part under RUN and the ALT one under ALT. Every part comes from a
  # single-window loader (PLK_61..65) through the corridor, the demo's BRKT shape: no
  # press feeds this cell, so the demo's press and weld rates do not move.
  #
  # COUNTING. The production counter is MES_WELD_6.Prod_Counter_01 on PLC WELD-6, and the
  # part identity is its struct's CATID_01. The load station's counter
  # STA_W6_LOAD.Load_Count counts all five positions; in the fake PLC the station clicks
  # on the ticker and the production counter follows line_depth clicks later
  # (shingoedge.dev.yaml). The 12 s tick is WELD-3/4's: 5 assemblies a sim-minute, so a
  # common part draws 5/min and MIRROR-L, on two positions, 10/min.
  #
  # The changeover and counting scenarios on this cell: integration/scenarios/catid_4x2_*;
  # the rig a person watches: scripts/sim-4x2.sh.
  # WELD-6: two_robot, five consume positions, each with an inbound and an outbound stage.
  - {name: ALN_061, kind: weld}      # WELD-6 position 1, COMMON-1
  - {name: ALN_062, kind: weld}      # WELD-6 position 2, COMMON-2
  - {name: ALN_063, kind: weld}      # WELD-6 position 3, COMMON-3
  - {name: ALN_064, kind: weld}      # WELD-6 position 4, mirror (MIRROR-L / MIRROR-R)
  - {name: ALN_065, kind: weld}      # WELD-6 position 5, mirror (MIRROR-L / MIRROR-R)
  - {name: SLN_061, kind: staging}   # ALN_061 inbound stage
  - {name: SLN_062, kind: staging}   # ALN_062 inbound stage
  - {name: SLN_063, kind: staging}   # ALN_063 inbound stage
  - {name: SLN_064, kind: staging}   # ALN_064 inbound stage
  - {name: SLN_065, kind: staging}   # ALN_065 inbound stage
  - {name: SLN_071, kind: staging}   # ALN_061 outbound stage
  - {name: SLN_072, kind: staging}   # ALN_062 outbound stage
  - {name: SLN_073, kind: staging}   # ALN_063 outbound stage
  - {name: SLN_074, kind: staging}   # ALN_064 outbound stage
  - {name: SLN_075, kind: staging}   # ALN_065 outbound stage
  # Its loaders, one single-window loader per part (the BRKT shape: no upstream press).
  - {name: PLK_61, kind: loader}     # COMMON-1 loader, into SYN_STAMP
  - {name: PLK_62, kind: loader}     # COMMON-2 loader, into SYN_STAMP
  - {name: PLK_63, kind: loader}     # COMMON-3 loader, into SYN_COMP
  - {name: PLK_64, kind: loader}     # MIRROR-L loader, into SYN_COMP
  - {name: PLK_65, kind: loader}     # MIRROR-R loader, into SYN_COMP

