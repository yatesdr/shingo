# plants/edge2.yaml — EDGE 2: the observable-window rig for the lineside+CMS integration.
#
# WHY THIS EXISTS AND WHY IT IS NOT EDGE 1. EDGE 1 (plants/demo.yaml, station
# edge1.line1) is rapid-fire by design and stays that way — it is the regression
# gate. The scenarios this plant serves need observable WINDOWS: a changeover whose
# material lands minutes before the changeover completes, and a decision taken inside
# that gap. At EDGE 1's pace the gap is not a window, it is an instant, and a test
# that cannot see the gap cannot prove anything about what happens inside it.
#
# THE SEAM UNDER TEST. Two facts spell themselves as a payload code — what a cell was
# ASKED FOR (the claim, which follows the active style) and what is physically STANDING
# on the node (the carrier). A changeover moves the first while the second stays put.
# Reading one where the other was meant is Springfield SMN_029.
#
# ── STYLES ARE LOAD-BEARING HERE, NOT DECORATION ──────────────────────────────
#
#   L2-A  claims PRS_010 (PART-W), PRS_011, WLD_010
#   L2-B  claims PRS_010 (PART-X), PRS_011, WLD_010
#   L2-C  claims PRS_011 and WLD_010 ONLY — deliberately NOT PRS_010
#
# A to B is the mis-binding scenario: the OUTGOING style must still claim the node at
# delivery time, or the defect cannot fire at all. A to C is the dropped-node case: the
# incoming style claims PRS_010 not at all, so its runtime pointer must go nil and the
# node must stop reporting rather than report something invented.
#
# PRS_010 is DIRECT (no inbound_staging on any of its claims) because direct delivery
# is the path that mis-bound. It runs SEQUENTIAL for that reason and no other:
# single_robot requires both staging nodes and two_robot requires inbound staging,
# so sequential (A/B, needs neither) is the only mode that can express a direct
# consume cell at all.
#
# THE PAIR IS NOT OPTIONAL, AND THAT IS A FINDING ABOUT THE ASK. A direct-delivery
# consume cell that COUNTS and can SWAP a drained carrier cannot be expressed
# without a second position: single_robot requires both staging nodes, two_robot
# requires inbound staging, and the two modes that need no staging
# (two_robot_press_index, sequential) are both two-position choreographies. Run
# once without the pair, the node counted to -1 and stalled there — sequential's
# rotation IS its swap, so with nowhere to rotate the drained carrier could not
# leave. Assertions therefore name the ACTIVE PULL position of the pair rather
# than PRS_010 unconditionally. PRS_011 is STAGED as the contrast: it always advanced
# correctly, and proving it still does is how we know the fix did not disturb it.
#
# WLD_010 produces PART-Y under all three styles: produce continuity across a
# changeover, and the produce side of the CMS postings.
#
# ── CIRCULARITY — THE ARITHMETIC, SO THE NEXT PERSON DOES NOT REDERIVE IT ─────
#
# The loop must run indefinitely with no reseeding. For each consume node the
# depletion time must exceed the replenishment lead time, with a spare in the pool.
#
#   Bin capacity        C = 20 parts
#   Consumption         t = 30 s/part   (30s tick, 1 uop/tick — see shingoedge.edge2.yaml)
#   Depletion           C*t = 20 * 30 s = 600 s = 10 min
#   AMR round trip      R  ~ 2-3 min observed on this stack (request to delivery)
#   Constraint          C*t > R  ->  10 min > 3 min, satisfied with 3.3x margin
#
#   CARRIERS ARE CONSERVED AND SHARED, so the pool is counted once for the whole
#   loop rather than per part. A PART-W carrier drains, returns empty, and the
#   loader refills it as PART-X if that is what is called for — the identity is on
#   the carrier, not designed into it.
#
#     seats to cover      PRS_010 + PRS_010B + PRS_011 + WLD_010         = 4
#     in flight           1-2 legs at a time on this small a market      = 2
#     spare               the one that absorbs a carrier somewhere odd   = 1
#     total needed                                                      = 7
#     seeded              2 PART-W + 4 PART-X + 1 PART-Y + 7 empty       = 14
#                         (+ the 4 at the cells: 18 carriers in all)
#
#   THAT COUNT IS THE FLOOR, NOT THE POOL, BECAUSE A LOADER HOLDS ITS PART'S
#   TOTAL AT THE THRESHOLD WHETHER OR NOT ITS STYLE RUNS. PART-W and PART-X
#   each ask at 80 (the demands block), so each keeps four carriers' worth in
#   the loop even while idle, and more while the part-drained carriers a
#   changeover sent back sit in the market (they count at what they hold):
#
#     the running part    3 at its cells + up to 4 full in the market    = 7
#     the idle part       80 in fulls and part-drained carriers          = 4-7
#     PART-Y              one filling at WLD_010 + one for the drain     = 2
#     empties             the one WLD_010 waits on + one at a loader     = 2
#     total               typical 7 + 5 + 2 + 2, worst 7 + 7 + 2 + 2      = 16-18
#
#   The plant held 14 while PART-X asked at 20 and so never held its total;
#   asking at 80 adds the idle part's hoard, so four empties were added
#   (2026-10-26).
#
#   THE A/B PAIR IS TWO SEATS, NOT ONE, and this count said three because it
#   read the pair as its cell. Both halves hold a carrier at once — that is what
#   a sequential pair IS — so the total was one short before the payload-specific
#   count below made it two short during a changeover.
#
#   AND A CHANGEOVER IS COUNTED PER PAYLOAD, not against the shared pool. The
#   pool is conserved and fungible in steady state, but on the way from L2-A to
#   L2-B every cell that claims PART-X needs a PART-X carrier AT ONCE — three of
#   them — and an empty in the market is not one of them until a loader has
#   filled it. Seeded with two, the third cell waited in awaiting_material for
#   as long as the plant ran, and the changeover could never complete.
#
#   AND ONE MORE THAN THE CELLS, so the three-cell style can SWAP (2026-10-26).
#   With three PART-X carriers all three stood at the cells under L2-B, and the
#   first cell to drain asked for a fourth that only SMN_L2_02 could fill. The
#   loader was asked once, too late: Core's kanban total counts the carriers at
#   the cells as stocked (the inclusion policy of 2026-05-11), 60 against a
#   threshold of 20, so it fired only at a total of 19 with the cells nearly
#   dry. So the swaps (supply and evac) waited 52-74 sim-min, every run of the
#   plant main's included, until the B -> A changeover cancelled them. The fourth
#   carrier serves the first swap; PART-X's threshold at 80, above its cells as
#   PART-W's is, keeps the loader filling for the rest (the demands block).
#
#   Produce side mirrors it: evac lead time (~R) < fill time C*t = 20 * 30 s = 10 min.
#
# POOL SIZE IS NOT OPTIONAL SLACK. Springfield stalled on a pool of 8 with 3
# permanently in flight — the spare is what absorbs a carrier that is somewhere
# unexpected, and a loop sized to its own happy path deadlocks the first time one is.

namespace: edge2
line_id: line1

# LINE 2'S OWN CARRIER TYPE. This plant shares one Core with demo-sim, and Core's
# empties keeper sources plant-wide by carrier type (by design). While both named
# their carrier STANDARD the two pools were one, and line 1's press-empties keeper
# took line 2's empty (TRACE-line2-empties, 2026-10-11). The arithmetic above
# counts this loop as closed; its own type name is what makes it closed.
# TestEdge2Fixture_LineTwoCarriesItsOwnCarrierType holds it.
bin_types: [STANDARD-L2]

payloads:
  - {code: PART-W, uop_capacity: 20, bin_type: STANDARD-L2}
  - {code: PART-X, uop_capacity: 20, bin_type: STANDARD-L2}
  - {code: PART-Y, uop_capacity: 20, bin_type: STANDARD-L2}

zones:
  # One market, self-segregating by payload under LKND.
  #
  # LANES SEED PACKED — bins at the BACK, empties at the mouth, no holes. A bin at
  # depth 1 with an empty depth 2 behind it is an air bubble at birth: nothing can
  # reach the empty slot and no dig will ever be raised to open it, because the bin
  # in front is not in anybody's way. The validator refuses it, correctly.
  #
  # AND THE GROUP KEEPS ROOM TO DIG. Free slots are not the number that matters —
  # REACHABLE free slots are, and a slot behind a bin is not room. Ten mouths sit
  # empty here plus a dedicated buffer position, well over the two-slot minimum, so
  # an excavation always has somewhere to stand its blockers.
  - name: SMN_L2
    retrieve_algorithm: FIFO
    store_algorithm: LKND
    wait_points: [L2-WAIT-1, L2-WAIT-2]
    lanes:
      - {name: L2_Lane_W1, slots: [{name: SMN_L2_001, depth: 1}, {name: SMN_L2_002, depth: 2}]}
      - {name: L2_Lane_W2, slots: [{name: SMN_L2_003, depth: 1}, {name: SMN_L2_004, depth: 2}]}
      - {name: L2_Lane_X1, slots: [{name: SMN_L2_005, depth: 1}, {name: SMN_L2_006, depth: 2}]}
      - {name: L2_Lane_X2, slots: [{name: SMN_L2_007, depth: 1}, {name: SMN_L2_008, depth: 2}]}
      # A THIRD X LANE, because L2-B claims PART-X at three cells. See the bins
      # block: two X carriers cannot cover a three-cell changeover, and the cell
      # left out waits in awaiting_material forever.
      - {name: L2_Lane_X3, slots: [{name: SMN_L2_016, depth: 1}, {name: SMN_L2_017, depth: 2}]}
      # A FOURTH X LANE, for the fourth PART-X carrier: one more than L2-B's three
      # cells, so a drained cell's swap has a full to fetch (the arithmetic above).
      - {name: L2_Lane_X4, slots: [{name: SMN_L2_020, depth: 1}, {name: SMN_L2_021, depth: 2}]}
      - {name: L2_Lane_Y1, slots: [{name: SMN_L2_009, depth: 1}, {name: SMN_L2_010, depth: 2}]}
      - {name: L2_Lane_MT1, slots: [{name: SMN_L2_011, depth: 1}, {name: SMN_L2_012, depth: 2}]}
      - {name: L2_Lane_MT2, slots: [{name: SMN_L2_013, depth: 1}, {name: SMN_L2_014, depth: 2}]}
      # A third empty lane. simcalc -carriers counts the empty floor PER POOL —
      # a produce station draws its empty from ONE named pool — and SMN_L2 has
      # three produce stations against two seeded empties. The third plant-wide
      # empty sits at WLD_010, which is a cell, not this market.
      - {name: L2_Lane_MT3, slots: [{name: SMN_L2_018, depth: 1}, {name: SMN_L2_019, depth: 2}]}
      # Two more empty lanes, packed: the pool the thresholds hold (the
      # arithmetic at the top). Full lanes, so the free slots stay as they were.
      - {name: L2_Lane_MT4, slots: [{name: SMN_L2_022, depth: 1}, {name: SMN_L2_023, depth: 2}]}
      - {name: L2_Lane_MT5, slots: [{name: SMN_L2_024, depth: 1}, {name: SMN_L2_025, depth: 2}]}
      # The buffer position: in-flight slack, and a guaranteed place to park a dig.
      - {name: L2_Lane_BUF, slots: [{name: SMN_L2_015, depth: 1}]}

stations:
  - {name: PRS_010, kind: press}      # PRESS-10 A — consume, DIRECT delivery (the seam)
  - {name: PRS_010B, kind: press}     # PRESS-10 B — the other half of the pair
  - {name: PRS_011, kind: press}      # PRESS-11 — consume, STAGED delivery (the contrast)
  - {name: SLN_L2_01, kind: staging}  # PRS_011 inbound stage
  - {name: SLN_L2_02, kind: staging}  # WLD_010 inbound stage
  - {name: WLD_010, kind: weld}       # WELD-10 — produce PART-Y
  - {name: SMN_L2_01, kind: loader}   # SMN-10 — loader supplying PART-W
  - {name: SMN_L2_02, kind: loader}   # SMN-10 — loader supplying PART-X
  - {name: FGN_L2_01, kind: loader}   # the drain: takes finished PART-Y out

processes:
  - {name: LINE-2, active_style: L2-A}
  - {name: SMN-10-W, active_style: SMN-10-W-RUN}
  - {name: SMN-10-X, active_style: SMN-10-X-RUN}
  - {name: DRAIN-10, active_style: DRAIN-10-RUN}

styles:
  - {name: L2-A, process: LINE-2, payload: PART-W}
  - {name: L2-B, process: LINE-2, payload: PART-X}
  - {name: L2-C, process: LINE-2, payload: PART-W}
  - {name: SMN-10-W-RUN, process: SMN-10-W, payload: PART-W}
  - {name: SMN-10-X-RUN, process: SMN-10-X, payload: PART-X}
  - {name: DRAIN-10-RUN, process: DRAIN-10, payload: PART-Y}

operator_stations: [LINE-2-OPS, SMN-10-OPS, SMN-10X-OPS, DRAIN-10-OPS]

claims:
  # ── PRS_010 — the seam. DIRECT: no inbound_staging on either claim. ──
  # L2-A and L2-B BOTH claim it, with different parts. That pair is the whole
  # point: at an A to B changeover the outgoing claim is still on the node when
  # B material lands, which is the only condition under which the defect fires.
  - core_node: PRS_010
    style: L2-A
    role: consume
    swap_mode: sequential
    paired_core_node: PRS_010B
    payload: PART-W
    uop_capacity: 20
    reorder_point: 8
    auto_reorder: true
    inbound_source: SMN_L2
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS
  - core_node: PRS_010
    style: L2-B
    role: consume
    swap_mode: sequential
    paired_core_node: PRS_010B
    payload: PART-X
    uop_capacity: 20
    reorder_point: 8
    auto_reorder: true
    inbound_source: SMN_L2
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS
  - core_node: PRS_010B
    style: L2-A
    role: consume
    swap_mode: sequential
    paired_core_node: PRS_010
    active_pull: false
    payload: PART-W
    uop_capacity: 20
    reorder_point: 8
    auto_reorder: true
    inbound_source: SMN_L2
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS
  - core_node: PRS_010B
    style: L2-B
    role: consume
    swap_mode: sequential
    paired_core_node: PRS_010
    active_pull: false
    payload: PART-X
    uop_capacity: 20
    reorder_point: 8
    auto_reorder: true
    inbound_source: SMN_L2
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS
  # L2-C deliberately has NO claim on PRS_010 (or its B position) — that absence IS scenario S2.

  # ── PRS_011 — the contrast. STAGED on every style. ──
  - core_node: PRS_011
    style: L2-A
    role: consume
    swap_mode: two_robot
    payload: PART-W
    uop_capacity: 20
    reorder_point: 8
    auto_reorder: true
    inbound_source: SMN_L2
    inbound_staging: SLN_L2_01
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS
  # PART-X under L2-B, so the A->B changeover moves BOTH consume nodes and each
  # takes a different road there: PRS_010 direct, PRS_011 through its staging
  # slot. One changeover then exercises the seam and its control at once, which
  # is the only way to claim the fix left the staged path alone — the two have to
  # be observed under the same conditions, not in separate runs.
  - core_node: PRS_011
    style: L2-B
    role: consume
    swap_mode: two_robot
    payload: PART-X
    uop_capacity: 20
    reorder_point: 8
    auto_reorder: true
    inbound_source: SMN_L2
    inbound_staging: SLN_L2_01
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS
  - core_node: PRS_011
    style: L2-C
    role: consume
    swap_mode: two_robot
    payload: PART-W
    uop_capacity: 20
    reorder_point: 8
    auto_reorder: true
    inbound_source: SMN_L2
    inbound_staging: SLN_L2_01
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS

  # ── WLD_010 — produce PART-Y under all three styles (continuity). ──
  # IT ASKS AHEAD: reorder point 14 of 20. A produce bin is exchanged when it is
  # full (the owner's rule), and a claim with no reorder point asks only then, so
  # the line stood still for the whole delivery leg every bin. At 1 part per tick
  # 14 gives the empty about six ticks to arrive, the round trip on this stack.
  # TestEdge2Fixture_ProduceClaimsAskAhead holds it.
  - core_node: WLD_010
    style: L2-A
    role: produce
    swap_mode: two_robot
    payload: PART-Y
    uop_capacity: 20
    reorder_point: 14
    auto_reorder: true
    inbound_source: SMN_L2
    inbound_staging: SLN_L2_02
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS
  - core_node: WLD_010
    style: L2-B
    role: produce
    swap_mode: two_robot
    payload: PART-Y
    uop_capacity: 20
    reorder_point: 14
    auto_reorder: true
    inbound_source: SMN_L2
    inbound_staging: SLN_L2_02
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS
  - core_node: WLD_010
    style: L2-C
    role: produce
    swap_mode: two_robot
    payload: PART-Y
    uop_capacity: 20
    reorder_point: 14
    auto_reorder: true
    inbound_source: SMN_L2
    inbound_staging: SLN_L2_02
    outbound_destination: SMN_L2
    operator_station: LINE-2-OPS

  # ── THE ENDS OF THE LOOP. Every payload needs BOTH, or the validator refuses
  # the plant and it deserves to: a payload with consumers and no producer starves,
  # one with producers and no consumer fills the market and jams. A LOADER IS A
  # PRODUCER — it puts material into the market — which reads backwards until you
  # notice the role is about the material flow, not about the person.
  - core_node: SMN_L2_01
    style: SMN-10-W-RUN
    role: produce
    swap_mode: manual_swap
    payload: PART-W
    uop_capacity: 20
    reorder_point: 2
    auto_reorder: true
    inbound_source: SMN_L2
    outbound_destination: SMN_L2
    operator_station: SMN-10-OPS
  - core_node: SMN_L2_02
    style: SMN-10-X-RUN
    role: produce
    swap_mode: manual_swap
    payload: PART-X
    uop_capacity: 20
    reorder_point: 2
    auto_reorder: true
    inbound_source: SMN_L2
    outbound_destination: SMN_L2
    operator_station: SMN-10X-OPS
  # The drain closes the produce side: WLD_010 fills PART-Y carriers, this empties
  # them back into the pool. Without it the market fills with finished goods and
  # the loop stops being a loop.
  - core_node: FGN_L2_01
    style: DRAIN-10-RUN
    role: consume
    swap_mode: manual_swap
    payload: PART-Y
    uop_capacity: 20
    reorder_point: 2
    auto_reorder: true
    inbound_source: SMN_L2
    outbound_destination: SMN_L2
    operator_station: DRAIN-10-OPS

# Core's loader switches (plantspec LoaderSettings). The drain's re-pull when its
# window frees reads Core's bin_loaders.auto_push, and only this section sets it: a
# loader claim gets no Edge claim row, so the claim's own auto_push and
# auto_reorder above seed nothing. Without it FGN_L2_01 pulled a full only when
# WLD_010's sim release asked for one (releaseAsPair's capture_lineside, a body no
# station sends), the shape that wedged demo.yaml's FGN_001 on 2026-10-28.
loader_settings:
  FGN_L2_01: {auto_push: true}

bins:
  # PACKED FROM THE BACK — each seeded carrier sits at its lane's DEEPEST slot and
  # the mouth stays open. See the zone comment for why the other way round is
  # refused at birth.
  - {name: L2-BW-01, slot: SMN_L2_002, payload: PART-W, uop: 20}
  - {name: L2-BW-02, slot: SMN_L2_004, payload: PART-W, uop: 20}
  # PART-X seeded FULL and waiting: the A to B changeover pulls from here, and the
  # whole scenario depends on that material being ready to land inside the gap.
  # ONE PER CELL THAT CLAIMS IT, and the count is not decoration: L2-B claims
  # PART-X at PRS_010, PRS_010B and PRS_011, so an A to B changeover needs three
  # PART-X carriers AT ONCE. Seeded with two, the third cell sat in
  # awaiting_material forever and the changeover could not complete — which
  # reads exactly like a code defect and is a fixture that cannot count.
  - {name: L2-BX-01, slot: SMN_L2_006, payload: PART-X, uop: 20}
  - {name: L2-BX-02, slot: SMN_L2_008, payload: PART-X, uop: 20}
  - {name: L2-BX-03, slot: SMN_L2_017, payload: PART-X, uop: 20}
  # AND ONE MORE, so the three-cell style can swap (see the arithmetic at the top).
  - {name: L2-BX-04, slot: SMN_L2_021, payload: PART-X, uop: 20}
  # Somewhere for finished PART-Y to go.
  - {name: L2-BY-01, slot: SMN_L2_010, payload: PART-Y, uop: 20}
  # Empty carriers — the spares the arithmetic above insists on.
  - {name: L2-MT-01, slot: SMN_L2_012, payload: "", uop: 0}
  - {name: L2-MT-02, slot: SMN_L2_014, payload: "", uop: 0}
  - {name: L2-MT-03, slot: SMN_L2_019, payload: "", uop: 0}
  - {name: L2-MT-04, slot: SMN_L2_022, payload: "", uop: 0}
  - {name: L2-MT-05, slot: SMN_L2_023, payload: "", uop: 0}
  - {name: L2-MT-06, slot: SMN_L2_024, payload: "", uop: 0}
  - {name: L2-MT-07, slot: SMN_L2_025, payload: "", uop: 0}

  # ── CARRIERS AT THE CELLS. Without one, seeddev binds no runtime state for the
  # node (it needs a bin AT the claim's node), the PLC tick has nothing to
  # attribute to, and the cell never counts — the loop looks configured and does
  # nothing. Seeded ABOVE the reorder point so the first tick is not an instant
  # replenishment against a cell that has just been handed a full carrier.
  - {name: L2-AT-P10, slot: PRS_010, payload: PART-W, uop: 20}
  - {name: L2-AT-P11, slot: PRS_011, payload: PART-W, uop: 20}
  # The produce cell starts with an EMPTY carrier to fill.
  - {name: L2-AT-W10, slot: WLD_010, payload: "", uop: 0}
  - {name: L2-AT-P10B, slot: PRS_010B, payload: PART-W, uop: 20}

demands:
  # PART-W's threshold is ABOVE WHAT ITS CELLS HOLD (C2c D24). Core's monitor
  # counts the plant-wide total, cells included, and PRS_010 + PRS_010B + PRS_011
  # hold up to 60 between them: at 20 the cells alone met it, the total froze at
  # 34 once PRS_011 drained, and the loader never refired (a stranded swap).
  # TestEdge2Fixture_ThresholdCoversSeatStock keeps every threshold above it.
  # PART-X's likewise, for the same three cells under L2-B: at 20 its loader was
  # asked once, at a total of 19, with the cells nearly dry, and the swaps it
  # should have fed waited for material until the changeover back cancelled them.
  - {payload: PART-W, node: SMN_L2_01, replenish_uop_threshold: 80}
  - {payload: PART-X, node: SMN_L2_02, replenish_uop_threshold: 80}
  - {payload: PART-Y, node: FGN_L2_01, replenish_uop_threshold: 0}

# ONE PLC COUNTER PER PROCESS, NOT PER CELL. A tick reaches cells through its
# process, not through the node its point names: handleCounterDelta walks every
# node of the tick's process and applies the tick to each claim of the tick's
# style. So LINE-2's one counter drives PRS_010, PRS_011 and WLD_010 together, at
# the 1 uop per 30 s tick the arithmetic at the top of this file is built on.
#
# This plant used to list three counters on LINE-2 (PRESS-10, PRESS-11, WELD-10).
# Each fed every LINE-2 cell, so a cell took three ticks a cycle, and the plant
# predates the seeder's one-counter rule: seeddev refuses a process given two
# different counters, so seed-edge2 failed until LINE-2 had one. demo.yaml has
# this shape already — one counter per process, repeated per style.
#
# plc_name/tag_name MUST match sim.processes in shingoedge.edge2.yaml — that list
# and this one are the same names twice, and a mismatch is silent (the tick fans
# to nothing).
reporting_points:
  # ── THIS PLANT COUNTS ONLY UNDER L2-A, AND IT CANNOT BE FIXED HERE ────────
  #
  # The tick fans to the nodes of the ACTIVE (process, style) pair, so under
  # L2-B this point fans to nothing: the presses run, consume nothing,
  # drain nothing, ask for nothing, and the loop stands still with every cell
  # holding a full carrier and last_poll_at frozen at the second before cutover.
  # Measured on this stack 2026-09-06.
  #
  # THE OBVIOUS FIX DOES NOT WORK, AND demo.yaml ALREADY TRIED IT. It carries
  # PRESS-1 and WELD-1 twice, once per style, with a comment saying exactly why
  # ("a reporting point pinned only to the -RUN style stops counting the instant
  # a changeover makes -ALT active"). Those two extra rows do not exist:
  # reporting_points is UNIQUE(plc_name, tag_name), so a physical counter
  # belongs to ONE style and `INSERT OR IGNORE` drops the second silently.
  # Measured in EDGE 1's own database — the plant file lists nine points and the
  # table holds seven, missing exactly the two -ALT rows.
  #
  # Widening the key to (style_id, plc_name, tag_name) is not a config change
  # and is not obviously safe: each row carries its own last_count, so a style
  # re-entered after a spell away would compute its first delta against a count
  # from the last time it ran. That is the duplicate-fanout shape, and it is an
  # owner decision rather than a fixture edit. Written up for the owner; until
  # it is answered, a scenario that needs counting runs under L2-A.
  - {plc_name: PRESS-10, tag_name: PRESS-10_COUNTER, node: PRS_010, style: L2-A}

