# journald retention for a shingo-core plant box.
#
# Install as /etc/systemd/journald.conf.d/10-shingo.conf, then:
#     sudo systemctl restart systemd-journald
#
# This is HOST-WIDE, not shingo-only — journald has no per-unit retention.
# install-core.sh deliberately does NOT write it; see deploy/README.md.
#
# Why it exists: Springfield, 2026-07-25, all three retention knobs were
# commented out, so systemd's built-in default applied (cap the journal at
# 10% of the filesystem or 4 GB, whichever is smaller; no time bound). At
# 633,129 lines/day that worked out to 3.8 GB holding ~15 days — shorter
# than the incidents being investigated, and the oldest retained line was
# 2026-07-10 while the incident under investigation was 2026-07-21.
#
# Retention was a side effect. These three lines make it a decision.

[Journal]

# Disk ceiling. 4G matches what the implicit default was already doing, so
# installing this drop-in does not itself change disk usage — it just stops
# the number depending on the size of the filesystem it happens to land on.
# Raise it if the box has room; this is the knob that buys days.
SystemMaxUse=4G

# Time ceiling. Nothing older than this is kept even if there is disk for it.
# The size cap above is normally the binding constraint; this bounds the case
# where a quiet plant would otherwise accumulate years of journal.
MaxRetentionSec=90day

# Rotate in smaller chunks. journald deletes whole files, so with the default
# (up to 1/8 of SystemMaxUse = 512M here) a rotation can drop half a gigabyte
# of history at once. 128M makes eviction granular and keeps the tail closer
# to the ceiling.
SystemMaxFileSize=128M
