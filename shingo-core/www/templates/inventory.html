{{define "content"}}
<!-- Inventory: the supermarket positions the threshold monitor watches (and
     setting their UoP threshold), and the lines (the Edge's processes), every
     claim of a running style, consume and produce. Each table opens on the rows
     that need a look. Filled by /api/inventory/loop (inventory.js); the count
     ledger is the Count history tab, /inventory/count-history. -->
<div class="inv-page" data-authenticated="{{if .Authenticated}}true{{else}}false{{end}}">

  <!-- The two inventory pages are tabs of one, the shared .tabs as links: the
       active tab is the title. A div, not a nav: shared/components.css styles
       every nav as the app header. -->
  <div class="tabs" role="navigation" aria-label="Inventory pages">
    <a class="tab active" href="/inventory" aria-current="page">Inventory</a>
    <a class="tab" href="/inventory/count-history">Count history</a>
  </div>

  <div class="inv-bar">
    <input type="text" id="inv-search" class="form-input inv-search"
           placeholder="Search part or node…  ( / to focus )" aria-label="Search part or node"
           data-action-input="onSearch">
    <button type="button" class="btn btn-sm" data-action="refresh" title="Refresh now">
      <svg class="icon icon-16" aria-hidden="true"><use href="#icon-refresh"></use></svg>
    </button>
    <span class="live-pill" id="inv-live" title="Live updates">idle</span>
    <span class="inv-live-stamp" id="inv-asof"></span>
    {{if .Authenticated}}
    <button type="button" class="btn btn-primary btn-sm" data-action="exportInventory" id="inv-export">
      <svg class="icon icon-16" aria-hidden="true"><use href="#icon-download"></use></svg> Export
    </button>
    {{end}}
  </div>

  <!-- The doubt line: bins whose count makes a sum untrustworthy. Rendered
       only when there is one; absent otherwise, never "0 problems". -->
  <div id="loop-doubt"></div>

  <section class="card mb-2 loop-section" id="positions">
    <div class="loop-scroll">
      <table class="loop-table">
        <caption class="loop-caption">Supermarket positions</caption>
        <thead id="pos-head"></thead>
        <tbody id="pos-body"><tr><td colspan="6" class="dash-empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </section>

  <section class="card mb-2 loop-section" id="lines" hidden>
    <div class="loop-scroll">
      <table class="loop-table">
        <caption class="loop-caption">Lines</caption>
        <thead id="line-head"></thead>
        <tbody id="line-body"></tbody>
      </table>
    </div>
  </section>

</div>

<!-- The threshold calculator's inputs for one row: what the page's suggestion
     was computed from, with the cycle and the safety factor open to change and
     the calculator re-run on Core (POST /api/loader/calculate). -->
<div class="modal-overlay" id="loop-calc" data-backdrop-close>
  <div class="modal loop-calc-modal">
    <div class="modal-header">
      <h2 id="loop-calc-title">Threshold calculator</h2>
      <button class="modal-close" data-action="closeCalc" aria-label="Close"><svg class="icon icon-20" aria-hidden="true"><use href="#icon-close"></use></svg></button>
    </div>
    <div id="loop-calc-body"></div>
  </div>
</div>

<script type="module" src="/static/pages/inventory.js"></script>
{{end}}
