{{define "content"}}
<div class="flex-center gap-2 mb-1">
  <a href="/missions">&larr; Back to Missions</a>
  <a href="/orders?open={{.OrderID}}" title="View this order on the Orders page" style="font-size:.9em">View Order</a>
</div>
<h2>Mission #<span id="mission-order-id">{{.OrderID}}</span></h2>

<div id="mission-loading">Loading...</div>
<div id="mission-content" style="display:none">

  <!-- Summary -->
  <div class="card mb-2" id="mission-summary"></div>

  <!-- Stages: one row per order status span, from order_history. The bar is
       the same spans on a true time scale in four classes. -->
  <div class="card mb-2 mission-stages">
    <h3 class="mt-0" title="Every status the order held, how long it held it, and its share of the order's life">Stages</h3>
    <div class="stage-bar" id="stage-bar"></div>
    <div class="stage-legend text-sm" id="stage-legend"></div>
    <table class="table-compact w-full stage-table">
      <thead>
        <tr>
          <th title="Order status held for this span">Stage</th>
          <th title="Where the robot worked during this span, from the fleet's per-block reports">Where</th>
          <th title="When the order entered this status (plant time)">Started</th>
          <th class="col-num" title="How long the order held this status">Took</th>
          <th class="col-num" title="Share of the order's life">Share</th>
        </tr>
      </thead>
      <tbody id="stage-rows"></tbody>
    </table>
  </div>

  <!-- RDS Messages -->
  <div class="card mb-2" id="mission-messages-card" style="display:none">
    <h3 class="mt-0" title="Errors, warnings, and notices reported by the fleet backend during this mission">Fleet Messages</h3>
    <div id="mission-messages"></div>
  </div>

  <!-- Robot actions: the fleet's per-block legs and vendor transitions,
       grouped by stage. Closed by default. -->
  <details class="card mission-actions">
    <summary title="The fleet's per-block legs and state reports, grouped by the stage they happened in">Robot actions (<span id="mission-actions-count">0</span>)</summary>
    <div id="mission-actions"></div>
  </details>

</div>

<script type="module" src="/static/pages/mission-detail.js"></script>
{{end}}
