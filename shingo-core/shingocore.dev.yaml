# shingocore.dev.yaml — LOCAL DEV / SIMULATION ONLY. NOT FOR PRODUCTION.
# Loaded by a shingocore built with -tags sim; the binary refuses to start
# unless SHINGO_ALLOW_SIM=1 (T0.3). Hosts are docker-compose service names;
# loopback enforcement lives in docker-compose.dev.yml port mappings (T0.4).
database:
  postgres:
    host: postgres
    port: 5432
    database: shingocore
    user: shingocore
    password: shingocore
    sslmode: disable

web:
  host: 0.0.0.0                      # bind inside container; compose maps to 127.0.0.1
  port: 8083
  session_secret: dev-only-not-a-real-secret

messaging:
  kafka:
    brokers:
      - kafka:9092
    group_id: shingocore
  orders_topic: shingo.orders
  dispatch_topic: shingo.dispatch
  # 500ms (sim): at 10× sim the plant inserts outbox rows far faster than the
  # PRODUCTION-paced 5s tick (batch 50 → ~10 msg/s ceiling) can drain, so ~150–200
  # time-sensitive order transitions sit pending (sent_at IS NULL) in steady state
  # and publish seconds late, stressing swap choreography. The drainer does one
  # batch per tick, so shortening the interval is the lever (batch size is fixed at
  # 50 in messaging.NewOutboxDrainer). 500ms × 50 = up to 100k msg/s headroom.
  outbox_drain_interval: 500ms
  station_id: core

# rds / fire_alarm intentionally omitted — sim mode skips the RDS adapter
# (T1.1). Defaults apply for anything else.

# Staging / reconciliation cadence. The sim has no human operator to confirm a
# produce/consume delivery, so `delivered` orders rely on the reconciliation
# sweep to auto-confirm them (delivered→confirmed = terminal). The PRODUCTION
# defaults (sweep_interval 5m, auto_confirm_delivered 5m) leave a produce relief's
# resupply leg (AutoConfirmA=false) sitting `delivered` — hence non-terminal — for
# up to 5 wall-minutes; meanwhile CanAcceptOrders reports "active order in progress"
# and blocks the next relief, so the output bin overfills past capacity and the
# cell stalls (the sim-plant-design.md §5 contract). Drive both short here so a
# delivery confirms within ~2s and the swap loop self-clears headlessly. Loaders/
# unloaders carry skip_auto_confirm and stay sim-operator-driven (CLEAR), so a
# short auto_confirm does not race them.
#
# abandon_stuck is DISABLED here (0s). In production a non-terminal order stuck past
# 1h is cancelled — a held swap removal leg, a robot parked at a staging node, real
# faults worth clearing. In the SIM that same sweep reaps orders that are merely
# waiting out a downtime outage: a press down past the depth of its supermarket's
# buffer starves the downstream weld, whose two-robot swap then holds its removal leg
# "until the supply sibling claims a bin" — and at 1h sim-time the sweep cancels it.
# Those show up as a churn of cancelled/failed orders that are sim artifacts, not
# plant problems. Off = the sim self-heals when the machine recovers, instead of
# abandoning the backlog. (Must be a duration string — bare `0` fails yaml→Duration.)
staging:
  sweep_interval: 2s            # wall-clock ticker for the reconciliation + staged-bin sweeps
  auto_confirm_delivered: 2s    # sim-clock age after which a stuck `delivered` order is confirmed
  abandon_stuck: 0s             # sim: disable the >1h stuck-order abandonment sweep (0 = off)
  # ttl: 0s = PERMANENT, and permanent is what production runs (config.go
  # StagingConfig.TTL: "0 (the default) means permanent"). The sim runs production
  # staging semantics. Owner ruling 2026-08-31; this line is not a knob to try.
  #
  # IT USED TO SAY 30s, AND THE REASON WAS REAL BUT THE CURE WAS WORSE. Swap and
  # complex deliveries land bins `staged` at lineside nodes with
  # staged_expires_at=NULL, and ReleaseExpiredStaged (store/bins/bins.go:1202)
  # skips NULL-expiry rows by construction — so nothing ever unstages them. That is
  # the freeze the 30s value was added to drive the sim past, and it is a real skip
  # you can still go and read.
  #
  # WHAT TWO DIAGNOSTIC PASSES FOUND, 2026-08-30/31, independently and agreeing: at
  # ttl 0s the freeze blocks ZERO orders. Every starved order in the run is refused
  # by the `COALESCE(b.payload_code,'') = ''` clause of EmptyCarrierWhere
  # (bins.go:314) — the carrier still carries a payload — and not by the
  # `b.status <> 'staged'` clause sitting right next to it. Frozen carriers are an
  # amplifier, not a wedge.
  #
  # AND THE 30s VALUE MANUFACTURED A WEDGE OF ITS OWN. It flips a lineside carrier
  # back to `available` while it is still sitting at the cell, where
  # AccessibleEmptyOrder ranks it ahead of every lane mouth for being the least work
  # to reach — the keeper theft the P0-1 design was built on. At 0s that theft
  # happens zero times in a full run. A sim that reproduces a defect its own config
  # invented is not evidence about the plant.
  ttl: 0s

sim:
  enabled: true
  seed: 1                           # fixed for reproducible dev runs (0 = derive+log)
  speed: 10.0                       # time multiplier. Change live in the dev top-strip / POST /api/sim/speed.
  # SYNCED RUNNING (zero core↔edge drift, and the multiplier is real). In
  # running-clock mode (no epoch) each binary stamps its own boot-now as the clock
  # epoch, so core+edge drift by boot-skew × speed and cross-process coordination
  # messages expire (the 2026-07-12 loop-degradation root cause — 400+ expired-message
  # drops). Setting epoch + an IDENTICAL anchor_wall in BOTH configs locks them to one
  # shared anchor: sim-now = epoch + speed×(wallNow−anchor), identical on both sides.
  #
  # epoch == anchor_wall selects SimSyncedRunning: no wall clamp, so Now() and every
  # ticker run at the SAME speed. Until §R.98 this same pair built a CLAMPING clock,
  # and the clamp was permanent from the first tick — Now() ran at 1× while tickers
  # ran at 10×, for every run this rig has ever done. The old comment here said the
  # sim "fast-forwards briefly then runs 10× live", which a clamping clock cannot do:
  # after catch-up it tracks wall at 1×, forever. The line was describing this mode
  # before it existed.
  #
  # Set epoch EARLIER than anchor_wall only to replay history: that still clamps, on
  # purpose, and the boot banner now says when it stops being fast.
  # Both epoch AND anchor_wall MUST match shingoedge.dev.yaml EXACTLY. Rebuild after edit.
  epoch: 2026-07-12T02:30:00Z
  anchor_wall: 2026-07-12T02:30:00Z
  # Finite fleet + fast transit. The demo's swap choreography (4 transits per supply
  # cycle) must complete before the consume bin drains from reorder_point to zero.
  # At 6 UOP/min and reorder_point 15 (panels), the drain window is ~150s; at 4×15-20s
  # transit the supply cycle is ~60-80s — comfortable headroom. 45-60s transit starved
  # every consume cell (supply cycle 180-240s >> drain window 80s). fleet 20 @ 15-20s.
  transit_min: 15s
  transit_max: 20s
  # fleet_size also names the fleet: the driver mints AMR-01..AMR-20 at boot and
  # hands them out FIFO, so per-robot breakdown / robot filter / utilization /
  # hourly concurrency have a real population to aggregate over. (It used to
  # stamp one synthetic robot per order, which made every fleet-shaped metric a
  # sample of one.) Set 7 to mirror Springfield's actual fleet — but not here:
  # the demo's rate balance above needs 20 to keep the supply cycle inside the
  # drain window.
  fleet_size: 20
  jitter_pct: 0.2
  fail_rate: 0.0
