name: Core

# This workflow triggers on itself as well as on the code it tests.
# lint.yml already does this; core.yml did not, so a change to the test
# invocation below could only be exercised by a later, unrelated Go
# commit. A gate whose own edits do not run it cannot report on them.
on:
  push:
    paths:
      - "shingo-core/**"
      - "protocol/**"
      # shared/** is a real dependency: Core's www package imports
      # shingo/shared (chip_drift_test.go walks shared.Files) and the
      # templates load its stylesheets. Without it here, a change that
      # breaks Core's build lands with Core CI never running.
      - "shared/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "shingo-core/**"
      - "protocol/**"
      - "shared/**"
      - ".github/workflows/core.yml"
  workflow_call:

# Coalesce overlapping runs on the same branch / PR so a quick burst
# of pushes only consumes one CI slot. The cancel-in-progress flag is
# safe here because the workflow is idempotent (build + tests with
# -count=1) and the latest commit run is always the one that
# matters for merge gating.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, and it is load-bearing.
          #
          # TestSchemaConvergesAcrossVintages builds an "aged" database from a
          # baseline read out of git at a pinned revision — `git show
          # <rev>:store/schema/...`. actions/checkout defaults to a SHALLOW
          # clone (fetch-depth 1), where neither an older commit nor a tag
          # exists, so every pinned vintage fails with "invalid object name"
          # and the test that exists to catch upgrade-path bugs cannot run at
          # all.
          #
          # Skipping the test when the revision is missing would be worse than
          # this cost: it would go green in CI while asserting nothing, which is
          # the exact failure class the convergence test was written to close.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          # WITHOUT THIS LINE THE CACHE IS SILENTLY OFF, and it has been.
          #
          # setup-go defaults cache:true, and with no cache-dependency-path it
          # calls findDependencyFile(), which does readdirSync(GITHUB_WORKSPACE)
          # and requires `go.mod` IN THE ROOT — not recursively. This is a
          # go.work repo: the root holds go.work and the five go.mod files live
          # one directory down. So the lookup throws
          #
          #   Dependencies file is not found in /home/runner/work/shingo/shingo.
          #   Supported file pattern: go.mod
          #
          # and main.ts catches it: `catch (error) { core.warning(...) }`. The
          # job stays GREEN and restores nothing. Verified by running setup-go's
          # own findDependencyFile against this repo root.
          #
          # What was being thrown away is both of the paths it caches --
          # `go env GOMODCACHE` AND `go env GOCACHE` -- so every job on every
          # push re-downloaded every module and recompiled every package from
          # scratch, on a 2-core runner. For scale: shingo-core's docker-tagged
          # compile alone is 43s on a 20-core dev host.
          #
          # CONFIRMED ON A RUNNER: before this line existed the repo had never
          # held a single setup-go-* cache entry — every entry in the registry
          # was golangci-lint's own, which is why nothing ever looked wrong.
          #
          # THE PATH IS THIS MODULE'S, NOT "**/go.sum", and that is the second
          # half of the fix. The key is a hash of the files named here, so a
          # repo-wide glob gives every workflow an IDENTICAL key: the first job
          # to finish saves, every other job skips with "already exists", and
          # the stored GOCACHE belongs to whichever small job won the race.
          # MEASURED: with the shared key, Core's Build step went 42s cold to
          # 36s "warm" — it restored the module downloads and then recompiled
          # everything, because the cached build artifacts were somebody else's.
          #
          # Naming shingo-core + protocol makes this key distinct from edge's
          # and integration's, so each module saves and restores its own build
          # cache. Listing protocol too keeps the key honest: go.work builds
          # core against it, so its dependencies are part of what got compiled.
          #
          # A wrong key is a MISS, never a bad build — Go's cache is
          # content-addressed and re-verifies everything it reuses. shared/ is
          # deliberately not named: it has a go.mod but no go.sum, so hashing
          # it would resolve nothing and throw exactly the way the unset
          # default did.
          cache-dependency-path: |
            shingo-core/go.sum
            protocol/go.sum

      - name: Build
        working-directory: shingo-core
        run: go build ./...

      # See the matching step in edge.yml: sim-tagged code is compiled nowhere
      # in CI, so a signature change that misses a sim call site goes green here
      # and fails on the box that builds the dev stack.
      - name: Build (sim)
        working-directory: shingo-core
        run: go build -tags sim ./...

      # THE UNTAGGED SUITE IS NOT RUN HERE, BECAUSE THE DOCKER JOBS BELOW
      # ALREADY RUN IT. `-tags=docker` ADDS files and removes none, and nothing
      # in this tree carries a `!docker` constraint, so `go test -tags=docker
      # ./...` executes every test `go test ./...` would, plus the docker ones.
      #
      # VERIFIED against `go test -list` rather than assumed: shingo-core's
      # engine lists 37 tests untagged and 264 with the tag, rds 154 and 154,
      # store/orders 1 and 28 -- and in each package, zero tests present
      # untagged and absent with the tag. No docker-tagged file defines
      # TestMain or init(), and every package-level var in one is either an
      # inert literal or a `var _ T = (*impl)(nil)` assertion, so the tag adds
      # tests without re-wiring package state.
      #
      # This step remains so the untagged build itself stays gated: a test file
      # that only compiles when a docker-tagged helper is present would
      # otherwise break `go test ./...` for every developer while CI stayed
      # green. -run NONE compiles the test binaries and runs nothing, which is
      # the part the docker steps genuinely do not cover. `go build ./...`
      # above covers only non-test code.
      - name: Build (test binaries, untagged)
        working-directory: shingo-core
        run: go test -run NONE -count=1 ./...

  # THE TWO DOCKER SUITES ARE SEPARATE JOBS, AND THAT IS PURE WALL CLOCK.
  #
  # They used to be two steps in the job above, so they ran back to back:
  # MEASURED on this runner, 137s then 334s inside a 568s job. Nothing in the
  # race run depends on the plain run — same suite, different flag — so the
  # sum was being paid for no reason. As jobs they overlap, and the workflow
  # ends when the longest one does instead of when their total does.
  #
  # NO `needs:` ON EITHER, deliberately. Gating them behind `build` would
  # serialise the very thing this split exists to overlap, for a compile check
  # that `go test` repeats anyway. The cost is that a genuine compile error is
  # reported by three jobs at once, which is noise on a run that has already
  # failed.
  #
  # Each job gets its own checkout, toolchain and Postgres, so the per-job
  # entry cost (~50-75s) is now paid three times rather than once. That is the
  # trade: ~150s of wall clock for ~150s of extra runner time, on a public
  # repo where standard-runner minutes are free.

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: TestSchemaConvergesAcrossVintages reads pinned
          # revisions out of git. See the note in the build job.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          # Same key as the build job — same module, same dependencies, so
          # they share a cache rather than fighting over one. See the build
          # job for why this line has to be here at all.
          cache-dependency-path: |
            shingo-core/go.sum
            protocol/go.sum

      - name: Prepare build dir
        working-directory: shingo-core
        run: mkdir -p build

      # ONE POSTGRES FOR THE WHOLE JOB, rather than one per Go package.
      #
      # Every Go package is its own test process, so testcontainers' "one
      # container per process" is one container per PACKAGE, and 31 of this
      # module's packages carry docker-tagged tests --
      #   grep -rln 'go:build docker' shingo-core/ --include='*.go' \
      #     | xargs -n1 dirname | sort -u | wc -l
      # -- each paying a Postgres boot plus a full replay of the migration
      # stack into its own template. MEASURED on a 20-core dev host that is
      # ~5.4s per package (~3s boot, ~2.4s migrations) against ~0.2s of real
      # query work in a small package; a cold 2-core runner is worse, not
      # better. shingo-core/internal/testdb takes $SHINGO_TEST_PG instead when
      # it is set, and builds the template once under a Postgres advisory lock
      # that the other 30 packages wait on.
      #
      # A `services:` block cannot do this: it can pass container options but
      # not the server's own command arguments, and fsync=off et al are the
      # point -- this database is thrown away with the runner, so the settings
      # that exist to survive a crash are pure cost.
      #
      # The name is scoped to run AND job: each job now has its own container,
      # so there is nothing to share, and a per-job name keeps that obvious.
      - name: Start shared Postgres
        run: |
          set -euo pipefail
          id=$(docker run -d \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=postgres \
            -e PGDATA=/var/lib/postgresql/data/pgdata \
            --tmpfs /var/lib/postgresql/data:rw,size=2g \
            -p 127.0.0.1::5432 \
            postgres:16-alpine \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c max_connections=500 -c shared_buffers=256MB)
          for _ in $(seq 1 60); do
            docker exec "$id" pg_isready -U test -q && break
            sleep 1
          done
          docker exec "$id" pg_isready -U test
          port=$(docker port "$id" 5432/tcp | head -1 | sed 's/.*://')
          echo "SHINGO_TEST_PG=127.0.0.1:$port" >> "$GITHUB_ENV"
          echo "SHINGO_TEST_PG_TEMPLATE=template_ci_${{ github.run_id }}_docker" >> "$GITHUB_ENV"

      - name: Test (Docker integration)
        working-directory: shingo-core
        # -count=1 prevents stale-cache false positives on integration tests;
        # -timeout=10m accommodates a cold runner.
        #
        # -p 1 STAYS, but not for the reason it used to. It was here because
        # packages contended over testcontainers' containers, which the shared
        # server above removes. It stays because ubuntu-latest has 2-4 cores
        # and tests inside a package already run up to GOMAXPROCS-parallel: on
        # a 20-core dev host the best setting measured nproc/4, which on this
        # runner is 1. Raising it here would oversubscribe, which measured
        # strictly worse (-p 8 made every package 4-6x slower individually).
        run: go test -tags=docker -timeout=10m -count=1 -p 1 -coverprofile=build/coverage-docker ./...

      - name: Coverage report (Docker)
        working-directory: shingo-core
        run: go tool cover -func=build/coverage-docker

  # ── The race suite, sharded ──────────────────────────────────────────
  #
  # THE LONG POLE OF THIS WORKFLOW: 322s of a 395s run, against 137s for the
  # same suite without the flag. That is the race detector's usual 5-20x on
  # memory access, and it buys a guarantee worth keeping for software that
  # drives AMRs around a plant: a data race cannot reach main. So it is made
  # cheaper by running the packages side by side, not by running it less often.
  #
  # THE PACKAGE LIST IS NEVER WRITTEN DOWN. It is re-derived from `go list` on
  # every run, because a hardcoded list would be wrong within a month and
  # would not fail loudly when it was — it would just quietly stop testing
  # whatever had drifted out of it. The only thing carried between runs is
  # per-package DURATIONS, and those self-correct: see scripts/shard-plan.py.
  #
  # ONE PLAN JOB, NOT A PLAN PER SHARD. Every shard could compute the same
  # partition independently and take its own slice, which would save this
  # job's ~30s. It is not worth the failure mode: two shards restoring
  # different timings caches would compute different partitions, and packages
  # would be run twice or not at all, silently. Computing it once and handing
  # the same answer to all six makes divergence impossible.

  race-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: |
            shingo-core/go.sum
            protocol/go.sum

      # Rolling key: cache entries are immutable once written, so the key
      # carries the run id and the prefix in restore-keys picks up the most
      # recent previous one. A miss is fine — shard-plan falls back to equal
      # weights and the run is merely less balanced.
      - uses: actions/cache/restore@v4
        with:
          path: .shard/timings.json
          key: shard-timings-core-${{ github.run_id }}
          restore-keys: |
            shard-timings-core-

      # Go, not a shell one-liner and not a script in some other language:
      # scripts/shardplan is the only part of this that must not be subtly
      # wrong, and being Go means `go test ./scripts/shardplan` covers the
      # packer, its determinism, and the partition check. It is also the only
      # language already in this repo — see shingo-core/scripts/cover_summary.go
      # for the same pattern.
      - id: plan
        run: |
          set -euo pipefail
          mkdir -p .shard
          cd shingo-core
          go list -tags=docker ./... > ../.shard/pkgs.txt
          matrix=$(go run ./scripts/shardplan plan \
            -shards 6 -timings ../.shard/timings.json < ../.shard/pkgs.txt)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # Handed to race-record, which prunes timings down to the packages that
      # still exist. Passing it rather than re-deriving it also means both
      # halves of a run agree on what the package set was.
      - uses: actions/upload-artifact@v4
        with:
          name: shard-pkgs
          path: .shard/pkgs.txt

  docker-race:
    needs: race-plan
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off: one shard finding a race must not cancel the others.
      # Their results are still wanted — both to see whether the failure is
      # isolated, and so race-record still gets timings for the rest.
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.race-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: |
            shingo-core/go.sum
            protocol/go.sum

      - name: Start shared Postgres
        run: |
          set -euo pipefail
          id=$(docker run -d \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=postgres \
            -e PGDATA=/var/lib/postgresql/data/pgdata \
            --tmpfs /var/lib/postgresql/data:rw,size=2g \
            -p 127.0.0.1::5432 \
            postgres:16-alpine \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c max_connections=500 -c shared_buffers=256MB)
          for _ in $(seq 1 60); do
            docker exec "$id" pg_isready -U test -q && break
            sleep 1
          done
          docker exec "$id" pg_isready -U test
          port=$(docker port "$id" 5432/tcp | head -1 | sed 's/.*://')
          echo "SHINGO_TEST_PG=127.0.0.1:$port" >> "$GITHUB_ENV"
          echo "SHINGO_TEST_PG_TEMPLATE=template_ci_${{ github.run_id }}_race${{ matrix.shard.id }}" >> "$GITHUB_ENV"

      - name: Test (Docker integration, race) — shard ${{ matrix.shard.id }}
        working-directory: shingo-core
        # NOT -json, deliberately: the timings are parseable from plain output
        # (shard-plan record reads both), and a race report is a multi-page
        # stack dump that JSON would make unreadable on the one run where
        # somebody has to read it.
        #
        # pipefail so `tee` cannot mask a failing exit code. -p 1 for the same
        # reason as the plain docker job: the runner has 2-4 cores and
        # in-package parallelism already uses them.
        run: |
          set -o pipefail
          mkdir -p ../.shard
          go test -tags=docker -race -timeout=25m -count=1 -p 1 \
            ${{ matrix.shard.pkgs }} \
            | tee ../.shard/results-${{ matrix.shard.id }}.log

      # if: always() — a shard that failed still produced timings for the
      # packages that did run, and losing them would unbalance the next run.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-results-${{ matrix.shard.id }}
          path: .shard/results-${{ matrix.shard.id }}.log
          if-no-files-found: ignore

  race-record:
    needs: [race-plan, docker-race]
    # always(): timings are worth keeping even when a shard went red. This job
    # never gates anything — it only feeds the next run's balance.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: |
            shingo-core/go.sum
            protocol/go.sum

      - uses: actions/download-artifact@v4
        with:
          path: .shard-artifacts

      - name: Merge timings
        run: |
          set -euo pipefail
          mkdir -p .shard
          find .shard-artifacts -name 'results-*.log' -print
          cd shingo-core
          go run ./scripts/shardplan record \
            -timings ../.shard/timings.json \
            $(find ../.shard-artifacts -name 'results-*.log') \
            < ../.shard-artifacts/shard-pkgs/pkgs.txt

      - uses: actions/cache/save@v4
        with:
          path: .shard/timings.json
          key: shard-timings-core-${{ github.run_id }}
