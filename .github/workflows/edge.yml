name: Edge

on:
  push:
    paths:
      - "shingo-edge/**"
      - "protocol/**"
      - "shared/**"
  pull_request:
    paths:
      - "shingo-edge/**"
      - "protocol/**"
      - "shared/**"
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"

      - name: Build
        working-directory: shingo-edge
        run: go build ./...

      - name: Build (sim)
        working-directory: shingo-edge
        run: go build -tags sim ./...

      - name: Prepare build dir
        working-directory: shingo-edge
        run: mkdir -p build

      - name: Test (unit)
        working-directory: shingo-edge
        run: go test -coverprofile=build/coverage ./...

      - name: Test (unit, race)
        working-directory: shingo-edge
        run: go test -race -count=1 ./...

      - name: Coverage report (unit)
        working-directory: shingo-edge
        run: go tool cover -func=build/coverage

      - name: Test (Docker integration)
        working-directory: shingo-edge
        run: go test -tags=docker -timeout=10m -count=1 -coverprofile=build/coverage-docker ./...

      - name: Coverage report (Docker)
        working-directory: shingo-edge
        run: go tool cover -func=build/coverage-docker

      - name: Test (Docker integration, race)
        working-directory: shingo-edge
        run: go test -tags=docker -race -timeout=25m -count=1 ./...
