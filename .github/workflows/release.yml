name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/protocol.yml
  test-core:
    uses: ./.github/workflows/core.yml
  test-edge:
    uses: ./.github/workflows/edge.yml
  test-shared:
    # Was absent: a release shipped without shared's tests having run on the
    # tag. protocol/core/edge all build against shared via go.work, so a
    # broken shared passed their builds while its own seven test files ran
    # nowhere in the release chain.
    uses: ./.github/workflows/shared.yml
  test-integration:
    # Was absent for the same reason — the scenario suite is the only place
    # the five modules are exercised together before a release.
    uses: ./.github/workflows/integration.yml
  lint:
    # Was absent: the lint gate (depguard + forbidido + the docker-tag
    # compile) ran on pushes but never gated a release.
    uses: ./.github/workflows/lint.yml
  guards:
    # Was absent: the scripts/check-*.sh guard set never gated a release.
    uses: ./.github/workflows/guards.yml

  release:
    # Every gate that runs on a push now also gates the tag: lint, shared,
    # integration, guards join protocol/core/edge. Nothing ships that did
    # not pass the same checks a branch had to.
    needs: [test, test-core, test-edge, test-shared, test-integration, lint, guards]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          # 32-bit ARM (armv7): a Raspberry Pi running a 32-bit OS reports
          # armv7l and runs neither the amd64 nor the arm64 binary.
          - goos: linux
            goarch: arm
            goarm: '7'
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          # Without this, the cache is silently OFF. setup-go defaults
          # cache:true, and with no cache-dependency-path it requires `go.mod`
          # in the REPO ROOT (readdirSync, not recursive). This is a go.work
          # repo: the root has go.work and the go.mod files sit one level down,
          # so the lookup throws "Dependencies file is not found ... Supported
          # file pattern: go.mod" — and main.ts catches it into a warning, so
          # the job stays green having restored nothing. It caches both
          # GOMODCACHE and GOCACHE, so every job was re-downloading every
          # module and recompiling from scratch. See core.yml for the full note.
          cache-dependency-path: "**/go.sum"

      - name: Build shingocore
        working-directory: shingo-core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Empty on every row but linux/arm; Go reads GOARM only for GOARCH=arm.
          GOARM: ${{ matrix.goarm }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags "-s -w -X main.Version=${{ github.ref_name }} -X main.Commit=$(git rev-parse --short HEAD)" \
            -o ../dist/shingocore-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
            ./cmd/shingocore

      - name: Build shingoedge
        working-directory: shingo-edge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags "-s -w -X main.Version=${{ github.ref_name }} -X main.Commit=$(git rev-parse --short HEAD)" \
            -o ../dist/shingoedge-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
            ./cmd/shingoedge

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # The release's notes are its section of CHANGELOG.md, the one `make
      # release` cut from `## Unreleased` (Deploy: line first), not GitHub's
      # generated list of merged pull requests. Read at the tag, so the
      # checkout and Go come first. A tag with no section fails here, before
      # anything is published.
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          # See the release job above: without it the cache is silently off.
          cache-dependency-path: "**/go.sum"

      - name: Release notes from CHANGELOG.md
        working-directory: shared
        run: go run ./scripts/release -root .. -notes "${{ github.ref_name }}" > ../release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
