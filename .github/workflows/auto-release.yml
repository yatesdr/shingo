name: Auto Release

# Every push to main whose CHANGELOG.md `## Unreleased` has content becomes a
# release, in this one run: plan → the gates → cut → build → publish. Nobody
# runs `make release`; the human step is at the plant (`install-*.sh --tag`).
#
# ONE RUN, NOT A TAG-TRIGGERED SECOND ONE. A commit or tag pushed with
# GITHUB_TOKEN triggers no workflow, so the tag `cut` pushes cannot start a
# build elsewhere: build and publish live here.
#
# THE LOOP STOPS TWICE. The release commit `cut` pushes has an empty
# `## Unreleased` (plan would say release=no), and being pushed with
# GITHUB_TOKEN it starts no run at all.
#
# NOTHING SHIPS THAT DID NOT PASS WHAT A BRANCH HAD TO: `cut` needs every gate
# workflow a push runs, called here on the same sha. `cut` itself refuses unless
# origin/main is still that sha (a push landed meanwhile → a clean failure, and
# the next run releases both changes).

on:
  push:
    branches: [main]

# One release at a time, and never cancel one mid-cut: a push during a run
# waits, then releases whatever it carries.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      # Full history and tags: the plan compares the tree with the last v* tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          # Without it the cache is silently off in a go.work repo (core.yml).
          cache-dependency-path: "**/go.sum"

      - id: plan
        working-directory: shared
        shell: bash
        run: |
          go run ./scripts/release -root .. -plan > "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt"
          line="$(head -n 1 "$RUNNER_TEMP/plan.txt")"
          release="$(printf '%s\n' "$line" | sed -n 's/^release=\(yes\|no\)\( .*\)\{0,1\}$/\1/p')"
          version="$(printf '%s\n' "$line" | sed -n 's/^release=yes version=\(v[0-9]*\.[0-9]*\.[0-9]*\) .*/\1/p')"
          if [ -z "$release" ] || { [ "$release" = yes ] && [ -z "$version" ]; }; then
            echo "the plan line did not parse: $line"
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ── The gates: the workflows a push runs, on this sha ──────────────────
  protocol:
    needs: plan
    if: needs.plan.outputs.release == 'yes'
    uses: ./.github/workflows/protocol.yml
  core:
    needs: plan
    if: needs.plan.outputs.release == 'yes'
    uses: ./.github/workflows/core.yml
  edge:
    needs: plan
    if: needs.plan.outputs.release == 'yes'
    uses: ./.github/workflows/edge.yml
  shared:
    needs: plan
    if: needs.plan.outputs.release == 'yes'
    uses: ./.github/workflows/shared.yml
  integration:
    needs: plan
    if: needs.plan.outputs.release == 'yes'
    uses: ./.github/workflows/integration.yml
  lint:
    needs: plan
    if: needs.plan.outputs.release == 'yes'
    uses: ./.github/workflows/lint.yml
  guards:
    needs: plan
    if: needs.plan.outputs.release == 'yes'
    uses: ./.github/workflows/guards.yml

  cut:
    needs: [plan, protocol, core, edge, shared, integration, lint, guards]
    if: needs.plan.outputs.release == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache-dependency-path: "**/go.sum"

      # The release refuses a detached HEAD: be on main, at the gated commit.
      # It then refuses unless origin/main is still this sha.
      - name: On main at the gated commit
        run: git checkout -q -B main "$GITHUB_SHA"

      # The release commit's author: the workflow, not a person and not a vendor.
      - name: Release identity
        run: |
          git config user.name shingo-release
          git config user.email shingo-release@users.noreply.github.com

      - id: cut
        working-directory: shared
        run: |
          go run ./scripts/release -root .. -ci
          tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          [ -n "$tag" ] || { echo "the release made no tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: cut
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          # 32-bit ARM (armv7): a Raspberry Pi running a 32-bit OS reports
          # armv7l and runs neither the amd64 nor the arm64 binary.
          - goos: linux
            goarch: arm
            goarm: '7'
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.cut.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache-dependency-path: "**/go.sum"

      - name: Build shingocore and shingoedge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Empty on every row but linux/arm; Go reads GOARM only for GOARCH=arm.
          GOARM: ${{ matrix.goarm }}
          TAG: ${{ needs.cut.outputs.tag }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          COMMIT="$(git rev-parse --short HEAD)"
          for bin in core edge; do
            (cd "shingo-$bin" && go build -ldflags "-s -w -X main.Version=$TAG -X main.Commit=$COMMIT" \
              -o "../dist/shingo$bin-$GOOS-$GOARCH$EXT" "./cmd/shingo$bin")
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  publish:
    needs: [cut, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.cut.outputs.tag }}
    steps:
      # The notes are the release's CHANGELOG.md section (Deploy: line first),
      # read at the tag; a tag with no section fails here, before publishing.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.cut.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache-dependency-path: "**/go.sum"

      - name: Release notes from CHANGELOG.md
        working-directory: shared
        run: go run ./scripts/release -root .. -notes "$TAG" > ../release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum shingo* > SHA256SUMS && cat SHA256SUMS

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.cut.outputs.tag }}
          body_path: release-notes.md
          files: dist/*
