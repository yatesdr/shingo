name: Lint

on:
  push:
    paths:
      - '**.go'
      - '.golangci.yml'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - '**.go'
      - '.golangci.yml'
      - '.github/workflows/lint.yml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [protocol, shared, shingo-core, shingo-edge, integration]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: ${{ matrix.module }}
          args: --build-tags docker --config=${{ github.workspace }}/.golangci.yml --issues-exit-code=1 ./...

  swap-mode-literals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check
        run: bash scripts/check-swap-mode-literals.sh
