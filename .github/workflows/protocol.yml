name: Protocol

on:
  push:
    # main is tested once per push, by auto-release.yml, which calls this
    # workflow as one of its gates; any other branch runs it here.
    branches-ignore: [main]
    paths:
      - "protocol/**"
      # Trigger on this file too. core.yml carries the reasoning: "a gate
      # whose own edits do not run it cannot report on them" — and it was
      # exactly this gap that let a restructuring of the jobs below sit
      # unverified, because nothing in the diff matched any other path.
      - ".github/workflows/protocol.yml"
  pull_request:
    paths:
      - "protocol/**"
      - ".github/workflows/protocol.yml"
  workflow_call:

concurrency:
  # The file name is in the group because a CALLED workflow sees the CALLER's
  # github.workflow: without it, the seven gates auto-release.yml calls share
  # one group and cancel one another as each starts (it cancelled v0.1.0's
  # release run whole).
  group: ${{ github.workflow }}-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          # Without this, the cache is silently OFF. setup-go defaults
          # cache:true, and with no cache-dependency-path it requires `go.mod`
          # in the REPO ROOT (readdirSync, not recursive). This is a go.work
          # repo: the root has go.work and the go.mod files sit one level down,
          # so the lookup throws "Dependencies file is not found ... Supported
          # file pattern: go.mod" — and main.ts catches it into a warning, so
          # the job stays green having restored nothing. It caches both
          # GOMODCACHE and GOCACHE, so every job was re-downloading every
          # module and recompiling from scratch. See core.yml for the full note.
          cache-dependency-path: |
            protocol/go.sum

      - name: Build
        working-directory: protocol
        run: go build ./...

      - name: Test
        working-directory: protocol
        run: go test -tags lockcheck -v ./...

      - name: Test (race)
        working-directory: protocol
        run: go test -tags lockcheck -race -count=1 ./...

