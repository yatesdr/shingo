# shingoedge.edge2.yaml — EDGE 2. LOCAL DEV / SIMULATION ONLY. NOT FOR PRODUCTION.
#
# The second edge instance beside EDGE 1 (shingoedge.dev.yaml). Same Core, same
# Kafka, its own station, its own SQLite, its own plant (plants/edge2.yaml).
#
# WHAT MAKES THIS ONE DIFFERENT IS THE PACING, NOT THE CODE. EDGE 1 is rapid-fire
# and stays that way — it is the regression gate. EDGE 2 exists so a changeover has
# an observable WINDOW: material landing minutes before the changeover completes,
# with decisions taken inside the gap. See plants/edge2.yaml for the scenarios and
# the circularity arithmetic.
#
# ── THE CLOCK IS SHARED, AND IT IS NOW SLOWER ───────────────────────────────
#
# speed/epoch/anchor_wall are IDENTICAL to shingocore.dev.yaml and to EDGE 1, and
# they have to be. Both edges share one Core, sim-now is
# epoch + speed*(wallNow-anchor), and an edge running its own speed drifts against
# the Core it reports to — expired-message drops, and every cross-process deadline
# computed from a different clock. So the speed below is not this file's to choose
# alone: it is changed in all three configs together, or not at all.
#
# It was 10x and the whole stack now runs at 2x (owner's call). The loop could not
# hold steady state at 10x for a units reason worth stating once: the delivery
# pipeline runs on WALL time, so a real round trip of 30-60 s arrived as 300-600
# SIM seconds — against a carrier holding 600 sim-seconds of cover. Replenishment
# was still in flight when the cell it was for hit zero.
#
# Windows are still bought in SIM TIME on top of that — longer tick intervals and
# longer operator delays below — because that is where pacing belongs. At 2x the
# 4-minute cutover delay is two minutes of wall clock and four 60 s reporter ticks
# of sim time, which is the shape the scenarios need.

station_uid: edge2.line1
namespace: edge2
line_id: line1
database_path: /data/shingoedge.db
core_api: http://core:8083

loaders_multi_window: false

warlink:
  enabled: false
  mode: poll

web:
  host: 0.0.0.0
  port: 8081
  session_secret: dev-only-not-a-real-secret

messaging:
  kafka:
    brokers:
      - kafka:9092
  dispatch_topic: shingo.dispatch
  orders_topic: shingo.orders
  outbox_drain_interval: 5s

sim:
  enabled: true
  seed: 2
  # IDENTICAL to core and EDGE 1 — see the note at the top of this file.
  # SLOWED FROM 10x TO 2x (owner's call, 2026-09-05). At 10x the loop could not
  # hold steady state and the reason is a units mismatch, not a tuning miss: the
  # delivery pipeline runs on WALL time (Kafka hop, DB writes, the outbox drain,
  # simulated robot travel), so a ~30-60 s real round trip lands as 300-600 SIM
  # seconds. Consumption is quoted in sim time — 20 parts x 30 s = 600 s of cover —
  # so the round trip ate the entire depletion budget and cells drained past zero
  # while their replenishment was still in flight. At 2x the same real round trip
  # costs 60-120 sim seconds against the same 600, which is the margin the
  # arithmetic assumed all along.
  #
  # MUST MATCH shingocore.dev.yaml AND every edge, and must be changed HERE rather
  # than through POST /api/sim/speed: a live SetSpeed re-anchors per process and
  # breaks the core-edge sync this epoch/anchor pair exists to hold.  #
  # ── CHANGING THIS NUMBER IS A `down -v`, NOT A RESTART ──────────────────────
  #
  # sim-now is epoch + speed*(wallNow-anchor), so changing speed RETIMES THE WHOLE
  # WORLD while the rows already in the database keep the stamps they were written
  # with. Going 10x -> 2x divides elapsed sim time by five: sim-now jumped BACKWARDS
  # about fifteen sim-months, and every order already in flight was left carrying a
  # created_at in the future. Anything reasoning about age, deadlines or "older
  # than" treats those rows as not yet due, forever — they never move again and
  # they look exactly like a wedge.
  #
  # Measured 2026-09-05: 413 orders confirmed cleanly on the new clock while six
  # pre-change survivors sat frozen, and the survivors were read as evidence that
  # the rig was broken. It was not.
  #
  # Reset the data when you change this. The note above about matching core and
  # every edge still applies and is not the same warning.
  speed: 2.0
  # ── THE ANCHOR IS NOT IN THIS FILE ANY MORE ───────────────────────────────
  #
  # It was a hardcoded 2026-07-12T02:30:00Z here, in shingocore.dev.yaml and in
  # the other edge config. A literal origin makes the sim/wall offset grow without
  # bound — (speed-1) x (wallNow - anchor) — so the rig's clock was eight weeks
  # into the future at 2x by 2026-09-06, and every live duration in the UI, all of
  # which are computed against it, read 0 s.
  #
  # The anchor now belongs to the RUN: scripts/sim-anchor.sh mints one at bring-up
  # and compose hands the SAME instant to core and every edge as SHINGO_SIM_ANCHOR,
  # read identically by clock.ResolveAnchor. The lockstep this pair existed to hold
  # is kept; the origin is current. See shingocore.dev.yaml for the full note.

  # plc_name/tag_name MUST match the reporting_points in plants/edge2.yaml exactly.
  # A mismatch is SILENT: the tick fans to no node and the cell simply never counts.
  #
  # 30 s/uop against a 20-uop carrier is the 10-minute depletion the plant file's
  # arithmetic is built on. It is deliberately an order of magnitude slower than
  # EDGE 1's 10 s: this rig is not trying to move material quickly, it is trying to
  # make a several-minute window exist and hold still long enough to be queried.
  processes:
    - plc_name: PRESS-10
      tag_name: PRESS-10_COUNTER
      tick_interval: 30s
      uop_per_tick: 1
    - plc_name: PRESS-11
      tag_name: PRESS-11_COUNTER
      tick_interval: 30s
      uop_per_tick: 1
    # The produce side fills at the same rate it is drained, so the loop neither
    # starves nor pins full — the same rate-parity rule EDGE 1's config states.
    - plc_name: WELD-10
      tag_name: WELD-10_COUNTER
      tick_interval: 30s
      uop_per_tick: 1

  operators:
    enabled: true
    # ── THE DELAY KNOBS ARE THE POINT OF THIS FILE ───────────────────────────
    #
    # The sim's auto-operator is instant by default, and instant collapses every
    # window these scenarios exist to observe. The knobs were already here —
    # SwapRelease says in its own doc that it is configurable precisely because
    # the default closes the window under test, after a run lost that window 480
    # times to a 3-second default. This file is that argument applied to a whole
    # edge rather than one gate.
    #
    # The shape being bought, in sim time:
    #   changeover starts        t+0
    #   material delivered       t+1-2 min   (AMR round trip, observed)
    #   operator releases        t+1 min     (swap_release below)
    #   changeover cuts over     t+4 min     (cutover_delay below)
    #
    # The gap between delivery and cutover is the several minutes S1 and S4 need,
    # and it spans four 60 s reporter ticks rather than none.
    loader_auto_load: 30s
    unloader_auto_clear: 30s
    changeover_auto_cutover: true
    cutover_delay: 4m
    swap_release: 60s

  # Downtime OFF, deliberately. EDGE 1 runs it for OEE realism; here a random
  # outage inside the observation window would be indistinguishable from the
  # defect under test, and a scenario that cannot tell those apart proves nothing.
  downtime:
    enabled: false
