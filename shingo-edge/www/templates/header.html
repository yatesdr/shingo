{{define "header"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Shingo Edge</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico?v={{cacheBust}}">
    <script>
    (function(){var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t})();
    </script>
    {{template "clock-globals" .}}
    <link rel="stylesheet" href="/static/shared/tokens.css?v={{cacheBust}}">
    <link rel="stylesheet" href="/static/shared/status-classes.css?v={{cacheBust}}">
    <link rel="stylesheet" href="/static/shared/components.css?v={{cacheBust}}">
    <link rel="stylesheet" href="/static/css/shingoedge.css?v={{cacheBust}}">
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/htmx-sse.js"></script>
    <script type="module" src="/static/js/shingoedge.js?v={{cacheBust}}"></script>
    <script src="/static/js/theme.js"></script>
</head>
<body>
    <nav>
      <div class="nav-inner">
        <div class="nav-brand">
            <a href="/">Shingo Edge</a>{{ simBadge }}
        </div>
        <div class="nav-links">
            <a href="/production" class="{{if eq .Page "production"}}active{{end}}">Production</a>
            <div class="nav-dropdown">
              <a href="#" class="nav-dropdown-toggle{{if or (eq .Page "orders") (eq .Page "changeover") (eq .Page "processes") (eq .Page "replenishment") (eq .Page "containment")}} active{{end}}">Operations</a>
              <div class="nav-dropdown-menu">
                <a href="/orders"{{if eq .Page "orders"}} class="active"{{end}}>Orders</a>
                <a href="/changeover"{{if eq .Page "changeover"}} class="active"{{end}}>Changeover</a>
                <a href="/processes"{{if eq .Page "processes"}} class="active"{{end}}>Processes</a>
                <a href="/replenishment"{{if eq .Page "replenishment"}} class="active"{{end}}>Replenishment</a>
                <a href="/containment"{{if eq .Page "containment"}} class="active"{{end}}>Quality Containment</a>
              </div>
            </div>
            {{if .Authenticated}}
            <span class="nav-sep"></span>
            <div class="nav-dropdown">
              <a href="#" class="nav-dropdown-toggle{{if or (eq .Page "config") (eq .Page "manual-message") (eq .Page "logs")}} active{{end}}">Admin</a>
              <div class="nav-dropdown-menu">
                <a href="/manual-message"{{if eq .Page "manual-message"}} class="active"{{end}}>Kafka Direct</a>
                <a href="/config"{{if eq .Page "config"}} class="active"{{end}}>Config</a>
                <a href="/diagnostics"{{if eq .Page "logs"}} class="active"{{end}}>Logs</a>
              </div>
            </div>
            {{end}}
        </div>
        <div class="nav-user">
            {{if .Authenticated}}
            <a href="/logout" class="nav-auth-link">Logout</a>
            {{else}}
            <a href="/login" class="nav-auth-link">Login</a>
            {{end}}
            <button class="theme-toggle" data-action="toggleTheme" title="Toggle theme"></button>
        </div>
      </div>
    </nav>
    <main class="container">
{{end}}
