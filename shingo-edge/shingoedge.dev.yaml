# shingoedge.dev.yaml — LOCAL DEV / SIMULATION ONLY. NOT FOR PRODUCTION.
# Loaded by a shingoedge built with -tags sim; refuses to start without
# SHINGO_ALLOW_SIM=1 (T0.3). warlink.enabled:false on purpose — sim mode starts
# the poll loop explicitly against the fake WarLink (T1.3).
#
# station_uid IS EXPLICIT NOW. Nothing composes a station id from namespace/line_id
# any more — that composition was the fleet-wide shared identity the v66 work
# removed — so the dev stack names its own, exactly as a plant Pi carries the uid
# Core minted for it. namespace/line_id below are labels only.
station_uid: edge1.line1
namespace: edge1
line_id: line1
database_path: /data/shingoedge.db
core_api: http://core:8083

# Multi-window loader delivery (C4). On: a shared_window loader spreads its empties
# across its window homes (budget = window count, round-robin to free windows, never
# 2N). Off (production default): empties funnel to the loader's anchor, budget 1 —
# behaviour-identical to the pre-multi-window resolver. The dev sim turns it on so
# the demo's 3-window PLK_001 exercises the spread; flipping it changes only loaders
# actually configured with window homes.
loaders_multi_window: true

warlink:
  enabled: false                    # sim starts the poller explicitly (T1.3); HMI apply is ignored in sim (F2)
  mode: poll

web:
  host: 0.0.0.0
  port: 8081
  session_secret: dev-only-not-a-real-secret

messaging:
  kafka:
    brokers:
      - kafka:9092
  dispatch_topic: shingo.dispatch
  orders_topic: shingo.orders
  outbox_drain_interval: 5s

sim:
  enabled: true
  seed: 1
  # SLOWED FROM 10x TO 2x (owner's call, 2026-09-05). At 10x the loop could not
  # hold steady state and the reason is a units mismatch, not a tuning miss: the
  # delivery pipeline runs on WALL time (Kafka hop, DB writes, the outbox drain,
  # simulated robot travel), so a ~30-60 s real round trip lands as 300-600 SIM
  # seconds. Consumption is quoted in sim time — 20 parts x 30 s = 600 s of cover —
  # so the round trip ate the entire depletion budget and cells drained past zero
  # while their replenishment was still in flight. At 2x the same real round trip
  # costs 60-120 sim seconds against the same 600, which is the margin the
  # arithmetic assumed all along.
  #
  # MUST MATCH shingocore.dev.yaml AND every edge, and must be changed HERE rather
  # than through POST /api/sim/speed: a live SetSpeed re-anchors per process and
  # breaks the core-edge sync this epoch/anchor pair exists to hold.  #
  # ── CHANGING THIS NUMBER IS A `down -v`, NOT A RESTART ──────────────────────
  #
  # sim-now is epoch + speed*(wallNow-anchor), so changing speed RETIMES THE WHOLE
  # WORLD while the rows already in the database keep the stamps they were written
  # with. Going 10x -> 2x divides elapsed sim time by five: sim-now jumped BACKWARDS
  # about fifteen sim-months, and every order already in flight was left carrying a
  # created_at in the future. Anything reasoning about age, deadlines or "older
  # than" treats those rows as not yet due, forever — they never move again and
  # they look exactly like a wedge.
  #
  # Measured 2026-09-05: 413 orders confirmed cleanly on the new clock while six
  # pre-change survivors sat frozen, and the survivors were read as evidence that
  # the rig was broken. It was not.
  #
  # Reset the data when you change this. The note above about matching core and
  # every edge still applies and is not the same warning.
  speed: 5.0
  # Synced RUNNING clock (zero core↔edge drift) — MUST match shingocore.dev.yaml EXACTLY.
  # See that file for the rationale: running-clock mode drifts (boot-skew × speed → expired
  # message drops); epoch + this shared anchor lock both clocks to one timeline, and
  # epoch == anchor_wall means no wall clamp, so the multiplier is real for Now() as well
  # as for every ticker (§R.98 — it was not, for every run before that).
  # ── THE ANCHOR IS NOT IN THIS FILE ANY MORE ───────────────────────────────
  #
  # It was a hardcoded 2026-07-12T02:30:00Z here, in shingocore.dev.yaml and in
  # the other edge config. A literal origin makes the sim/wall offset grow without
  # bound — (speed-1) x (wallNow - anchor) — so the rig's clock was eight weeks
  # into the future at 2x by 2026-09-06, and every live duration in the UI, all of
  # which are computed against it, read 0 s.
  #
  # The anchor now belongs to the RUN: scripts/sim-anchor.sh mints one at bring-up
  # and compose hands the SAME instant to core and every edge as SHINGO_SIM_ANCHOR,
  # read identically by clock.ResolveAnchor. The lockstep this pair existed to hold
  # is kept; the origin is current. See shingocore.dev.yaml for the full note.
  # plc_name/tag_name MUST exactly match the reporting_points the seed tool
  # creates. This list is the source of truth for those names.
  # Rate parity (the anti-starvation core): each press feeds exactly one weld, so press
  # rate = weld rate = 6/min (10s tick, 1 uop/tick). The supermarket is pure decoupling
  # headroom — it sits mid-level, neither pinning full (no overfill jam) nor draining dry
  # (no weld starvation). BRKT has no PLC (loader-fed; WELD-2 drains it at 6/min). Verify
  # with `make dev-rates` (the fill/starve helper).
  processes:
    - plc_name: PRESS-1
      tag_name: PRESS-1_COUNTER
      tick_interval: 10s
      uop_per_tick: 1
    # PRESS-2 IS SLOWER THAN PARITY, ON PURPOSE (acceptance run 2026-09-07).
    #
    # "press rate = weld rate" held for PANEL-A but NOT for PANEL-B, and the
    # difference is input coupling: WELD-1 consumes only PANEL-A, while WELD-2
    # consumes PANEL-B AND BRKT — every BRKT hiccup and every second of WELD-2's
    # own downtime stalls the PANEL-B draw while PRESS-2 keeps making. Measured
    # over the 2026-09-07 acceptance run: PRESS-2 1890 ticks vs WELD-2 1638 —
    # a ~15% PANEL-B excess. The excess is not free storage: PANEL-B rides the
    # 13-carrier STANDARD-SM pool, so accumulating fulls captive-load carriers
    # that should cycle back as empties. At ~70 sim-minutes SYN_PRESS_EMPTIES
    # hit 0 and the press stalled (self-recovered 13:44->14:29, but starved
    # again). A producer must not outpace its sole consumer's EFFECTIVE draw.
    #
    # 12s = 5/min, the same interval WELD-3/WELD-4 carry for the mirrored
    # reason (a component payload entering only via a loader round trip cannot
    # be drained as fast as it is replenished). The 115-uop PANEL-B buffer
    # (~19 min cover) absorbs the gap's variance.
    #
    # `make dev-rates` WILL REPORT PANEL-B AS STARVE (−1.0/min nominal) AND
    # THAT IS EXPECTED AT THIS SETTING: simcalc's nominal check pairs one
    # producer with one consumer at nameplate rates and knows nothing of
    # WELD-2's second input (BRKT) or its downtime. The MEASURED effective
    # draw on the 2026-09-07 run was 1638 PANEL-B ticks in 390 sim-minutes =
    # 4.2/min, and 5/min × 0.85 availability ≈ 4.25/min effective — parity.
    # The nominal verdict is the one to distrust here; the carrier check
    # (dev-rates' second half) is the one that bit before.
    - plc_name: PRESS-2
      tag_name: PRESS-2_COUNTER
      tick_interval: 12s
      uop_per_tick: 1
    # WELD-1 IS BACK TO THE LINE RATE, and the halving it carried was compensation
    # for a drain that no longer exists.
    #
    # It used to read: "PANEL-A is consumed by TWO drains against ONE press: WELD-1
    # and the FGN_002 unloader... Halving WELD-1 (10s -> 20s, 6/min -> 3/min) per
    # the 'slow the consumers so the press keeps up' decision: 3 (WELD-1) + ~3
    # (FGN_002) ~= 6 ~= effective press output."
    #
    # The arithmetic was right for the plant it described. But FGN_002 was a TEST
    # SCAFFOLD -- it existed only so the U1 changeover trigger had an unloader to
    # resolve -- and an unloader on PANEL-A was never legitimate: an unloader takes
    # FINISHED GOODS out, and PANEL-A is work-in-progress that WELD-1 consumes.
    # Measured before its removal, over 81 sim-minutes, it took 16 PANEL-A carriers
    # against WELD-1's 4. So a real weld cell was throttled to half rate to make
    # room for a prop that then out-drew it four to one.
    #
    # With FGN_002 deleted (the UNLOADER-B removal — a test scaffold must not move
    # material) the compensation is stranded, and simcalc says
    # so: PANEL-A went to OVERFILL +3.0/min, PRESS-1 making 6 against WELD-1's 3
    # with nothing else on the payload. Restoring 10s puts the cell back on the
    # plant's reference line rate and squares PANEL-A with PANEL-B, which has always
    # run press 6 / weld 6.
    #
    # THE LESSON WORTH KEEPING: this rate was tuned around a fixture artifact, and
    # the tuning outlived the artifact by looking like a deliberate decision. Before
    # slowing a cell to fix a shortage, check what else is drinking from the payload
    # and whether it has any business being there.
    - plc_name: WELD-1
      tag_name: WELD-1_COUNTER
      tick_interval: 10s
      uop_per_tick: 1
    - plc_name: WELD-2
      tag_name: WELD-2_COUNTER
      tick_interval: 10s
      uop_per_tick: 1
    # Component-leg drains: WELD-3 drains CLIP (single-window loader leg), WELD-4
    # drains STUD (dedicated loader leg).
    #
    # THE COMMENT HERE USED TO SAY "5/min each ... slower than the press loaders
    # (6/min) so the component markets stay biased toward recovery", above two
    # entries set to 10s/1uop — which is 6/min, the same as everything else. The
    # bias it described did not exist, and a component payload that only enters the
    # plant through a loader round trip is exactly the one that cannot afford to be
    # drained as fast as it is replenished.
    #
    # 12s/1uop is 5/min, which is what the intent was. The presses stay at 10s.
    - plc_name: WELD-3
      tag_name: WELD-3_COUNTER
      tick_interval: 12s
      uop_per_tick: 1
    - plc_name: WELD-4
      tag_name: WELD-4_COUNTER
      tick_interval: 12s
      uop_per_tick: 1
    # WELD-5 is the home-return rig's drain (see plants/demo.yaml, PLK_HOMES).
    # Faster than the other component legs on purpose: the rig is here to turn
    # swap cycles over quickly so the park decision is observed many times in a
    # short run, not to be rate-balanced against anything.
    - plc_name: WELD-5
      tag_name: WELD-5_COUNTER
      tick_interval: 6s
      uop_per_tick: 1
  operators:
    enabled: true
    loader_auto_load: 5s
    unloader_auto_clear: 8s
  # Downtime model v1 (G9, §3.1): clustered random outages.
  # Per-machine 85% availability via exponential TBF + bounded MTTR.
  # Produces realistic clustering (good weeks / bad weeks) for OEE.
  downtime:
    enabled: true                     # ON for long-run/OEE realism (85% avail, clustered outages)
    machines:
      - plc_name: PRESS-1
        availability: 0.85
        min_mttr: 5m
        max_mttr: 30m
      - plc_name: PRESS-2
        availability: 0.85
        min_mttr: 5m
        max_mttr: 30m
      - plc_name: WELD-1
        availability: 0.85
        min_mttr: 5m
        max_mttr: 30m
      - plc_name: WELD-2
        availability: 0.85
        min_mttr: 5m
        max_mttr: 30m
      - plc_name: WELD-3
        availability: 0.85
        min_mttr: 5m
        max_mttr: 30m
      - plc_name: WELD-4
        availability: 0.85
        min_mttr: 5m
        max_mttr: 30m
